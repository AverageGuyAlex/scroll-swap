<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#1C1F1D">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%231C1F1D'/%3E%3Crect x='10' y='10' width='160' height='160' rx='30' fill='none' stroke='%23C9A24B' stroke-width='2'/%3E%3Ccircle cx='90' cy='95' r='38' fill='none' stroke='%237A9B7E' stroke-width='10'/%3E%3Cline x1='90' y1='95' x2='90' y2='68' stroke='%237A9B7E' stroke-width='8' stroke-linecap='round'/%3E%3Cline x1='90' y1='95' x2='110' y2='95' stroke='%237A9B7E' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%231C1F1D'/%3E%3Ccircle cx='90' cy='95' r='38' fill='none' stroke='%237A9B7E' stroke-width='10'/%3E%3Cline x1='90' y1='95' x2='90' y2='68' stroke='%237A9B7E' stroke-width='8' stroke-linecap='round'/%3E%3Cline x1='90' y1='95' x2='110' y2='95' stroke='%237A9B7E' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">

<script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: max(28px, env(safe-area-inset-top));
    padding-bottom: env(safe-area-inset-bottom);
  }
  :root {
    --ink: #EDEAE2;
    --ink-dim: #A8A296;
    --bg: #1C1F1D;
    --card: #242824;
    --card-line: #34392F;
    --gold: #C9A24B;
    --sage: #7A9B7E;
    --rust: #B5654A;
    --cat-productivity: #6FA37A;
    --cat-workout: #C1503F;
    --cat-reading: #D9B54A;
  }
  :root.theme-light {
    --ink: #2A2A26;
    --ink-dim: #8A8478;
    --bg: #F3F1EA;
    --card: #FFFFFF;
    --card-line: #DDD8CB;
    --gold: #A97F2E;
    --sage: #4F7A57;
    --rust: #A8503A;
    --cat-productivity: #4F7A57;
    --cat-workout: #A8402F;
    --cat-reading: #A98A2E;
  }

  #app {
    font-family: Georgia, 'Iowan Old Style', serif;
    color: var(--ink);
    background: var(--bg);
    padding: 8px 22px 40px;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
  }

  /* Nav */
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    position: relative;
  }
  .nav-btn {
    font-family: 'Courier New', monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--card-line);
    border-radius: 7px;
    padding: 9px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-dropdown {
    position: absolute;
    top: 42px;
    left: 0;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 10px;
    overflow: hidden;
    z-index: 10;
    min-width: 190px;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .nav-dropdown.open { display: block; }
  .nav-link {
    display: block;
    padding: 12px 16px;
    font-family: 'Courier New', monospace;
    font-size: 12.5px;
    color: var(--ink-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--card-line);
  }
  .nav-link:last-child { border-bottom: none; }
  .nav-link.active { color: var(--gold); }

  .gear-btn {
    width: 38px; height: 38px; border-radius: 8px; background: var(--card); border: 1px solid var(--card-line);
    color: var(--ink-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .gear-dropdown {
    position: absolute; top: 42px; right: 0; background: var(--card); border: 1px solid var(--card-line);
    border-radius: 10px; overflow: hidden; z-index: 10; min-width: 210px; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); padding: 14px 16px;
  }
  .gear-dropdown.open { display: block; }
  .gear-status {
    font-family: 'Courier New', monospace; font-size: 11px; color: var(--ink-dim); margin: 0 0 6px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .gear-email { font-family: Georgia, serif; font-size: 14.5px; color: var(--ink); margin: 0 0 12px; }
  .gear-note { font-family: 'Courier New', monospace; font-size: 11.5px; color: var(--ink-dim); line-height: 1.5; margin: 0; }
  .theme-toggle-row {
    display: flex; gap: 6px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--card-line);
  }
  .theme-btn {
    flex: 1; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase;
    background: var(--bg); color: var(--ink-dim); border: 1px solid var(--card-line); border-radius: 6px;
    padding: 8px 6px; cursor: pointer;
  }
  .theme-btn.selected { background: var(--gold); color: var(--card); border-color: var(--gold); font-weight: 600; }
  .gear-settings-link {
    display: block; text-align: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--card-line);
    font-family: 'Courier New', monospace; font-size: 11.5px; color: var(--ink-dim); text-decoration: none;
  }
  .nav-link.disabled { opacity: 0.4; pointer-events: none; }

  .header { margin-bottom: 18px; }
  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 6px;
  }
  .title {
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    font-family: 'Courier New', monospace;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin: 0;
  }

  .auth-card {
    margin: 16px 0 20px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .auth-status {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .auth-email {
    font-family: Georgia, serif;
    font-size: 14.5px;
    color: var(--ink);
    margin: 2px 0 0;
  }
  .auth-btn {
    font-family: 'Courier New', monospace;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  .auth-btn.secondary {
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--card-line);
  }

  /* Category picker */
  .category-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .cat-btn {
    flex: 1;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: var(--card);
    color: var(--ink-dim);
    border: 1px solid var(--card-line);
    border-radius: 8px;
    padding: 12px 6px;
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
  }
  .cat-btn.selected {
    background: var(--sage);
    color: var(--bg);
    border-color: var(--sage);
    font-weight: 600;
  }

  /* Timer */
  .timer-card {
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 14px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 20px;
  }
  .timer-display {
    font-family: Georgia, serif;
    font-size: 56px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .timer-cat-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin: 0 0 18px;
    min-height: 14px;
  }
  .duration-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .duration-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .duration-input {
    width: 60px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--card-line);
    border-radius: 6px;
    padding: 6px 8px;
    text-align: center;
  }
  .timer-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .timer-btn {
    font-family: 'Courier New', monospace;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: 600;
  }
  .timer-btn.start { background: var(--sage); color: var(--bg); }
  .timer-btn.pause { background: var(--gold); color: var(--bg); }
  .timer-btn.reset { background: transparent; color: var(--ink-dim); border: 1px solid var(--card-line); }
  .timer-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Totals */
  .totals-title {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin: 0 0 10px;
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 4px;
    border-bottom: 1px solid var(--card-line);
  }
  .total-row:last-child { border-bottom: none; }
  .total-name-wrap { display: flex; align-items: center; gap: 10px; }
  .cat-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .total-name { font-size: 15.5px; }
  .total-mins {
    font-family: 'Courier New', monospace;
    font-size: 13px;
  }

  /* Chart toggle + pie chart */
  .chart-toggle-row {
    text-align: center;
    margin-top: 16px;
  }
  .chart-toggle-btn {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--card-line);
    border-radius: 7px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .range-toggle-row {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    width: 100%;
  }
  .range-btn {
    flex: 1;
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: var(--bg);
    color: var(--ink-dim);
    border: 1px solid var(--card-line);
    border-radius: 7px;
    padding: 8px 6px;
    cursor: pointer;
  }
  .range-btn.selected {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
    font-weight: 600;
  }
  .chart-wrap {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 12px;
  }
  .chart-wrap.open { display: flex; }
  .pie {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin-bottom: 16px;
  }
  .pie.empty {
    background: var(--card-line) !important;
  }
  .chart-legend {
    width: 100%;
  }
  .legend-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }
  .legend-name { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .legend-pct { color: var(--ink-dim); }
  .chart-empty-note {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    text-align: center;
  }

  .sync-note {
    margin-top: 16px;
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    color: var(--ink-dim);
    text-align: center;
  }
</style>

<body>
<div id="app">
  <div class="nav-row">
    <button class="nav-btn" id="navToggle">&#9776; Menu</button>
    <div class="nav-dropdown" id="navDropdown">
      <a href="index.html" class="nav-link">Scroll Swap</a>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="goals.html" class="nav-link">Goals</a>
      <a href="lock-in.html" class="nav-link">Lock In</a>
      <a href="pomodoro.html" class="nav-link active">Pomodoro</a>

    </div>
    <button class="gear-btn" id="gearToggle" title="Settings">&#9881;</button>
    <div class="gear-dropdown" id="gearDropdown">
      <div id="gearAccountSection"></div>
      <a href="settings.html" class="gear-settings-link">&#9881; Settings</a>
    </div>
  </div>

  <div class="header">
    <p class="eyebrow">Focus session</p>
    <h1 class="title">Pomodoro</h1>
    <p class="subtitle">Pick a category, run the clock, log the time.</p>
  </div>

  <div class="auth-card" id="authCard">
    <p class="auth-status">Checking login&hellip;</p>
  </div>

  <div class="category-row" id="categoryRow"></div>

  <div class="timer-card">
    <p class="timer-cat-label" id="timerCatLabel"></p>
    <p class="timer-display" id="timerDisplay">25:00</p>
    <div class="duration-row">
      <span class="duration-label">Minutes</span>
      <input type="number" class="duration-input" id="durationInput" value="25" min="1" max="180">
    </div>
    <div class="timer-controls">
      <button class="timer-btn start" id="startBtn">Start</button>
      <button class="timer-btn pause" id="pauseBtn" disabled>Pause</button>
      <button class="timer-btn reset" id="resetBtn">Reset</button>
    </div>
  </div>

  <p class="totals-title">Today's totals</p>
  <div id="totalsList"></div>

  <div class="chart-toggle-row">
    <button class="chart-toggle-btn" id="chartToggleBtn">Show pie chart</button>
  </div>
  <div class="chart-wrap" id="chartWrap">
    <div class="range-toggle-row" id="rangeToggleRow">
      <button class="range-btn selected" data-range="1">Today</button>
      <button class="range-btn" data-range="7">Last 7 days</button>
      <button class="range-btn" data-range="30">Last 30 days</button>
    </div>
    <div class="pie" id="pieCircle"></div>
    <div class="chart-legend" id="chartLegend"></div>
  </div>

  <p class="sync-note" id="syncNote"></p>
</div>

<script>
(function() {
  const STORAGE_PREFIX = 'pomodoro_';
  const FUNCTION_URL = '/.netlify/functions/pomodoro';

  const CATEGORIES = [
    { id: 'productivity', label: 'Productivity', color: 'var(--cat-productivity)' },
    { id: 'workout', label: 'Working Out', color: 'var(--cat-workout)' },
    { id: 'reading', label: 'Reading', color: 'var(--cat-reading)' },
  ];

  let selectedCategory = 'productivity';
  let durationSeconds = 25 * 60;
  let timerDisplayHandle = null;
  let todayTotals = {};
  let currentUser = null;
  let syncing = false;

  const TIMER_STATE_KEY = 'scrollswap_pomodoro_timer';

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function todayStorageKey() { return STORAGE_PREFIX + dateKey(new Date()); }

  function loadToday() {
    try {
      const raw = localStorage.getItem(todayStorageKey());
      todayTotals = raw ? JSON.parse(raw) : {};
    } catch (e) { todayTotals = {}; }
  }

  function saveTodayLocal() {
    try {
      localStorage.setItem(todayStorageKey(), JSON.stringify(todayTotals));
    } catch (e) { console.error('Local save failed', e); }
  }

  function formatTime(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // ---- Persistent timer state (survives page navigation, tab switches, reloads) ----

  function defaultTimerState() {
    return {
      category: 'productivity',
      durationSeconds: 25 * 60,
      remainingAtAnchor: 25 * 60,
      anchorTimestamp: null,
      running: false,
    };
  }

  function loadTimerState() {
    try {
      const raw = localStorage.getItem(TIMER_STATE_KEY);
      return raw ? JSON.parse(raw) : defaultTimerState();
    } catch (e) { return defaultTimerState(); }
  }

  function saveTimerState(ts) {
    try { localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(ts)); }
    catch (e) { console.error('Timer state save failed', e); }
  }

  function currentRemaining(ts) {
    if (!ts.running) return ts.remainingAtAnchor;
    const elapsed = Math.floor((Date.now() - ts.anchorTimestamp) / 1000);
    return Math.max(0, ts.remainingAtAnchor - elapsed);
  }

  // ---- Server sync ----

  function collectAllLocalHistory() {
    const history = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(STORAGE_PREFIX)) {
        const date = key.slice(STORAGE_PREFIX.length);
        try { history[date] = JSON.parse(localStorage.getItem(key)); } catch (e) {}
      }
    }
    return history;
  }

  function writeHistoryToLocal(history) {
    Object.keys(history || {}).forEach(date => {
      localStorage.setItem(STORAGE_PREFIX + date, JSON.stringify(history[date]));
    });
  }

  async function pullFromServer() {
    if (!currentUser) return;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(FUNCTION_URL, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const serverHistory = await res.json();
      writeHistoryToLocal(serverHistory);
    } catch (e) { console.error('Pull failed', e); }
  }

  async function pushToServer() {
    if (!currentUser) return;
    syncing = true;
    renderSyncNote();
    try {
      const token = await currentUser.jwt();
      const history = collectAllLocalHistory();
      await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(history),
      });
    } catch (e) {
      console.error('Push failed', e);
    } finally {
      syncing = false;
      renderSyncNote();
    }
  }

  function renderSyncNote() {
    const el = document.getElementById('syncNote');
    if (!el) return;
    if (!currentUser) el.textContent = 'Not synced \u2014 log in to save across devices';
    else if (syncing) el.textContent = 'Syncing\u2026';
    else el.textContent = 'Synced to your account';
  }

  // ---- Logging time ----

  async function logMinutes(category, minutes) {
    if (minutes <= 0) return;
    todayTotals[category] = (todayTotals[category] || 0) + minutes;
    saveTodayLocal();
    renderTotals();
    if (currentUser) await pushToServer();
  }

  // ---- Category UI ----

  function renderCategoryRow() {
    const row = document.getElementById('categoryRow');
    row.innerHTML = CATEGORIES.map(c => `
      <button class="cat-btn ${c.id === selectedCategory ? 'selected' : ''}" data-id="${c.id}"
        style="${c.id === selectedCategory ? `background:${c.color}; border-color:${c.color};` : ''}">${c.label}</button>
    `).join('');
    row.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const ts = loadTimerState();
        if (ts.running || ts.remainingAtAnchor !== ts.durationSeconds) return; // don't allow switching mid-session
        selectedCategory = btn.dataset.id;
        ts.category = selectedCategory;
        saveTimerState(ts);
        renderCategoryRow();
        renderTimerLabel();
      });
    });
  }

  function renderTimerLabel() {
    const cat = CATEGORIES.find(c => c.id === selectedCategory);
    const label = document.getElementById('timerCatLabel');
    label.textContent = cat ? cat.label : '';
    label.style.color = cat ? cat.color : '';
  }

  // ---- Timer logic ----

  function renderTimerDisplay(remaining) {
    document.getElementById('timerDisplay').textContent = formatTime(remaining);
  }

  function setControlsState(ts) {
    const fresh = !ts.running && ts.remainingAtAnchor === ts.durationSeconds;
    const paused = !ts.running && !fresh;
    document.getElementById('startBtn').disabled = ts.running || paused;
    document.getElementById('durationInput').disabled = ts.running || paused;
    document.getElementById('resetBtn').disabled = false;
    const pauseBtn = document.getElementById('pauseBtn');
    pauseBtn.disabled = fresh;
    pauseBtn.textContent = ts.running ? 'Pause' : 'Resume';
  }

  function stopDisplayTicker() {
    if (timerDisplayHandle) {
      clearInterval(timerDisplayHandle);
      timerDisplayHandle = null;
    }
  }

  function tick() {
    const ts = loadTimerState();
    if (!ts.running) { stopDisplayTicker(); return; }
    const remaining = currentRemaining(ts);
    renderTimerDisplay(remaining);
    if (remaining <= 0) {
      completeTimer(ts);
    }
  }

  function startDisplayTicker() {
    stopDisplayTicker();
    timerDisplayHandle = setInterval(tick, 1000);
  }

  async function completeTimer(ts) {
    stopDisplayTicker();
    const minutesElapsed = Math.round(ts.durationSeconds / 60);
    const freshState = defaultTimerState();
    freshState.category = ts.category;
    freshState.durationSeconds = ts.durationSeconds;
    freshState.remainingAtAnchor = ts.durationSeconds;
    saveTimerState(freshState);
    renderTimerDisplay(freshState.remainingAtAnchor);
    setControlsState(freshState);
    await logMinutes(ts.category, minutesElapsed);
  }

  function startTimer() {
    const ts = loadTimerState();
    if (ts.running) return;
    ts.running = true;
    ts.anchorTimestamp = Date.now();
    ts.category = selectedCategory;
    ts.durationSeconds = durationSeconds;
    if (ts.remainingAtAnchor !== durationSeconds) {
      // stale leftover from a different duration setting; treat as fresh
      ts.remainingAtAnchor = durationSeconds;
    }
    saveTimerState(ts);
    setControlsState(ts);
    startDisplayTicker();
    renderTimerDisplay(currentRemaining(ts));
  }

  function togglePauseResume() {
    const ts = loadTimerState();
    if (ts.running) {
      // Pause: freeze the remaining time
      ts.remainingAtAnchor = currentRemaining(ts);
      ts.running = false;
      ts.anchorTimestamp = null;
      saveTimerState(ts);
      stopDisplayTicker();
      renderTimerDisplay(ts.remainingAtAnchor);
      setControlsState(ts);
    } else {
      // Resume
      if (ts.remainingAtAnchor <= 0 || ts.remainingAtAnchor === ts.durationSeconds) return;
      ts.running = true;
      ts.anchorTimestamp = Date.now();
      saveTimerState(ts);
      startDisplayTicker();
      renderTimerDisplay(currentRemaining(ts));
      setControlsState(ts);
    }
  }

  function resetTimer() {
    stopDisplayTicker();
    const ts = defaultTimerState();
    ts.category = selectedCategory;
    ts.durationSeconds = durationSeconds;
    ts.remainingAtAnchor = durationSeconds;
    saveTimerState(ts);
    renderTimerDisplay(ts.remainingAtAnchor);
    setControlsState(ts);
  }

  function onDurationChange() {
    const val = parseInt(document.getElementById('durationInput').value, 10);
    const clamped = Math.min(180, Math.max(1, isNaN(val) ? 25 : val));
    durationSeconds = clamped * 60;
    const ts = loadTimerState();
    if (!ts.running && ts.remainingAtAnchor === ts.durationSeconds) {
      ts.durationSeconds = durationSeconds;
      ts.remainingAtAnchor = durationSeconds;
      saveTimerState(ts);
      renderTimerDisplay(durationSeconds);
    }
  }

  async function restoreTimerOnLoad() {
    const ts = loadTimerState();
    selectedCategory = ts.category || 'productivity';
    durationSeconds = ts.durationSeconds || 25 * 60;
    document.getElementById('durationInput').value = Math.round(durationSeconds / 60);

    if (ts.running) {
      const remaining = currentRemaining(ts);
      if (remaining <= 0) {
        await completeTimer(ts);
        return;
      }
      renderTimerDisplay(remaining);
      setControlsState(ts);
      startDisplayTicker();
    } else {
      renderTimerDisplay(ts.remainingAtAnchor);
      setControlsState(ts);
    }
  }

  // ---- Totals UI ----

  function renderTotals() {
    const list = document.getElementById('totalsList');
    list.innerHTML = CATEGORIES.map(c => `
      <div class="total-row">
        <span class="total-name-wrap">
          <span class="cat-dot" style="background:${c.color}"></span>
          <span class="total-name">${c.label}</span>
        </span>
        <span class="total-mins" style="color:${c.color}">${todayTotals[c.id] || 0} min</span>
      </div>
    `).join('');
    renderChart();
  }

  // ---- Pie chart ----

  let chartOpen = false;
  let chartRange = 1; // 1, 7, or 30 days

  function getTotalsForRange(days) {
    const totals = {};
    const cursor = new Date();
    for (let i = 0; i < days; i++) {
      const key = STORAGE_PREFIX + dateKey(cursor);
      try {
        const raw = localStorage.getItem(key);
        if (raw) {
          const dayTotals = JSON.parse(raw);
          Object.keys(dayTotals).forEach(catId => {
            totals[catId] = (totals[catId] || 0) + (dayTotals[catId] || 0);
          });
        }
      } catch (e) {}
      cursor.setDate(cursor.getDate() - 1);
    }
    return totals;
  }

  function rangeLabel(days) {
    if (days === 1) return 'today';
    return `the last ${days} days`;
  }

  function renderChart() {
    const pie = document.getElementById('pieCircle');
    const legend = document.getElementById('chartLegend');
    if (!pie || !legend) return;

    const rangeTotals = getTotalsForRange(chartRange);
    const total = CATEGORIES.reduce((sum, c) => sum + (rangeTotals[c.id] || 0), 0);

    if (total === 0) {
      pie.classList.add('empty');
      pie.style.background = '';
      legend.innerHTML = `<p class="chart-empty-note">No sessions logged for ${rangeLabel(chartRange)}</p>`;
      return;
    }

    pie.classList.remove('empty');

    let cursor = 0;
    const segments = CATEGORIES.map(c => {
      const minutes = rangeTotals[c.id] || 0;
      const pct = (minutes / total) * 100;
      const start = cursor;
      const end = cursor + pct;
      cursor = end;
      return { color: c.color, start, end, pct, label: c.label };
    });

    const gradientParts = segments
      .filter(s => s.pct > 0)
      .map(s => `${s.color} ${s.start}% ${s.end}%`)
      .join(', ');

    pie.style.background = `conic-gradient(${gradientParts})`;

    legend.innerHTML = segments.map(s => `
      <div class="legend-row">
        <span class="legend-name">
          <span class="cat-dot" style="background:${s.color}"></span>
          ${s.label}
        </span>
        <span class="legend-pct">${Math.round(s.pct)}%</span>
      </div>
    `).join('');
  }

  function initChartToggle() {
    const btn = document.getElementById('chartToggleBtn');
    const wrap = document.getElementById('chartWrap');
    btn.addEventListener('click', () => {
      chartOpen = !chartOpen;
      wrap.classList.toggle('open', chartOpen);
      btn.textContent = chartOpen ? 'Hide pie chart' : 'Show pie chart';
      if (chartOpen) renderChart();
    });

    document.querySelectorAll('.range-btn').forEach(rangeBtn => {
      rangeBtn.addEventListener('click', () => {
        chartRange = parseInt(rangeBtn.dataset.range, 10);
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('selected'));
        rangeBtn.classList.add('selected');
        renderChart();
      });
    });
  }

  // ---- Auth UI ----

  function renderAuthLoggedOut() {
    const card = document.getElementById('authCard');
    card.style.display = 'flex';
    card.innerHTML = `
      <div>
        <p class="auth-status">Not logged in</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="auth-btn secondary" id="loginBtn">Log in</button>
        <button class="auth-btn" id="signupBtn">Sign up</button>
      </div>
    `;
    document.getElementById('signupBtn').addEventListener('click', () => netlifyIdentity.open('signup'));
    document.getElementById('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'));

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Not logged in</p>
      <p class="gear-note">Log in to see account options here.</p>
    `;
  }

  function renderAuthLoggedIn(user) {
    const card = document.getElementById('authCard');
    card.style.display = 'none';
    card.innerHTML = '';

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Logged in</p>
      <p class="gear-email">${user.email}</p>
      <button class="auth-btn secondary" id="logoutBtn" style="width:100%;">Log out</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', () => netlifyIdentity.logout());
  }

  // ---- Theme ----

  function applyTheme(theme) {
    document.documentElement.classList.toggle('theme-light', theme === 'light');
    document.querySelectorAll('.theme-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.theme === theme);
    });
  }

  function initTheme() {
    let saved = 'dark';
    try {
      saved = localStorage.getItem('scrollswap_theme') || 'dark';
    } catch (e) {}
    applyTheme(saved);
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const theme = btn.dataset.theme;
        applyTheme(theme);
        try { localStorage.setItem('scrollswap_theme', theme); } catch (e) {}
      });
    });
  }

  // ---- Nav dropdown ----

  function initNav() {
    const toggle = document.getElementById('navToggle');
    const dropdown = document.getElementById('navDropdown');
    const gearToggle = document.getElementById('gearToggle');
    const gearDropdown = document.getElementById('gearDropdown');

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      gearDropdown.classList.remove('open');
      dropdown.classList.toggle('open');
    });
    gearToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.remove('open');
      gearDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => {
      dropdown.classList.remove('open');
      gearDropdown.classList.remove('open');
    });
  }

  // ---- Init ----

  function initApp() {
    initTheme();
    document.getElementById('timerDisplay').textContent = '--:--';
    document.getElementById('startBtn').disabled = true;
    document.getElementById('pauseBtn').disabled = true;
    document.getElementById('resetBtn').disabled = true;
    renderCategoryRow();
    renderTimerLabel();
    initNav();
    initChartToggle();

    document.getElementById('startBtn').addEventListener('click', startTimer);
    document.getElementById('pauseBtn').addEventListener('click', togglePauseResume);
    document.getElementById('resetBtn').addEventListener('click', resetTimer);
    document.getElementById('durationInput').addEventListener('change', onDurationChange);

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        const ts = loadTimerState();
        if (ts.running) {
          const remaining = currentRemaining(ts);
          if (remaining <= 0) {
            await completeTimer(ts);
          } else {
            renderTimerDisplay(remaining);
          }
        }
      }
    });
  }

  // Runs once we know whether the person is logged in (and, if so, once their
  // latest synced data has been pulled) — only then is it safe to check whether
  // the timer finished while the app was closed, so a real completion never
  // gets silently overwritten by an out-of-date server pull.
  async function finishInitialLoad() {
    loadToday();
    await restoreTimerOnLoad();
    renderCategoryRow();
    renderTimerLabel();
    renderTotals();
  }

  function initIdentity() {
    if (typeof netlifyIdentity === 'undefined') {
      document.getElementById('authCard').innerHTML =
        '<p class="auth-status">Identity widget failed to load. Check your connection and reload.</p>';
      finishInitialLoad();
      return;
    }

    netlifyIdentity.on('init', async user => {
      currentUser = user || null;
      if (user) {
        renderAuthLoggedIn(user);
        await pullFromServer();
      } else {
        renderAuthLoggedOut();
      }
      await finishInitialLoad();
      renderSyncNote();
    });

    netlifyIdentity.on('login', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      netlifyIdentity.close();
      await pullFromServer();
      await finishInitialLoad();
      await pushToServer();
    });

    netlifyIdentity.on('logout', () => {
      currentUser = null;
      renderAuthLoggedOut();
      renderSyncNote();
    });

    netlifyIdentity.on('signup', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      await pushToServer();
    });

    netlifyIdentity.init();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initApp();
    if (typeof netlifyIdentity !== 'undefined') {
      initIdentity();
    } else {
      window.addEventListener('load', initIdentity);
    }
  });
})();
</script>
</body>
</html>
