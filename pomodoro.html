<style>
  /* Page-specific: pomodoro */

  /* Category picker pills */
  .category-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .cat-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--card);
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 11px 6px;
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
    box-shadow: var(--shadow-card);
  }
  .cat-btn.selected {
    color: #FFFFFF;
    border-color: transparent;
  }
  .cat-btn.selected .cat-dot { background: #FFFFFF !important; }

  /* Timer card */
  .timer-card {
    position: relative; /* anchors the progress ring overlay */
    background: var(--grad-timer);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-float);
    padding: 26px 20px;
    text-align: center;
    margin-bottom: 20px;
  }
  /* Progress ring — a glowing line tracing the inner edge of the card that
     drains counter-clockwise as the session runs down. Colour follows the
     selected category (sky blue on a break) and is set from JS via
     --ring-color, so the stroke and its glow always match. */
  .timer-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* must never intercept taps on the buttons beneath */
    overflow: visible;    /* let the glow spill past the edge */
  }
  .timer-ring path {
    fill: none;
    stroke: var(--ring-color, var(--primary));
    stroke-width: 2.5;
    stroke-linecap: round;
    filter: drop-shadow(0 0 4px var(--ring-color, var(--primary)));
    transition: stroke-dashoffset 1s linear; /* smooths the 1Hz tick into a continuous drain */
  }
  /* Applied while the value jumps for a reason other than time passing
     (start, reset, mode switch, restore after reload) so it doesn't sweep. */
  .timer-ring.no-anim path { transition: none; }
  .timer-cat-label {
    display: inline-block;
    font-weight: 800;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #FFFFFF;
    background: var(--primary);
    border-radius: var(--r-pill);
    padding: 6px 14px;
    margin: 0 0 14px;
    min-height: 14px;
  }
  .timer-display {
    font-family: var(--font-display);
    font-size: 64px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.01em;
    margin: 0 0 8px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .duration-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .duration-label {
    font-weight: 800;
    font-size: 10.5px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .duration-input {
    width: 64px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 7px 8px;
    text-align: center;
  }
  .timer-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .timer-btn {
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    border-radius: var(--r-pill);
    padding: 12px 20px;
    cursor: pointer;
    box-shadow: var(--shadow-card);
  }
  .timer-btn.start { background: var(--green); color: #FFFFFF; }
  .timer-btn.pause { background: var(--primary); color: var(--on-primary); }
  .timer-btn.reset { background: var(--card); color: var(--ink-dim); border: 1px solid var(--line); }
  .timer-btn.break { background: var(--acc-sky); color: #FFFFFF; }
  .timer-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  /* Break controls, separated from the focus controls by a hairline. */
  .break-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  /* Totals */
  .totals-title {
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--primary);
    margin: 0 0 10px;
  }
  #totalsList {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    padding: 4px 16px;
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .total-row:last-child { border-bottom: none; }
  .total-name-wrap { display: flex; align-items: center; gap: 10px; }
  .cat-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .total-name { font-weight: 700; font-size: 14px; }
  .total-mins { font-weight: 800; font-size: 12.5px; }

  /* Chart toggle + pie chart */
  .chart-toggle-row {
    text-align: center;
    margin-top: 16px;
  }
  .chart-toggle-btn {
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--card);
    color: var(--primary);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 10px 20px;
    cursor: pointer;
    box-shadow: var(--shadow-card);
  }
  .range-toggle-row {
    display: flex;
    gap: 4px;
    margin-bottom: 18px;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 4px;
  }
  .range-btn {
    flex: 1;
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: transparent;
    color: var(--ink-dim);
    border: none;
    border-radius: var(--r-pill);
    padding: 8px 6px;
    cursor: pointer;
  }
  .range-btn.selected { background: var(--primary); color: var(--on-primary); }

  .chart-wrap {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
  }
  .chart-wrap.open { display: flex; }
  .pie-wrap { position: relative; width: 156px; height: 156px; margin-bottom: 16px; }
  .pie { width: 100%; height: 100%; border-radius: 50%; }
  .pie.empty { background: var(--line) !important; }
  .pie-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 62px; height: 62px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: var(--shadow-card);
  }
  .chart-legend { width: 100%; }
  .legend-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px;
    font-weight: 700;
    font-size: 12.5px;
  }
  .legend-name { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .legend-pct { color: var(--ink-dim); }
  .chart-empty-note {
    font-weight: 600;
    font-size: 12px;
    color: var(--ink-dim);
    text-align: center;
  }

  .sync-note { margin-top: 16px; }
</style>

<body>

<script>
(function() {
  const STORAGE_PREFIX = 'pomodoro_';
  const FUNCTION_URL = '/.netlify/functions/pomodoro';

  const CATEGORIES = [
    { id: 'productivity', label: 'Productivity', color: 'var(--cat-productivity)' },
    { id: 'workout', label: 'Working Out', color: 'var(--cat-workout)' },
    { id: 'reading', label: 'Reading', color: 'var(--cat-reading)' },
  ];

  let selectedCategory = 'productivity';
  let durationSeconds = 25 * 60;
  let timerDisplayHandle = null;
  let todayTotals = {};
  let currentUser = null;
  let syncing = false;
  let syncFailed = false;

  const TIMER_STATE_KEY = 'scrollswap_pomodoro_timer';
  /* Deliberately under the 'scrollswap_' prefix, NOT 'pomodoro_':
     collectAllLocalHistory() sweeps every pomodoro_* key and treats the suffix
     as a date, so a settings key there would be synced as a bogus day entry
     and pollute the totals and the pie chart. */
  const BREAK_MINUTES_KEY = 'scrollswap_pomodoro_break_minutes';

  let breakSeconds = 5 * 60;

  function loadBreakMinutes() {
    try {
      const raw = localStorage.getItem(BREAK_MINUTES_KEY);
      const val = raw !== null ? parseInt(raw, 10) : 5;
      return (isNaN(val) || val < 1 || val > 60) ? 5 : val;
    } catch (e) { return 5; }
  }

  function saveBreakMinutes(minutes) {
    try { localStorage.setItem(BREAK_MINUTES_KEY, String(minutes)); } catch (e) {}
  }

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function todayStorageKey() { return STORAGE_PREFIX + dateKey(new Date()); }

  function loadToday() {
    try {
      const raw = localStorage.getItem(todayStorageKey());
      todayTotals = raw ? JSON.parse(raw) : {};
    } catch (e) { todayTotals = {}; }
  }

  function saveTodayLocal() {
    try {
      localStorage.setItem(todayStorageKey(), JSON.stringify(todayTotals));
    } catch (e) { console.error('Local save failed', e); }
  }

  function formatTime(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // ---- Persistent timer state (survives page navigation, tab switches, reloads) ----

  function defaultTimerState() {
    return {
      category: 'productivity',
      mode: 'focus',                     // 'focus' | 'break' — what the clock is counting
      durationSeconds: 25 * 60,          // length of whatever is currently running
      focusDurationSeconds: 25 * 60,     // remembers the focus length while a break is running
      remainingAtAnchor: 25 * 60,
      anchorTimestamp: null,
      running: false,
    };
  }

  function loadTimerState() {
    try {
      const raw = localStorage.getItem(TIMER_STATE_KEY);
      if (!raw) return defaultTimerState();
      const ts = JSON.parse(raw);
      // Backfill for states saved before breaks existed — a session already in
      // progress when this shipped must keep running, not reset.
      if (ts.mode !== 'break') ts.mode = 'focus';
      if (typeof ts.focusDurationSeconds !== 'number') {
        ts.focusDurationSeconds = ts.mode === 'focus' ? ts.durationSeconds : 25 * 60;
      }
      return ts;
    } catch (e) { return defaultTimerState(); }
  }

  /* A fresh, stopped focus session at the remembered focus length. Used
     whenever a break ends or is cancelled, and by Reset. */
  function freshFocusState(ts) {
    const next = defaultTimerState();
    next.category = ts.category;
    next.focusDurationSeconds = ts.focusDurationSeconds;
    next.durationSeconds = ts.focusDurationSeconds;
    next.remainingAtAnchor = ts.focusDurationSeconds;
    return next;
  }

  function saveTimerState(ts) {
    try { localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(ts)); }
    catch (e) { console.error('Timer state save failed', e); }
  }

  function currentRemaining(ts) {
    if (!ts.running) return ts.remainingAtAnchor;
    const elapsed = Math.floor((Date.now() - ts.anchorTimestamp) / 1000);
    return Math.max(0, ts.remainingAtAnchor - elapsed);
  }

  // ---- Server sync ----

  function collectAllLocalHistory() {
    const history = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(STORAGE_PREFIX)) {
        const date = key.slice(STORAGE_PREFIX.length);
        try { history[date] = JSON.parse(localStorage.getItem(key)); } catch (e) {}
      }
    }
    return history;
  }

  function writeHistoryToLocal(history) {
    Object.keys(history || {}).forEach(date => {
      localStorage.setItem(STORAGE_PREFIX + date, JSON.stringify(history[date]));
    });
  }

  function hasLocalData() {
    return Object.keys(collectAllLocalHistory()).length > 0;
  }

  /* Returns true only if the download actually completed. Callers MUST check
     this before uploading: pushing after a failed download would overwrite the
     server copy with whatever this device happens to hold, which may be nothing
     (e.g. a brand new browser, or a fresh domain — localStorage is per-domain). */
  async function pullFromServer() {
    if (!currentUser) return false;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(FUNCTION_URL, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) { syncFailed = true; return false; }
      const serverHistory = await res.json();
      writeHistoryToLocal(serverHistory);
      syncFailed = false;
      return true;
    } catch (e) {
      console.error('Pull failed', e);
      syncFailed = true;
      return false;
    }
  }

  async function pushToServer() {
    if (!currentUser) return;
    syncing = true;
    renderSyncNote();
    try {
      const token = await currentUser.jwt();
      const history = collectAllLocalHistory();
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(history),
      });
      syncFailed = !res.ok;
    } catch (e) {
      console.error('Push failed', e);
      syncFailed = true;
    } finally {
      syncing = false;
      renderSyncNote();
    }
  }

  function renderSyncNote() {
    const el = document.getElementById('syncNote');
    if (!el) return;
    if (!currentUser) el.textContent = 'Not synced — log in to save across devices';
    else if (syncing) el.textContent = 'Syncing…';
    else if (syncFailed) el.textContent = '⚠ Sync failed — this device’s data is safe, but not saved to your account';
    else el.textContent = 'Synced to your account';
  }

  // ---- Logging time ----

  async function logMinutes(category, minutes) {
    if (minutes <= 0) return;
    todayTotals[category] = (todayTotals[category] || 0) + minutes;
    saveTodayLocal();
    renderTotals();
    if (currentUser) await pushToServer();
  }

  // ---- Category UI ----

  function renderCategoryRow() {
    const row = document.getElementById('categoryRow');
    row.innerHTML = CATEGORIES.map(c => `
      <button class="cat-btn ${c.id === selectedCategory ? 'selected' : ''}" data-id="${c.id}"
        style="${c.id === selectedCategory ? `background:${c.color};` : ''}"><span class="cat-dot" style="background:${c.color}"></span>${c.label}</button>
    `).join('');
    row.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const ts = loadTimerState();
        if (ts.running || ts.remainingAtAnchor !== ts.durationSeconds) return; // don't allow switching mid-session
        selectedCategory = btn.dataset.id;
        ts.category = selectedCategory;
        saveTimerState(ts);
        renderCategoryRow();
        setControlsState(ts); // repaints the label and the ring in the new colour
      });
    });
  }

  function renderTimerLabel(ts) {
    const label = document.getElementById('timerCatLabel');
    const state = ts || loadTimerState();
    if (state.mode === 'break') {
      label.textContent = 'Break';
      label.style.background = 'var(--acc-sky)';
      return;
    }
    const cat = CATEGORIES.find(c => c.id === selectedCategory);
    label.textContent = cat ? cat.label : '';
    label.style.background = cat ? cat.color : '';
  }

  // ---- Progress ring ----

  const RING_INSET = 2.25; // half the 2.5px stroke, +1px, so it sits inside the card border
  let ringLength = 0;

  /* Rounded-rect path traversed COUNTER-CLOCKWISE from top-centre: left along
     the top edge, down the left side, right along the bottom, up the right
     side. Drawing it in that direction is what makes stroke-dashoffset eat the
     line counter-clockwise as the session drains. All four arcs use sweep-flag
     0 for the same reason. */
  function roundedRectPath(inset, w, h, r) {
    const x0 = inset, y0 = inset, x1 = w - inset, y1 = h - inset;
    const rr = Math.max(0, Math.min(r, (x1 - x0) / 2, (y1 - y0) / 2));
    return [
      `M ${x0 + (x1 - x0) / 2} ${y0}`,
      `H ${x0 + rr}`,
      `A ${rr} ${rr} 0 0 0 ${x0} ${y0 + rr}`,
      `V ${y1 - rr}`,
      `A ${rr} ${rr} 0 0 0 ${x0 + rr} ${y1}`,
      `H ${x1 - rr}`,
      `A ${rr} ${rr} 0 0 0 ${x1} ${y1 - rr}`,
      `V ${y0 + rr}`,
      `A ${rr} ${rr} 0 0 0 ${x1 - rr} ${y0}`,
      'Z',
    ].join(' ');
  }

  function rebuildRingGeometry() {
    const card = document.getElementById('timerCard');
    const path = document.getElementById('timerRingPath');
    if (!card || !path) return;
    const w = card.clientWidth, h = card.clientHeight;
    if (!w || !h) return;
    const radius = parseFloat(getComputedStyle(card).borderTopLeftRadius) || 20;
    path.setAttribute('d', roundedRectPath(RING_INSET, w, h, Math.max(0, radius - RING_INSET)));
    ringLength = path.getTotalLength();
    path.style.strokeDasharray = String(ringLength);
  }

  function ringColorFor(ts) {
    if (ts.mode === 'break') return 'var(--acc-sky)';
    const cat = CATEGORIES.find(c => c.id === ts.category);
    return cat ? cat.color : 'var(--primary)';
  }

  /* animate=true only for the once-a-second tick, where the CSS transition
     turns 1Hz updates into one continuous drain. Everything else is a jump
     (start, reset, mode switch, restore after a reload) and must not sweep. */
  function renderTimerRing(ts, remaining, animate) {
    const svg = document.getElementById('timerRing');
    const path = document.getElementById('timerRingPath');
    if (!svg || !path) return;
    if (!ringLength) rebuildRingGeometry();
    if (!ringLength) return;
    svg.style.setProperty('--ring-color', ringColorFor(ts));
    const total = ts.durationSeconds > 0 ? ts.durationSeconds : 1;
    const fraction = Math.max(0, Math.min(1, remaining / total));
    if (!animate) {
      svg.classList.add('no-anim');
      void svg.offsetWidth; // commit the class before the value changes
    }
    path.style.strokeDashoffset = String(ringLength * (1 - fraction));
    if (!animate) {
      void svg.offsetWidth; // commit the value before transitions come back
      svg.classList.remove('no-anim');
    }
  }

  /* The card changes height with the break row, the theme, the viewport and
     late-loading web fonts, so the geometry can't be measured just once. */
  function initTimerRing() {
    const card = document.getElementById('timerCard');
    if (!card) return;
    rebuildRingGeometry();
    if (typeof ResizeObserver === 'undefined') return;
    new ResizeObserver(() => {
      rebuildRingGeometry();
      const ts = loadTimerState();
      renderTimerRing(ts, currentRemaining(ts), false);
    }).observe(card);
  }

  // ---- Timer logic ----

  function renderTimerDisplay(remaining) {
    document.getElementById('timerDisplay').textContent = formatTime(remaining);
  }

  function setControlsState(ts) {
    const fresh = !ts.running && ts.remainingAtAnchor === ts.durationSeconds;
    const paused = !ts.running && !fresh;
    const onBreak = ts.mode === 'break';
    // Start stays live during a break — pressing it ends the break and starts
    // a focus session, which is the point of it.
    document.getElementById('startBtn').disabled = onBreak ? false : (ts.running || paused);
    document.getElementById('durationInput').disabled = onBreak ? false : (ts.running || paused);
    document.getElementById('resetBtn').disabled = false;
    const pauseBtn = document.getElementById('pauseBtn');
    pauseBtn.disabled = fresh;
    pauseBtn.textContent = ts.running ? 'Pause' : 'Resume';
    const breakBtn = document.getElementById('breakBtn');
    breakBtn.disabled = false;
    breakBtn.textContent = onBreak ? 'End break' : 'Start break';
    document.getElementById('breakInput').disabled = onBreak;
    // Single hook for everything that changes state: keeps the label and the
    // ring in step without every caller having to remember them.
    renderTimerLabel(ts);
    renderTimerRing(ts, currentRemaining(ts), false);
  }

  function stopDisplayTicker() {
    if (timerDisplayHandle) {
      clearInterval(timerDisplayHandle);
      timerDisplayHandle = null;
    }
  }

  function tick() {
    const ts = loadTimerState();
    if (!ts.running) { stopDisplayTicker(); return; }
    const remaining = currentRemaining(ts);
    renderTimerDisplay(remaining);
    renderTimerRing(ts, remaining, true); // the only animated path
    if (remaining <= 0) {
      completeTimer(ts);
    }
  }

  function startDisplayTicker() {
    stopDisplayTicker();
    timerDisplayHandle = setInterval(tick, 1000);
  }

  async function completeTimer(ts) {
    stopDisplayTicker();
    const wasBreak = ts.mode === 'break';
    const minutesElapsed = Math.round(ts.durationSeconds / 60);
    // Either way we land on a fresh focus session, ready to go again.
    const freshState = freshFocusState(ts);
    saveTimerState(freshState);
    renderTimerDisplay(freshState.remainingAtAnchor);
    setControlsState(freshState);
    if (!wasBreak) await logMinutes(ts.category, minutesElapsed); // breaks are never logged
  }

  function startTimer() {
    const ts = loadTimerState();
    if (ts.running && ts.mode === 'focus') return;
    // Starting focus during a break simply discards the break.
    const next = ts.mode === 'break' ? freshFocusState(ts) : ts;
    next.mode = 'focus';
    next.running = true;
    next.anchorTimestamp = Date.now();
    next.category = selectedCategory;
    next.durationSeconds = durationSeconds;
    next.focusDurationSeconds = durationSeconds;
    if (next.remainingAtAnchor !== durationSeconds) {
      // stale leftover from a different duration setting; treat as fresh
      next.remainingAtAnchor = durationSeconds;
    }
    saveTimerState(next);
    setControlsState(next);
    startDisplayTicker();
    renderTimerDisplay(currentRemaining(next));
  }

  /* One button, two jobs. Starting a break banks the focus time already done —
     cutting a session short should never lose the minutes actually worked —
     then runs the break. Ending one just returns to a fresh focus session. */
  async function onBreakButton() {
    const ts = loadTimerState();
    stopDisplayTicker();

    if (ts.mode === 'break') {
      const next = freshFocusState(ts);
      saveTimerState(next);
      renderTimerDisplay(next.remainingAtAnchor);
      setControlsState(next);
      return;
    }

    const elapsedSeconds = ts.durationSeconds - currentRemaining(ts);
    const next = defaultTimerState();
    next.category = ts.category;
    next.mode = 'break';
    next.focusDurationSeconds = ts.focusDurationSeconds;
    next.durationSeconds = breakSeconds;
    next.remainingAtAnchor = breakSeconds;
    next.anchorTimestamp = Date.now();
    next.running = true;
    saveTimerState(next);
    renderTimerDisplay(breakSeconds);
    setControlsState(next);
    startDisplayTicker();
    // logMinutes already no-ops at 0, so a barely-started session logs nothing.
    if (elapsedSeconds > 0) await logMinutes(ts.category, Math.round(elapsedSeconds / 60));
  }

  function togglePauseResume() {
    const ts = loadTimerState();
    if (ts.running) {
      // Pause: freeze the remaining time
      ts.remainingAtAnchor = currentRemaining(ts);
      ts.running = false;
      ts.anchorTimestamp = null;
      saveTimerState(ts);
      stopDisplayTicker();
      renderTimerDisplay(ts.remainingAtAnchor);
      setControlsState(ts);
    } else {
      // Resume
      if (ts.remainingAtAnchor <= 0 || ts.remainingAtAnchor === ts.durationSeconds) return;
      ts.running = true;
      ts.anchorTimestamp = Date.now();
      saveTimerState(ts);
      startDisplayTicker();
      renderTimerDisplay(currentRemaining(ts));
      setControlsState(ts);
    }
  }

  // Reset always lands on a fresh focus session, ending any break in progress.
  function resetTimer() {
    stopDisplayTicker();
    const ts = defaultTimerState();
    ts.category = selectedCategory;
    ts.durationSeconds = durationSeconds;
    ts.focusDurationSeconds = durationSeconds;
    ts.remainingAtAnchor = durationSeconds;
    saveTimerState(ts);
    renderTimerDisplay(ts.remainingAtAnchor);
    setControlsState(ts);
  }

  function onDurationChange() {
    const val = parseInt(document.getElementById('durationInput').value, 10);
    const clamped = Math.min(180, Math.max(1, isNaN(val) ? 25 : val));
    durationSeconds = clamped * 60;
    const ts = loadTimerState();
    if (ts.mode === 'break') {
      // The focus session is idle behind the break — remember the new length
      // for when the break ends, but leave the running break alone.
      ts.focusDurationSeconds = durationSeconds;
      saveTimerState(ts);
      return;
    }
    if (!ts.running && ts.remainingAtAnchor === ts.durationSeconds) {
      ts.durationSeconds = durationSeconds;
      ts.focusDurationSeconds = durationSeconds;
      ts.remainingAtAnchor = durationSeconds;
      saveTimerState(ts);
      renderTimerDisplay(durationSeconds);
      setControlsState(ts);
    }
  }

  function onBreakDurationChange() {
    const val = parseInt(document.getElementById('breakInput').value, 10);
    const clamped = Math.min(60, Math.max(1, isNaN(val) ? 5 : val));
    document.getElementById('breakInput').value = clamped;
    breakSeconds = clamped * 60;
    saveBreakMinutes(clamped);
  }

  let pendingCompletion = null; // a finished session waiting for login status before it's safely logged

  // Shows the timer immediately from whatever's saved locally — never waits on
  // login/network, so the timer never looks "stuck" just because identity is slow.
  function displayTimerFromLocal() {
    const ts = loadTimerState();
    selectedCategory = ts.category || 'productivity';
    // Read the FOCUS length here, not ts.durationSeconds — during a break the
    // latter holds the break length and would clobber the focus setting.
    durationSeconds = ts.focusDurationSeconds || 25 * 60;
    breakSeconds = loadBreakMinutes() * 60;
    document.getElementById('durationInput').value = Math.round(durationSeconds / 60);
    document.getElementById('breakInput').value = Math.round(breakSeconds / 60);
    renderCategoryRow();
    renderTimerLabel(ts);

    if (ts.running) {
      const remaining = currentRemaining(ts);
      if (remaining <= 0) {
        // Finished while we were away. Show it as done, but hold off logging
        // the minutes until we know the login state, so a completion can't
        // get silently overwritten by a stale server pull.
        stopDisplayTicker();
        renderTimerDisplay(0);
        renderTimerRing(ts, 0, false);
        document.getElementById('startBtn').disabled = true;
        document.getElementById('pauseBtn').disabled = true;
        document.getElementById('resetBtn').disabled = true;
        document.getElementById('breakBtn').disabled = true;
        pendingCompletion = ts;
      } else {
        renderTimerDisplay(remaining);
        setControlsState(ts);
        startDisplayTicker();
        pendingCompletion = null;
      }
    } else {
      renderTimerDisplay(ts.remainingAtAnchor);
      setControlsState(ts);
      pendingCompletion = null;
    }
  }

  async function resolvePendingCompletion() {
    if (!pendingCompletion) return;
    const ts = pendingCompletion;
    pendingCompletion = null;
    await completeTimer(ts);
  }

  // ---- Totals UI ----

  function renderTotals() {
    const list = document.getElementById('totalsList');
    list.innerHTML = CATEGORIES.map(c => `
      <div class="total-row">
        <span class="total-name-wrap">
          <span class="cat-dot" style="background:${c.color}"></span>
          <span class="total-name">${c.label}</span>
        </span>
        <span class="total-mins" style="color:${c.color}">${todayTotals[c.id] || 0} min</span>
      </div>
    `).join('');
    renderChart();
  }

  // ---- Pie chart ----

  let chartOpen = false;
  let chartRange = 1; // 1, 7, or 30 days

  function getTotalsForRange(days) {
    const totals = {};
    const cursor = new Date();
    for (let i = 0; i < days; i++) {
      const key = STORAGE_PREFIX + dateKey(cursor);
      try {
        const raw = localStorage.getItem(key);
        if (raw) {
          const dayTotals = JSON.parse(raw);
          Object.keys(dayTotals).forEach(catId => {
            totals[catId] = (totals[catId] || 0) + (dayTotals[catId] || 0);
          });
        }
      } catch (e) {}
      cursor.setDate(cursor.getDate() - 1);
    }
    return totals;
  }

  function rangeLabel(days) {
    if (days === 1) return 'today';
    return `the last ${days} days`;
  }

  function renderChart() {
    const pie = document.getElementById('pieCircle');
    const legend = document.getElementById('chartLegend');
    if (!pie || !legend) return;

    const rangeTotals = getTotalsForRange(chartRange);
    const total = CATEGORIES.reduce((sum, c) => sum + (rangeTotals[c.id] || 0), 0);

    if (total === 0) {
      pie.classList.add('empty');
      pie.style.background = '';
      legend.innerHTML = `<p class="chart-empty-note">No sessions logged for ${rangeLabel(chartRange)}</p>`;
      return;
    }

    pie.classList.remove('empty');

    let cursor = 0;
    const segments = CATEGORIES.map(c => {
      const minutes = rangeTotals[c.id] || 0;
      const pct = (minutes / total) * 100;
      const start = cursor;
      const end = cursor + pct;
      cursor = end;
      return { color: c.color, start, end, pct, label: c.label };
    });

    const gradientParts = segments
      .filter(s => s.pct > 0)
      .map(s => `${s.color} ${s.start}% ${s.end}%`)
      .join(', ');

    pie.style.background = `conic-gradient(${gradientParts})`;

    legend.innerHTML = segments.map(s => `
      <div class="legend-row">
        <span class="legend-name">
          <span class="cat-dot" style="background:${s.color}"></span>
          ${s.label}
        </span>
        <span class="legend-pct">${Math.round(s.pct)}%</span>
      </div>
    `).join('');
  }

  function initChartToggle() {
    const btn = document.getElementById('chartToggleBtn');
    const wrap = document.getElementById('chartWrap');
    btn.addEventListener('click', () => {
      chartOpen = !chartOpen;
      wrap.classList.toggle('open', chartOpen);
      btn.textContent = chartOpen ? 'Hide pie chart' : 'Show pie chart';
      if (chartOpen) renderChart();
    });

    document.querySelectorAll('.range-btn').forEach(rangeBtn => {
      rangeBtn.addEventListener('click', () => {
        chartRange = parseInt(rangeBtn.dataset.range, 10);
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('selected'));
        rangeBtn.classList.add('selected');
        renderChart();
      });
    });
  }

  // ---- Auth UI ----

  function renderAuthLoggedOut() {
    const card = document.getElementById('authCard');
    card.style.display = 'flex';
    card.innerHTML = `
      <div>
        <p class="auth-status">Not logged in</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="auth-btn secondary" id="loginBtn">Log in</button>
        <button class="auth-btn" id="signupBtn">Sign up</button>
      </div>
    `;
    document.getElementById('signupBtn').addEventListener('click', () => netlifyIdentity.open('signup'));
    document.getElementById('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'));

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Not logged in</p>
      <p class="gear-note">Log in to see account options here.</p>
    `;
  }

  function renderAuthLoggedIn(user) {
    const card = document.getElementById('authCard');
    card.style.display = 'none';
    card.innerHTML = '';

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Logged in</p>
      <p class="gear-email">${user.email}</p>
      <button class="auth-btn secondary" id="logoutBtn" style="width:100%;">Log out</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', () => netlifyIdentity.logout());
  }

  // ---- Init ----
  // Theme + nav dropdown behavior now lives in /js/rotulus-shared.js.

  function initApp() {
    initChartToggle();

    document.getElementById('startBtn').addEventListener('click', startTimer);
    document.getElementById('pauseBtn').addEventListener('click', togglePauseResume);
    document.getElementById('resetBtn').addEventListener('click', resetTimer);
    document.getElementById('durationInput').addEventListener('change', onDurationChange);
    document.getElementById('breakBtn').addEventListener('click', onBreakButton);
    document.getElementById('breakInput').addEventListener('change', onBreakDurationChange);

    initTimerRing(); // measure the card before anything tries to draw the ring

    // Show the timer right away from local data — this never waits on login/network.
    displayTimerFromLocal();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        displayTimerFromLocal();
        resolvePendingCompletion();
      }
    });
  }

  // Runs once we know whether the person is logged in (and, if so, once their
  // latest synced data has been pulled) — only then is it safe to log a session
  // that finished while the app was closed, so a real completion never gets
  // silently overwritten by an out-of-date server pull.
  async function finishInitialLoad() {
    loadToday();
    await resolvePendingCompletion();
    renderTotals();
  }

  function initIdentity() {
    if (typeof netlifyIdentity === 'undefined') {
      document.getElementById('authCard').innerHTML =
        '<p class="auth-status">Identity widget failed to load. Check your connection and reload.</p>';
      finishInitialLoad();
      return;
    }

    netlifyIdentity.on('init', async user => {
      currentUser = user || null;
      if (user) {
        renderAuthLoggedIn(user);
        await pullFromServer();
      } else {
        renderAuthLoggedOut();
      }
      await finishInitialLoad();
      renderSyncNote();
    });

    netlifyIdentity.on('login', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      netlifyIdentity.close();
      const pulled = await pullFromServer();
      await finishInitialLoad();
      /* Only upload when the download succeeded AND this device actually has
         something to contribute. Either guard alone is not enough. */
      if (pulled && hasLocalData()) await pushToServer();
      renderSyncNote();
    });

    netlifyIdentity.on('logout', () => {
      currentUser = null;
      renderAuthLoggedOut();
      renderSyncNote();
    });

    netlifyIdentity.on('signup', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      await pushToServer();
    });

    netlifyIdentity.init();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initApp();
    if (typeof netlifyIdentity !== 'undefined') {
      initIdentity();
    } else {
      window.addEventListener('load', initIdentity);
    }
  });
})();
</script>
</body>
</html>
