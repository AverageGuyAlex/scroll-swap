<head>

<script>try{var t=localStorage.getItem('scrollswap_theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.classList.add('theme-dark');}catch(e){}try{var d=sessionStorage.getItem('rotulus_vt_dir');if(d){document.documentElement.dataset.vtDir=d;sessionStorage.removeItem('rotulus_vt_dir');}}catch(e){}</script>

<style>
  /* Page-specific: dashboard */

  /* Today's note banner */
  .quote-card {
    padding: 20px;
    margin-bottom: 18px;
    text-align: center;
  }
  .quote-label {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    border-radius: var(--r-pill);
    padding: 5px 12px;
    font-weight: 800;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.92);
    margin: 0 0 10px;
  }
  .quote-text {
    font-size: 16.5px;
    font-style: italic;
    font-weight: 700;
    line-height: 1.5;
    margin: 0;
    color: #FFFFFF;
  }

  /* Stats grid */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    padding: 14px;
  }
  .stat-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .stat-icon { width: 34px; height: 34px; font-size: 16px; background: var(--acc-soft); }
  .stat-num {
    font-family: var(--font-display);
    font-size: 27px;
    font-weight: 700;
    color: var(--acc);
    line-height: 1;
    margin: 0;
  }
  .stat-label {
    font-weight: 800;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    line-height: 1.4;
    margin: 0;
    /* Row rather than a plain line so the chevron can sit at the far end,
       hinting that the whole card opens the page the number came from. */
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .stat-go { font-size: 14px; font-weight: 700; opacity: 0.5; flex-shrink: 0; }

  /* Locked-in pill. It's a button, not a label: tapping it offers to start a
     session. Lock In is a full-screen dark mode with no way back except a tap,
     so it asks first rather than dropping you in on a mis-tap. */
  .lockin-area { margin-bottom: 20px; }
  .lockin-note-card {
    display: block;
    width: 100%;
    background: var(--acc-green-soft);
    border: 1px solid transparent;
    border-radius: var(--r-pill);
    padding: 11px 16px;
    text-align: center;
    cursor: pointer;
  }
  /* display:block above beats the UA [hidden]{display:none} rule, so the
     hidden attribute needs saying again here or the pill stays on screen
     underneath the confirm. */
  .lockin-note-card[hidden] { display: none; }
  .lockin-note-text {
    font-weight: 700;
    font-size: 12.5px;
    color: var(--green);
    margin: 0;
  }

  .lockin-confirm {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    padding: 14px 16px;
  }
  .lockin-confirm[hidden] { display: none; }
  .lockin-confirm-text {
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    text-align: center;
    margin: 0 0 12px;
  }
  .lockin-confirm-row { display: flex; gap: 8px; }
  /* Same two-button pattern the to-do page uses for its inline forms. */
  .inline-btn {
    font-family: var(--font-body); font-weight: 800; font-size: 11px;
    letter-spacing: 0.05em; text-transform: uppercase;
    border: none; border-radius: var(--r-pill); padding: 10px 14px; cursor: pointer;
  }
  .inline-btn.confirm { background: var(--green); color: #FFFFFF; flex: 1; }
  .inline-btn.cancel { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); }

  /* Chart section */
  .chart-section-title {
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--primary);
    margin: 0 0 10px;
  }
  .range-toggle-row {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 4px;
    box-shadow: var(--shadow-card);
  }
  .range-btn {
    flex: 1;
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: transparent;
    color: var(--ink-dim);
    border: none;
    border-radius: var(--r-pill);
    padding: 8px 6px;
    cursor: pointer;
  }
  .range-btn.selected { background: var(--primary); color: var(--on-primary); }

  .chart-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 18px;
  }
  .pie-wrap { position: relative; width: 156px; height: 156px; margin-bottom: 16px; }
  .pie { width: 100%; height: 100%; border-radius: 50%; }
  .pie.empty { background: var(--line) !important; }
  .pie-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 62px; height: 62px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: var(--shadow-card);
  }
  .chart-legend { width: 100%; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; font-weight: 700; font-size: 12.5px; }
  .legend-name { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .legend-pct { color: var(--ink-dim); }
  .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .chart-empty-note { font-weight: 600; font-size: 12px; color: var(--ink-dim); text-align: center; }

  .sync-note { margin-top: 16px; }
</style>
</head>
<body>
<div id="app">
  <div class="nav-row">
    <button class="gear-btn" id="gearToggle" title="Settings" aria-label="Settings">&#9881;</button>
    <div class="gear-dropdown" id="gearDropdown">
      <div id="gearAccountSection"></div>
      <a href="lock-in.html" class="gear-settings-link">&#128274; Lock In</a>
      <a href="settings.html" class="gear-settings-link">&#9881; Settings</a>
    </div>
  </div>

  <div class="header">
    <img class="header-art" src="/assets/header-illustration.png" alt="" onerror="this.style.display='none'">
    <p class="eyebrow">Overview</p>
    <h1 class="title">Dashboard</h1>
    <p class="subtitle">Where things stand today.</p>
  </div>

  <div class="auth-card" id="authCard">
    <p class="auth-status">Checking login&hellip;</p>
  </div>

  <div class="today-card quote-card">
    <p class="quote-label">Today's note</p>
    <p class="quote-text" id="quoteText"></p>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="lockin-area">
    <button class="lockin-note-card" id="lockInBtn" type="button">
      <span class="lockin-note-text" id="lockInNote"></span>
    </button>
    <div class="lockin-confirm" id="lockInConfirm" hidden>
      <p class="lockin-confirm-text">Start a Lock In session?</p>
      <div class="lockin-confirm-row">
        <button class="inline-btn cancel" id="lockInCancelBtn" type="button">Cancel</button>
        <button class="inline-btn confirm" id="lockInStartBtn" type="button">Start</button>
      </div>
    </div>
  </div>

  <p class="chart-section-title">Pomodoro balance</p>
  <div class="range-toggle-row" id="rangeToggleRow">
    <button class="range-btn selected" data-range="1">Today</button>
    <button class="range-btn" data-range="7">Last 7 days</button>
    <button class="range-btn" data-range="30">Last 30 days</button>
  </div>
  <div class="chart-card">
    <div class="pie-wrap">
      <div class="pie" id="pieCircle"></div>
      <div class="pie-center">&#9201;</div>
    </div>
    <div class="chart-legend" id="chartLegend"></div>
  </div>

  <p class="sync-note" id="syncNote"></p>
</div>

<script>
(function() {
  const POMODORO_PREFIX = 'pomodoro_';
  const TODO_STATE_KEY = 'scrollswap_todo_state';
  const GOALS_STATE_KEY = 'scrollswap_goals_state';
  const POMODORO_FUNCTION_URL = '/.netlify/functions/pomodoro';
  const TODOS_FUNCTION_URL = '/.netlify/functions/todos';
  const GOALS_FUNCTION_URL = '/.netlify/functions/goals';

  const CATEGORIES = [
    { id: 'productivity', label: 'Productivity', color: 'var(--cat-productivity)' },
    { id: 'workout', label: 'Working Out', color: 'var(--cat-workout)' },
    { id: 'reading', label: 'Reading', color: 'var(--cat-reading)' },
  ];

  const QUOTES = [
    'Small, consistent steps beat occasional bursts of effort.',
    'Discipline is choosing what you want most over what you want now.',
    'You do not need to feel motivated to begin — begin, and motivation follows.',
    'Progress hides inside boring, repeated days.',
    'The work you avoid the most is often the work that matters the most.',
    'Done today is worth more than perfect someday.',
    'A slow start is still a start.',
    'You are building a version of yourself that future-you will thank you for.',
    'Focus is a muscle. Every distraction resisted makes it stronger.',
    'The comeback is always more interesting than the setback.',
    'What gets logged gets improved.',
    'Rest is part of the work, not a break from it.',
    'One honest hour beats three distracted ones.',
    'Today only asks for today’s effort, not the whole mountain.',
    'The habit is the goal. The result is just proof.',
    'Nobody sees the quiet repetition behind a result they admire.',
    'You do not have to feel ready. You just have to start moving.',
    'Consistency turns ordinary effort into extraordinary results.',
    'Every check mark today is a vote for who you are becoming.',
    'Momentum is built, not found.',
  ];

  let currentUser = null;
  let syncing = false;
  let chartRange = 1;

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function dayOfYear() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    return Math.floor(diff / 86400000);
  }

  function renderQuote() {
    const quote = QUOTES[dayOfYear() % QUOTES.length];
    document.getElementById('quoteText').textContent = quote;
  }

  // ---- Pomodoro data (read-only here) ----

  function dateKeyFromDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getPomodoroRangeTotals(days) {
    const totals = {};
    const cursor = new Date();
    for (let i = 0; i < days; i++) {
      const key = POMODORO_PREFIX + dateKeyFromDate(cursor);
      try {
        const raw = localStorage.getItem(key);
        if (raw) {
          const dayTotals = JSON.parse(raw);
          Object.keys(dayTotals).forEach(catId => {
            totals[catId] = (totals[catId] || 0) + (dayTotals[catId] || 0);
          });
        }
      } catch (e) {}
      cursor.setDate(cursor.getDate() - 1);
    }
    return totals;
  }

  function getPomodoroAllTimeMinutes() {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(POMODORO_PREFIX)) {
        try {
          const dayTotals = JSON.parse(localStorage.getItem(key));
          Object.values(dayTotals).forEach(m => { total += (m || 0); });
        } catch (e) {}
      }
    }
    return total;
  }

  async function pullPomodoroReadOnly() {
    if (!currentUser) return;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(POMODORO_FUNCTION_URL, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const serverHistory = await res.json();
      Object.keys(serverHistory || {}).forEach(date => {
        localStorage.setItem(POMODORO_PREFIX + date, JSON.stringify(serverHistory[date]));
      });
    } catch (e) { console.error('Pomodoro pull failed', e); }
  }

  // ---- To-Do data (read-only here) ----

  function getTodoStats() {
    let totalCompleted = 0;
    try {
      const raw = localStorage.getItem(TODO_STATE_KEY);
      if (raw) {
        const state = JSON.parse(raw);
        (state.categories || []).forEach(cat => {
          (cat.subcategories || []).forEach(sc => {
            (sc.tasks || []).forEach(t => {
              if (!t.recurring && t.done) totalCompleted++;
            });
          });
        });
        Object.values(state.completions || {}).forEach(dayMap => {
          totalCompleted += Object.values(dayMap).filter(Boolean).length;
        });
      }
    } catch (e) {}
    return { totalCompleted };
  }

  async function pullTodosReadOnly() {
    if (!currentUser) return;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(TODOS_FUNCTION_URL, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const serverState = await res.json();
      if (serverState) localStorage.setItem(TODO_STATE_KEY, JSON.stringify(serverState));
    } catch (e) { console.error('Todos pull failed', e); }
  }

  // ---- Goals data (read-only here) ----

  function getGoalsStats() {
    let totalHours = 0;
    let completedGoals = 0;
    try {
      const raw = localStorage.getItem(GOALS_STATE_KEY);
      if (raw) {
        const state = JSON.parse(raw);
        (state.goals || []).forEach(g => {
          totalHours += Object.values(g.dailyHours || {}).reduce((sum, h) => sum + h, 0);
          if (g.completed) completedGoals++;
        });
      }
    } catch (e) {}
    return { totalHours, completedGoals };
  }

  async function pullGoalsReadOnly() {
    if (!currentUser) return;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(GOALS_FUNCTION_URL, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const serverState = await res.json();
      if (serverState) localStorage.setItem(GOALS_STATE_KEY, JSON.stringify(serverState));
    } catch (e) { console.error('Goals pull failed', e); }
  }

  async function pullLockInReadOnly() {
    if (!currentUser) return;
    try {
      const token = await currentUser.jwt();
      const res = await fetch('/.netlify/functions/lockin', { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const data = await res.json();
      if (typeof data.totalMinutes === 'number') {
        // Merge rather than overwrite: this device's local total may include a
        // just-recorded session whose push to the server hasn't landed yet.
        const localRaw = localStorage.getItem('scrollswap_lockin_total_minutes');
        const localValue = localRaw ? parseFloat(localRaw) : 0;
        const merged = Math.max(data.totalMinutes, localValue);
        localStorage.setItem('scrollswap_lockin_total_minutes', String(merged));
      }
    } catch (e) { console.error('Lock In pull failed', e); }
  }

  // ---- Stats rendering ----

  function getLockInMinutes() {
    try {
      const raw = localStorage.getItem('scrollswap_lockin_total_minutes');
      return raw ? Math.round(parseFloat(raw)) : 0;
    } catch (e) { return 0; }
  }

  function renderStats() {
    const todoStats = getTodoStats();
    const pomodoroMinutes = getPomodoroAllTimeMinutes();
    const goalsStats = getGoalsStats();
    const lockInMinutes = getLockInMinutes();

    /* Each card links to the page its number came from, so a stat is a door
       rather than a dead end. The two with a #hash land on the exact thing
       they counted — todo.html opens its completed archive, goals.html scrolls
       to the first completed goal.
       Placeholder glyphs — future swap point: replace the emoji with
       <img src="/assets/icons/stat-*.png"> inside .stat-icon. */
    const grid = document.getElementById('statsGrid');
    grid.innerHTML = `
      <a class="stat-card stat-card-link" href="todo.html#archive" style="--acc:var(--acc-sky); --acc-soft:var(--acc-sky-soft);">
        <div class="stat-top">
          <div class="icon-tile stat-icon">&#10004;&#65039;</div>
          <p class="stat-num">${todoStats.totalCompleted}</p>
        </div>
        <p class="stat-label">Tasks completed<span class="stat-go">&rsaquo;</span></p>
      </a>
      <a class="stat-card stat-card-link" href="pomodoro.html" style="--acc:var(--acc-orange); --acc-soft:var(--acc-orange-soft);">
        <div class="stat-top">
          <div class="icon-tile stat-icon">&#9201;</div>
          <p class="stat-num">${pomodoroMinutes}</p>
        </div>
        <p class="stat-label">Pomodoro minutes<span class="stat-go">&rsaquo;</span></p>
      </a>
      <a class="stat-card stat-card-link" href="goals.html" style="--acc:var(--acc-green); --acc-soft:var(--acc-green-soft);">
        <div class="stat-top">
          <div class="icon-tile stat-icon">&#127919;</div>
          <p class="stat-num">${goalsStats.totalHours}</p>
        </div>
        <p class="stat-label">Hours on goals<span class="stat-go">&rsaquo;</span></p>
      </a>
      <a class="stat-card stat-card-link" href="goals.html#completed" style="--acc:var(--acc-purple); --acc-soft:var(--acc-purple-soft);">
        <div class="stat-top">
          <div class="icon-tile stat-icon">&#127942;</div>
          <p class="stat-num">${goalsStats.completedGoals}</p>
        </div>
        <p class="stat-label">Goals completed<span class="stat-go">&rsaquo;</span></p>
      </a>
    `;

    document.getElementById('lockInNote').textContent = `\u{1F512} You have been locked in for ${lockInMinutes} minutes`;
  }

  // ---- Lock In confirm ----

  /* Lock In is a full-screen, always-dark focus mode that starts counting the
     moment it opens, so the pill asks before it takes you there. */
  function initLockInConfirm() {
    const pill = document.getElementById('lockInBtn');
    const confirmBox = document.getElementById('lockInConfirm');
    const cancelBtn = document.getElementById('lockInCancelBtn');
    const startBtn = document.getElementById('lockInStartBtn');
    if (!pill || !confirmBox) return;

    pill.addEventListener('click', () => {
      pill.hidden = true;
      confirmBox.hidden = false;
    });
    cancelBtn.addEventListener('click', () => {
      confirmBox.hidden = true;
      pill.hidden = false;
    });
    startBtn.addEventListener('click', () => {
      window.location.href = 'lock-in.html';
    });
  }

  // ---- Pie chart ----

  function rangeLabel(days) {
    if (days === 1) return 'today';
    return `the last ${days} days`;
  }

  function renderChart() {
    const pie = document.getElementById('pieCircle');
    const legend = document.getElementById('chartLegend');
    const rangeTotals = getPomodoroRangeTotals(chartRange);
    const total = CATEGORIES.reduce((sum, c) => sum + (rangeTotals[c.id] || 0), 0);

    if (total === 0) {
      pie.classList.add('empty');
      pie.style.background = '';
      legend.innerHTML = `<p class="chart-empty-note">No sessions logged for ${rangeLabel(chartRange)}</p>`;
      return;
    }

    pie.classList.remove('empty');
    let cursor = 0;
    const segments = CATEGORIES.map(c => {
      const minutes = rangeTotals[c.id] || 0;
      const pct = (minutes / total) * 100;
      const start = cursor;
      const end = cursor + pct;
      cursor = end;
      return { color: c.color, start, end, pct, label: c.label };
    });

    const gradientParts = segments.filter(s => s.pct > 0).map(s => `${s.color} ${s.start}% ${s.end}%`).join(', ');
    pie.style.background = `conic-gradient(${gradientParts})`;

    legend.innerHTML = segments.map(s => `
      <div class="legend-row">
        <span class="legend-name"><span class="cat-dot" style="background:${s.color}"></span>${s.label}</span>
        <span class="legend-pct">${Math.round(s.pct)}%</span>
      </div>
    `).join('');
  }

  function initChartToggle() {
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        chartRange = parseInt(btn.dataset.range, 10);
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        renderChart();
      });
    });
  }

  // ---- Auth UI ----

  function renderAuthLoggedOut() {
    const card = document.getElementById('authCard');
    card.style.display = 'flex';
    card.innerHTML = `
      <div><p class="auth-status">Not logged in</p></div>
      <div style="display:flex; gap:8px;">
        <button class="auth-btn secondary" id="loginBtn">Log in</button>
        <button class="auth-btn" id="signupBtn">Sign up</button>
      </div>
    `;
    document.getElementById('signupBtn').addEventListener('click', () => netlifyIdentity.open('signup'));
    document.getElementById('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'));
    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `<p class="gear-status">Not logged in</p><p class="gear-note">Log in to see account options here.</p>`;
  }

  function renderAuthLoggedIn(user) {
    const card = document.getElementById('authCard');
    card.style.display = 'none';
    card.innerHTML = '';
    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Logged in</p>
      <p class="gear-email">${user.email}</p>
      <button class="auth-btn secondary" id="logoutBtn" style="width:100%;">Log out</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', () => netlifyIdentity.logout());
  }

  function renderSyncNote() {
    const el = document.getElementById('syncNote');
    if (!el) return;
    if (!currentUser) el.textContent = 'Log in to see stats synced across devices';
    else if (syncing) el.textContent = 'Syncing…';
    else el.textContent = 'Showing data synced to your account';
  }

  // ---- Init ----
  // Theme + nav dropdown behavior now lives in /js/rotulus-shared.js.

  function initApp() {
    renderQuote();
    renderStats();
    renderChart();
    initChartToggle();
    initLockInConfirm();
  }

  function initIdentity() {
    if (typeof netlifyIdentity === 'undefined') {
      document.getElementById('authCard').innerHTML = '<p class="auth-status">Identity widget failed to load. Check your connection and reload.</p>';
      return;
    }
    netlifyIdentity.on('init', async user => {
      currentUser = user || null;
      if (user) {
        renderAuthLoggedIn(user);
        syncing = true;
        renderSyncNote();
        await Promise.all([pullPomodoroReadOnly(), pullTodosReadOnly(), pullGoalsReadOnly(), pullLockInReadOnly()]);
        syncing = false;
      } else {
        renderAuthLoggedOut();
      }
      renderStats();
      renderChart();
      renderSyncNote();
    });
    netlifyIdentity.on('login', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      netlifyIdentity.close();
      syncing = true;
      renderSyncNote();
      await Promise.all([pullPomodoroReadOnly(), pullTodosReadOnly(), pullGoalsReadOnly(), pullLockInReadOnly()]);
      syncing = false;
      renderStats();
      renderChart();
      renderSyncNote();
    });
    netlifyIdentity.on('logout', () => { currentUser = null; renderAuthLoggedOut(); renderSyncNote(); });
    netlifyIdentity.on('signup', user => { currentUser = user; renderAuthLoggedIn(user); });
    netlifyIdentity.init();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initApp();
    if (typeof netlifyIdentity !== 'undefined') { initIdentity(); }
    else { window.addEventListener('load', initIdentity); }
  });
})();
</script>
</body>
</html>
