<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lock In</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lock In">
<meta name="theme-color" content="#0F1110">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh;
    background: #0F1110; overflow: hidden;
  }
  .lock-screen {
    width: 100%; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .lock-text {
    font-family: Georgia, 'Iowan Old Style', serif; font-size: 28px; color: #4A4E48; text-align: center;
    letter-spacing: 0.02em; padding: 0 40px; line-height: 1.5;
  }
</style>
<script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div class="lock-screen" id="lockScreen">
    <p class="lock-text">do not touch,<br>focus</p>
  </div>
  <script>
    const LOCKIN_TOTAL_KEY = 'scrollswap_lockin_total_minutes';
    const LOCKIN_FUNCTION_URL = '/.netlify/functions/lockin';
    const sessionStart = Date.now();
    let currentUser = null;
    let cachedToken = null; // fetched proactively on load so exit never has to wait on a network round-trip

    function getLocalTotal() {
      try {
        const raw = localStorage.getItem(LOCKIN_TOTAL_KEY);
        return raw ? parseFloat(raw) : 0;
      } catch (e) { return 0; }
    }

    function setLocalTotal(minutes) {
      try { localStorage.setItem(LOCKIN_TOTAL_KEY, String(minutes)); } catch (e) {}
    }

    async function pullFromServer() {
      if (!currentUser) return;
      try {
        cachedToken = await currentUser.jwt();
        const res = await fetch(LOCKIN_FUNCTION_URL, { headers: { Authorization: `Bearer ${cachedToken}` } });
        if (!res.ok) return;
        const data = await res.json();
        if (typeof data.totalMinutes === 'number') {
          // Merge rather than overwrite: this device may have a local increment
          // that hasn't finished pushing up yet, and we don't want to lose it.
          const merged = Math.max(data.totalMinutes, getLocalTotal());
          setLocalTotal(merged);
          if (merged > data.totalMinutes) {
            pushToServer(merged); // reconcile in the background, no need to wait
          }
        }
      } catch (e) { /* stay on local total if this fails */ }
    }

    // Keeps the cached token fresh in the background so it's ready the instant
    // someone taps to exit — GoTrue tokens are short-lived, and a session in
    // Lock In mode can easily outlast one.
    function startTokenRefreshLoop() {
      setInterval(async () => {
        if (!currentUser) return;
        try { cachedToken = await currentUser.jwt(); } catch (e) {}
      }, 5 * 60 * 1000);
    }

    async function pushToServer(totalMinutes) {
      if (!currentUser) return;
      try {
        const token = cachedToken || await currentUser.jwt();
        await fetch(LOCKIN_FUNCTION_URL, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ totalMinutes }),
          keepalive: true, // lets this request finish even after we navigate away
        });
      } catch (e) { /* local save already happened; will reconcile on next visit */ }
    }

    function recordSessionAndExit() {
      const elapsedMinutes = (Date.now() - sessionStart) / 60000;
      const newTotal = getLocalTotal() + elapsedMinutes;
      setLocalTotal(newTotal);
      pushToServer(newTotal); // fire in the background — don't make the person wait to exit
      window.location.href = 'dashboard.html';
    }

    document.getElementById('lockScreen').addEventListener('click', recordSessionAndExit);

    function initIdentity() {
      if (typeof netlifyIdentity === 'undefined') return;
      netlifyIdentity.on('init', async user => {
        currentUser = user || null;
        if (currentUser) {
          await pullFromServer();
          startTokenRefreshLoop();
        }
      });
      netlifyIdentity.init();
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof netlifyIdentity !== 'undefined') {
        initIdentity();
      } else {
        window.addEventListener('load', initIdentity);
      }
    });
  </script>
</body>
</html>
