<style>
  /* Page-specific: diary */

  /* Calendar */
  .cal-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    padding: 18px;
    margin-bottom: 18px;
  }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-month {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }
  .cal-nav-btn {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    cursor: pointer;
    font-size: 16px;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow {
    font-weight: 800;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    text-align: center;
    padding-bottom: 6px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-sm);
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    position: relative;
    background: transparent;
    border: none;
  }
  .cal-day.empty { cursor: default; }
  .cal-day.today { border: 2px solid var(--primary); }
  .cal-day.selected { background: var(--primary); color: var(--on-primary); }
  /* Rated days: JS sets --rating-hue (0 = red, 60 = yellow, 120 = green);
     the theme decides how saturated/light the swatch is. */
  .cal-day.rated { background: hsl(var(--rating-hue), 62%, 85%); color: #2B2540; }
  :root.theme-dark .cal-day.rated { background: hsl(var(--rating-hue), 45%, 26%); color: #EDE9FB; }
  .cal-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--primary); margin-top: 2px;
  }
  .cal-day.rated .cal-dot { background: currentColor; }
  .cal-day.selected .cal-dot { background: var(--on-primary); }

  /* Entry panel */
  .entry-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    padding: 20px;
    margin-bottom: 18px;
  }
  .entry-date {
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--primary);
    margin: 0 0 14px;
  }
  .field-label {
    font-weight: 800;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin: 0 0 6px;
  }
  .title-input {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 11px 12px;
    margin-bottom: 16px;
  }
  .rating-row { display: flex; gap: 5px; margin-bottom: 16px; flex-wrap: wrap; }
  .rating-btn {
    width: 32px;
    height: 32px;
    border-radius: var(--r-sm);
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-dim);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }
  .rating-btn.selected {
    background: var(--acc-orange);
    color: #FFFFFF;
    border-color: var(--acc-orange);
  }
  .log-textarea {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 12px;
    resize: vertical;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .save-btn {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--green);
    color: #FFFFFF;
    border: none;
    border-radius: var(--r-pill);
    padding: 13px;
    cursor: pointer;
    box-shadow: var(--shadow-card);
  }
  .save-note {
    text-align: center;
    font-weight: 700;
    font-size: 11px;
    color: var(--green);
    margin-top: 10px;
    min-height: 14px;
  }

  /* Pomodoro totals mini display */
  .pomo-mini-title {
    font-weight: 800;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--primary);
    margin: 0 0 10px;
  }
  .pomo-mini-row {
    display: flex; align-items: center; justify-content: space-between; padding: 7px 2px;
    font-weight: 700; font-size: 13px;
  }
  .pomo-mini-name { display: flex; align-items: center; gap: 8px; }
  .pomo-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pomo-mini-mins { font-weight: 800; font-size: 12px; }
  .pomo-mini-empty {
    font-weight: 600; font-size: 12px; color: var(--ink-dim); text-align: center; padding: 6px 0;
  }

  .sync-note { margin-top: 6px; }
</style>
</head>
<body>
<div id="app">
  <div class="nav-row">
    <button class="gear-btn" id="gearToggle" title="Settings" aria-label="Settings">&#9881;</button>
    <div class="gear-dropdown" id="gearDropdown">
      <div id="gearAccountSection"></div>
      <a href="lock-in.html" class="gear-settings-link">&#128274; Lock In</a>
      <a href="settings.html" class="gear-settings-link">&#9881; Settings</a>
    </div>
  </div>

  <div class="header">
    <img class="header-art" src="/assets/header-illustration.png" alt="" onerror="this.style.display='none'">
    <p class="eyebrow">Daily log</p>
    <h1 class="title">Diary</h1>
    <p class="subtitle">Tap a date to write or review that day.</p>
  </div>

  <div class="auth-card" id="authCard">
    <p class="auth-status">Checking login&hellip;</p>
  </div>

  <div class="cal-card">
    <div class="cal-header">
      <button class="cal-nav-btn" id="prevMonthBtn">&#8249;</button>
      <span class="cal-month" id="calMonthLabel"></span>
      <button class="cal-nav-btn" id="nextMonthBtn">&#8250;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="entry-card">
    <p class="entry-date" id="entryDateLabel"></p>

    <p class="field-label">Title</p>
    <input type="text" class="title-input" id="titleInput" placeholder="A word or two for the day">

    <p class="field-label">Productivity rating</p>
    <div class="rating-row" id="ratingRow"></div>

    <p class="field-label">What did you do today?</p>
    <textarea class="log-textarea" id="logTextarea" rows="5" placeholder="Write freely&hellip;"></textarea>

    <button class="save-btn" id="saveEntryBtn">Save entry</button>
    <p class="save-note" id="saveNote"></p>
  </div>

  <div class="entry-card">
    <p class="pomo-mini-title">Pomodoro time this day</p>
    <div id="pomoMiniList"></div>
  </div>

  <p class="sync-note" id="syncNote"></p>
</div>

<script>
(function() {
  const DIARY_PREFIX = 'diary_';
  const POMODORO_PREFIX = 'pomodoro_';
  const DIARY_FUNCTION_URL = '/.netlify/functions/diary';
  const POMODORO_FUNCTION_URL = '/.netlify/functions/pomodoro';

  const POMO_CATEGORIES = [
    { id: 'productivity', label: 'Productivity', color: 'var(--cat-productivity)' },
    { id: 'workout', label: 'Working Out', color: 'var(--cat-workout)' },
    { id: 'reading', label: 'Reading', color: 'var(--cat-reading)' },
  ];

  let currentUser = null;
  let syncing = false;
  let syncFailed = false;
  let viewYear, viewMonth; // 0-indexed month
  let selectedDate = new Date();
  let diaryEntries = {}; // { 'YYYY-MM-DD': { title, rating, text } }
  let pomodoroHistory = {}; // { 'YYYY-MM-DD': { productivity, workout, reading } }

  function pad(n) { return String(n).padStart(2, '0'); }
  function dateKeyFromParts(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
  function dateKeyFromDate(d) { return dateKeyFromParts(d.getFullYear(), d.getMonth(), d.getDate()); }

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  // ---- Local storage ----

  function loadDiaryLocal() {
    diaryEntries = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(DIARY_PREFIX)) {
        const date = key.slice(DIARY_PREFIX.length);
        try { diaryEntries[date] = JSON.parse(localStorage.getItem(key)); } catch (e) {}
      }
    }
  }

  function saveDiaryEntryLocal(date, entry) {
    diaryEntries[date] = entry;
    try {
      localStorage.setItem(DIARY_PREFIX + date, JSON.stringify(entry));
    } catch (e) { console.error('Diary save failed', e); }
  }

  function loadPomodoroLocal() {
    pomodoroHistory = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(POMODORO_PREFIX)) {
        const date = key.slice(POMODORO_PREFIX.length);
        try { pomodoroHistory[date] = JSON.parse(localStorage.getItem(key)); } catch (e) {}
      }
    }
  }

  // ---- Server sync ----

  function collectDiaryHistory() {
    const history = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(DIARY_PREFIX)) {
        const date = key.slice(DIARY_PREFIX.length);
        try { history[date] = JSON.parse(localStorage.getItem(key)); } catch (e) {}
      }
    }
    return history;
  }

  function writeDiaryHistoryToLocal(history) {
    Object.keys(history || {}).forEach(date => {
      localStorage.setItem(DIARY_PREFIX + date, JSON.stringify(history[date]));
    });
  }

  function hasLocalDiaryData() {
    return Object.keys(collectDiaryHistory()).length > 0;
  }

  /* Returns true only if the download actually completed. Callers MUST check
     this before uploading: pushing after a failed download would overwrite the
     server copy with whatever this device happens to hold, which may be nothing
     (e.g. a brand new browser, or a fresh domain — localStorage is per-domain). */
  async function pullDiaryFromServer() {
    if (!currentUser) return false;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(DIARY_FUNCTION_URL, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) { syncFailed = true; return false; }
      const serverHistory = await res.json();
      writeDiaryHistoryToLocal(serverHistory);
      syncFailed = false;
      return true;
    } catch (e) {
      console.error('Diary pull failed', e);
      syncFailed = true;
      return false;
    }
  }

  async function pushDiaryToServer() {
    if (!currentUser) return;
    syncing = true;
    renderSyncNote();
    try {
      const token = await currentUser.jwt();
      const history = collectDiaryHistory();
      const res = await fetch(DIARY_FUNCTION_URL, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(history),
      });
      syncFailed = !res.ok;
    } catch (e) {
      console.error('Diary push failed', e);
      syncFailed = true;
    } finally {
      syncing = false;
      renderSyncNote();
    }
  }

  // Pomodoro is read-only from Diary's perspective: pull latest, but never push
  async function pullPomodoroFromServer() {
    if (!currentUser) return;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(POMODORO_FUNCTION_URL, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const serverHistory = await res.json();
      Object.keys(serverHistory || {}).forEach(date => {
        localStorage.setItem(POMODORO_PREFIX + date, JSON.stringify(serverHistory[date]));
      });
      loadPomodoroLocal();
    } catch (e) { console.error('Pomodoro pull failed', e); }
  }

  function renderSyncNote() {
    const el = document.getElementById('syncNote');
    if (!el) return;
    if (!currentUser) el.textContent = 'Not synced — log in to save across devices';
    else if (syncing) el.textContent = 'Syncing…';
    else if (syncFailed) el.textContent = '⚠ Sync failed — this device’s data is safe, but not saved to your account';
    else el.textContent = 'Synced to your account';
  }

  // ---- Calendar rendering ----

  function ratingToHue(rating) {
    // 1 = red (0), 5 = yellow (60), 10 = green (120), gradual in between
    if (rating <= 5) return (rating - 1) / 4 * 60;
    return 60 + (rating - 5) / 5 * 60;
  }

  function renderCalendar() {
    document.getElementById('calMonthLabel').textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
    const grid = document.getElementById('calGrid');

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    let firstWeekday = firstOfMonth.getDay(); // 0 = Sunday
    firstWeekday = (firstWeekday + 6) % 7; // convert to Monday-first index
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    const todayKey = dateKeyFromDate(new Date());
    const selectedKey = dateKeyFromDate(selectedDate);

    let html = DOW_LABELS.map(d => `<div class="cal-dow">${d}</div>`).join('');

    for (let i = 0; i < firstWeekday; i++) {
      html += `<div class="cal-day empty"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const key = dateKeyFromParts(viewYear, viewMonth, day);
      const entry = diaryEntries[key];
      const hasEntry = !!(entry && (entry.title || entry.text));
      const rating = entry && typeof entry.rating === 'number' ? entry.rating : null;
      const classes = ['cal-day'];
      if (key === todayKey) classes.push('today');
      if (key === selectedKey) classes.push('selected');

      // The CSS derives a theme-appropriate swatch from the hue, so the same
      // entry looks right in both light and dark mode.
      let styleAttr = '';
      if (rating !== null && key !== selectedKey) {
        classes.push('rated');
        styleAttr = ` style="--rating-hue:${ratingToHue(rating)};"`;
      }

      html += `<button class="${classes.join(' ')}" data-date="${key}"${styleAttr}>${day}${hasEntry ? '<span class="cal-dot"></span>' : ''}</button>`;
    }

    grid.innerHTML = html;

    grid.querySelectorAll('.cal-day:not(.empty)').forEach(btn => {
      btn.addEventListener('click', () => {
        const [y, m, d] = btn.dataset.date.split('-').map(Number);
        selectedDate = new Date(y, m - 1, d);
        renderCalendar();
        renderEntryPanel();
        renderPomodoroMini();
      });
    });
  }

  // ---- Entry panel ----

  function renderRatingRow(currentRating) {
    const row = document.getElementById('ratingRow');
    row.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.className = 'rating-btn' + (i === currentRating ? ' selected' : '');
      btn.textContent = i;
      btn.dataset.value = i;
      btn.addEventListener('click', () => {
        row.dataset.selected = i;
        row.querySelectorAll('.rating-btn').forEach(b => b.classList.toggle('selected', Number(b.dataset.value) === i));
      });
      row.appendChild(btn);
    }
    row.dataset.selected = currentRating || '';
  }

  function renderEntryPanel() {
    const key = dateKeyFromDate(selectedDate);
    const entry = diaryEntries[key] || { title: '', rating: null, text: '' };

    document.getElementById('entryDateLabel').textContent = selectedDate.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById('titleInput').value = entry.title || '';
    document.getElementById('logTextarea').value = entry.text || '';
    renderRatingRow(entry.rating);
    document.getElementById('saveNote').textContent = '';
  }

  async function handleSaveEntry() {
    const key = dateKeyFromDate(selectedDate);
    const title = document.getElementById('titleInput').value.trim();
    const text = document.getElementById('logTextarea').value.trim();
    const ratingRow = document.getElementById('ratingRow');
    const rating = ratingRow.dataset.selected ? Number(ratingRow.dataset.selected) : null;

    const entry = { title, rating, text };
    saveDiaryEntryLocal(key, entry);
    renderCalendar();
    document.getElementById('saveNote').textContent = 'Saved ✓';

    if (currentUser) await pushDiaryToServer();
  }

  // ---- Pomodoro mini display ----

  function renderPomodoroMini() {
    const key = dateKeyFromDate(selectedDate);
    const totals = pomodoroHistory[key] || {};
    const list = document.getElementById('pomoMiniList');
    const anyLogged = POMO_CATEGORIES.some(c => (totals[c.id] || 0) > 0);

    if (!anyLogged) {
      list.innerHTML = '<p class="pomo-mini-empty">No Pomodoro sessions logged this day</p>';
      return;
    }

    list.innerHTML = POMO_CATEGORIES.map(c => `
      <div class="pomo-mini-row">
        <span class="pomo-mini-name">
          <span class="pomo-dot" style="background:${c.color}"></span>
          ${c.label}
        </span>
        <span class="pomo-mini-mins" style="color:${c.color}">${totals[c.id] || 0} min</span>
      </div>
    `).join('');
  }

  // ---- Auth UI ----

  function renderAuthLoggedOut() {
    const card = document.getElementById('authCard');
    card.style.display = 'flex';
    card.innerHTML = `
      <div>
        <p class="auth-status">Not logged in</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="auth-btn secondary" id="loginBtn">Log in</button>
        <button class="auth-btn" id="signupBtn">Sign up</button>
      </div>
    `;
    document.getElementById('signupBtn').addEventListener('click', () => netlifyIdentity.open('signup'));
    document.getElementById('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'));

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Not logged in</p>
      <p class="gear-note">Log in to see account options here.</p>
    `;
  }

  function renderAuthLoggedIn(user) {
    const card = document.getElementById('authCard');
    card.style.display = 'none';
    card.innerHTML = '';

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Logged in</p>
      <p class="gear-email">${user.email}</p>
      <button class="auth-btn secondary" id="logoutBtn" style="width:100%;">Log out</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', () => netlifyIdentity.logout());
  }

  // ---- Month navigation ----

  function initMonthNav() {
    document.getElementById('prevMonthBtn').addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderCalendar();
    });
    document.getElementById('nextMonthBtn').addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderCalendar();
    });
  }

  // ---- Init ----
  // Theme + nav dropdown behavior now lives in /js/rotulus-shared.js.

  function initApp() {
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    selectedDate = now;

    loadDiaryLocal();
    loadPomodoroLocal();
    renderCalendar();
    renderEntryPanel();
    renderPomodoroMini();
    initMonthNav();

    document.getElementById('saveEntryBtn').addEventListener('click', handleSaveEntry);
  }

  function initIdentity() {
    if (typeof netlifyIdentity === 'undefined') {
      document.getElementById('authCard').innerHTML =
        '<p class="auth-status">Identity widget failed to load. Check your connection and reload.</p>';
      return;
    }

    netlifyIdentity.on('init', async user => {
      currentUser = user || null;
      if (user) {
        renderAuthLoggedIn(user);
        await pullDiaryFromServer();
        await pullPomodoroFromServer();
      } else {
        renderAuthLoggedOut();
      }
      loadDiaryLocal();
      loadPomodoroLocal();
      renderCalendar();
      renderEntryPanel();
      renderPomodoroMini();
      renderSyncNote();
    });

    netlifyIdentity.on('login', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      netlifyIdentity.close();
      const pulled = await pullDiaryFromServer();
      await pullPomodoroFromServer();
      loadDiaryLocal();
      loadPomodoroLocal();
      renderCalendar();
      renderEntryPanel();
      renderPomodoroMini();
      /* Only upload when the download succeeded AND this device actually has
         something to contribute. Either guard alone is not enough. */
      if (pulled && hasLocalDiaryData()) await pushDiaryToServer();
      renderSyncNote();
    });

    netlifyIdentity.on('logout', () => {
      currentUser = null;
      renderAuthLoggedOut();
      renderSyncNote();
    });

    netlifyIdentity.on('signup', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      await pushDiaryToServer();
    });

    netlifyIdentity.init();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initApp();
