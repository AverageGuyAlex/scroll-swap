<style>
  /* Page-specific: habit tracker */
  .header { text-align: center; padding-top: 6px; }
  .subtitle .hl { color: var(--primary); font-weight: 800; }

  /* Streak hero banner */
  .streak-banner {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    margin: 4px 0 20px;
  }
  .streak-ring {
    flex-shrink: 0;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: conic-gradient(rgba(255,255,255,0.95) calc(var(--ring, 0) * 1%), rgba(255,255,255,0.25) 0);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .streak-ring-inner {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(70, 45, 180, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .streak-label {
    font-weight: 800;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    margin: 0 0 2px;
  }
  .streak-main {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .streak-num {
    font-family: var(--font-display);
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    color: #FFFFFF;
  }
  .streak-unit {
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
  }
  .streak-sub {
    font-weight: 600;
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    margin: 2px 0 0;
  }

  /* Slot cards */
  .slot {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px;
    margin-bottom: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    cursor: pointer;
    transition: transform var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease);
  }
  .slot:active { transform: scale(0.985); }
  .slot[data-id="wake"]       { --slot-accent: var(--acc-orange); --slot-soft: var(--acc-orange-soft); }
  .slot[data-id="morning"]    { --slot-accent: var(--acc-sky);    --slot-soft: var(--acc-sky-soft); }
  .slot[data-id="between"]    { --slot-accent: var(--acc-purple); --slot-soft: var(--acc-purple-soft); }
  .slot[data-id="evening"]    { --slot-accent: var(--acc-green);  --slot-soft: var(--acc-green-soft); }
  .slot[data-id="before_bed"] { --slot-accent: var(--acc-pink);   --slot-soft: var(--acc-pink-soft); }

  .slot-icon { background: var(--slot-soft); }

  .slot-text { flex: 1; min-width: 0; }
  .slot-time {
    font-weight: 800;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--slot-accent);
    margin: 0 0 3px;
  }
  .slot-swap {
    font-weight: 600;
    font-size: 13.5px;
    color: var(--ink);
    margin: 0;
    line-height: 1.4;
  }
  .slot.checked .slot-swap { color: var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--line); }
  .slot-swap.placeholder { color: var(--ink-dim); font-style: italic; }

  .box {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border: 2px solid var(--slot-accent);
    border-radius: var(--r-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
  }
  .box.checked { background: var(--slot-accent); }
  .box svg { opacity: 0; transform: scale(0.6); transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
  .box.checked svg { opacity: 1; transform: scale(1); }

  /* Today summary card */
  .today-banner {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px 18px;
    margin-top: 18px;
  }
  .today-top { display: flex; align-items: center; gap: 14px; }
  .today-ring {
    flex-shrink: 0;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: conic-gradient(rgba(255,255,255,0.95) calc(var(--ring, 0) * 1%), rgba(255,255,255,0.25) 0);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .today-ring-inner {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(50, 60, 170, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13.5px;
    color: #FFFFFF;
  }
  .today-info { flex: 1; }
  .today-label {
    font-weight: 800;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    margin: 0 0 2px;
  }
  .today-count { font-weight: 700; font-size: 13.5px; color: #FFFFFF; margin: 0; }
  .today-reset {
    text-align: right;
    font-weight: 600;
    font-size: 11.5px;
    color: rgba(255,255,255,0.85);
    border-left: 1px solid rgba(255,255,255,0.25);
    padding-left: 14px;
    line-height: 1.5;
  }
  .sync-note {
    margin-top: 0;
    background: rgba(255,255,255,0.16);
    border-radius: var(--r-pill);
    padding: 8px 12px;
    color: rgba(255,255,255,0.92);
    font-weight: 700;
  }

  .reset-link {
    display: block;
    width: 100%;
    text-align: center;
    margin-top: 4px;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    padding: 10px;
    border-radius: var(--r-pill);
  }

  /* Edit mode */
  .edit-input {
    width: 100%;
    padding: 12px;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
  }
  .edit-slot {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px;
    margin-bottom: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
  }
</style>
</head>
<body>
<div id="app">
  <div class="nav-row">
    <button class="gear-btn" id="gearToggle" title="Settings" aria-label="Settings">&#9881;</button>
    <div class="gear-dropdown" id="gearDropdown">
      <div id="gearAccountSection"></div>
      <a href="lock-in.html" class="gear-settings-link">&#128274; Lock In</a>
      <a href="settings.html" class="gear-settings-link">&#9881; Settings</a>
    </div>
  </div>

  <div class="header">
    <img class="header-art" src="/assets/header-illustration.png" alt="" onerror="this.style.display='none'">
    <h1 class="title">Rotulus</h1>
    <p class="subtitle">Five slots a day.<br>Beat the <span class="hl">reflex</span>, not the urge.</p>

  <div class="auth-card" id="authCard">
    <p class="auth-status">Checking login&hellip;</p>
  </div>

  <div id="tracker"></div>

<script>
(function() {
  const STORAGE_PREFIX = 'scrollswap_';
  const FUNCTION_URL = '/.netlify/functions/habits';

  /* Slots start with no text of their own. The 'placeholder' is a
     habit-stacking example ("After [daily anchor], do [replacement habit]")
     shown greyed out until the user writes their own swap for that slot. */
  const DEFAULT_SLOTS = [
    { id: 'wake', time: 'Wake up', placeholder: 'After you turn off your alarm, drink a glass of water before the phone comes out' },
    { id: 'morning', time: 'Morning', placeholder: 'After breakfast, read a few pages instead of opening socials' },
    { id: 'between', time: 'Afternoon', placeholder: 'After lunch, take a 10-minute walk instead of reels' },
    { id: 'evening', time: 'Evening', placeholder: 'After dinner, do a workout, a hobby, or a chore before any screens' },
    { id: 'before_bed', time: 'Before bed', placeholder: 'After getting into bed, switch to audio and leave the screen face-down' },
  ];

  /* Placeholder glyphs until the real slot icons are generated.
     Future swap point: replace the emoji with
     <img src="/assets/icons/slot-<id>.png" alt=""> inside .slot-icon. */
  const SLOT_ICONS = {
    wake: '\u{1F305}',
    morning: '☀️',
    between: '\u{1F4D6}',
    evening: '\u{1F45F}',
    before_bed: '\u{1F319}',
  };

  let customLabels = {}; // { [slotId]: { time, swap } }

  function getSlots() {
    return DEFAULT_SLOTS.map(s => ({
      id: s.id,
      time: (customLabels[s.id] && customLabels[s.id].time) || s.time,
      swap: (customLabels[s.id] && customLabels[s.id].swap) || '',
      placeholder: s.placeholder,
    }));
  }

  function winThreshold() {
    return Math.ceil(DEFAULT_SLOTS.length / 2);
  }

  let state = {};
  let streak = 0;
  let currentUser = null;
  let syncing = false;
  let syncFailed = false;

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getResetHour() {
    try {
      const raw = localStorage.getItem('scrollswap_reset_hour');
      const h = raw !== null ? parseInt(raw, 10) : 0;
      return (isNaN(h) || h < 0 || h > 23) ? 0 : h;
    } catch (e) { return 0; }
  }

  function getEffectiveDate() {
    const now = new Date();
    const resetHour = getResetHour();
    const effective = new Date(now);
    if (now.getHours() < resetHour) {
      effective.setDate(effective.getDate() - 1);
    }
    return effective;
  }

  function formatResetHourLabel(hour) {
    const period = hour < 12 ? 'AM' : 'PM';
    let h12 = hour % 12;
    if (h12 === 0) h12 = 12;
    return `${h12}:00 ${period}`;
  }

  function todayKey() { return STORAGE_PREFIX + dateKey(getEffectiveDate()); }

  function checkmarkSVG() {
    return '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function isWin(s) {
    return Object.values(s).filter(Boolean).length >= winThreshold();
  }

  function loadToday() {
    try {
      const raw = localStorage.getItem(todayKey());
      state = raw ? JSON.parse(raw) : {};
    } catch (e) { state = {}; }
  }

  function labelsKey() { return STORAGE_PREFIX + '_labels'; }

  function loadLabelsLocal() {
    try {
      const raw = localStorage.getItem(labelsKey());
      customLabels = raw ? JSON.parse(raw) : {};
    } catch (e) { customLabels = {}; }
  }

  function saveLabelsLocal() {
    try {
      localStorage.setItem(labelsKey(), JSON.stringify(customLabels));
    } catch (e) { console.error('Label save failed', e); }
  }

  function saveTodayLocal() {
    try {
      localStorage.setItem(todayKey(), JSON.stringify(state));
    } catch (e) { console.error('Local save failed', e); }
  }

  function computeStreak() {
    let count = 0;
    let cursor = getEffectiveDate();
    const todayWin = isWin(state);
    if (!todayWin) cursor.setDate(cursor.getDate() - 1);
    for (let i = 0; i < 365; i++) {
      const raw = localStorage.getItem(STORAGE_PREFIX + dateKey(cursor));
      if (!raw) break;
      try {
        const day = JSON.parse(raw);
        if (!isWin(day)) break;
        count++;
        cursor.setDate(cursor.getDate() - 1);
      } catch (e) { break; }
    }
    streak = count;
  }

  // ---- Server sync (only when logged in) ----

  function isScrollSwapOwnKey(suffix) {
    // Only real date entries (YYYY-MM-DD) and the labels key belong to the habit tracker.
    // Other pages (Pomodoro, Settings, etc.) also use 'scrollswap_' as part of their
    // own key names, so this must NOT match anything broader than that.
    return suffix === '_labels' || /^\d{4}-\d{2}-\d{2}$/.test(suffix);
  }

  function collectAllLocalHistory() {
    const history = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(STORAGE_PREFIX)) {
        const suffix = key.slice(STORAGE_PREFIX.length);
        if (!isScrollSwapOwnKey(suffix)) continue;
        try { history[suffix] = JSON.parse(localStorage.getItem(key)); } catch (e) {}
      }
    }
    return history;
  }

  function writeHistoryToLocal(history) {
    Object.keys(history || {}).forEach(suffix => {
      if (!isScrollSwapOwnKey(suffix)) return;
      localStorage.setItem(STORAGE_PREFIX + suffix, JSON.stringify(history[suffix]));
    });
  }

  function hasLocalData() {
    return Object.keys(collectAllLocalHistory()).length > 0;
  }

  /* Returns true only if the download actually completed. Callers MUST check
     this before uploading: pushing after a failed download would overwrite the
     server copy with whatever this device happens to hold, which may be nothing
     (e.g. a brand new browser, or a fresh domain — localStorage is per-domain). */
  async function pullFromServer() {
    if (!currentUser) return false;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(FUNCTION_URL, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) { syncFailed = true; return false; }
      const serverHistory = await res.json();
      writeHistoryToLocal(serverHistory);
      syncFailed = false;
      return true;
    } catch (e) {
      console.error('Pull failed', e);
      syncFailed = true;
      return false;
    }
  }

  async function pushToServer() {
    if (!currentUser) return;
    syncing = true;
    renderSyncNote();
    try {
      const token = await currentUser.jwt();
      const history = collectAllLocalHistory();
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(history),
      });
      syncFailed = !res.ok;
    } catch (e) {
      console.error('Push failed', e);
      syncFailed = true;
    } finally {
      syncing = false;
      renderSyncNote();
    }
  }

  function renderSyncNote() {
    const el = document.getElementById('syncNote');
    if (!el) return;
    if (!currentUser) {
      el.textContent = 'Not synced — log in to save across devices';
    } else if (syncing) {
      el.textContent = 'Syncing…';
    } else if (syncFailed) {
      el.textContent = '⚠ Sync failed — this device’s data is safe, but not saved to your account';
    } else {
      el.textContent = '✓ Synced to your account';
    }
  }

  // ---- Tracker UI ----

  let editMode = false;
  let editFocusId = null; // slot to focus when the editor was opened from a placeholder tap

  function renderTracker() {
    if (editMode) {
      renderEditView();
    } else {
      renderNormalView();
    }
  }

  function checkedCount() {
    return Object.values(state).filter(Boolean).length;
  }

  /* Targeted updates for the hot path (slot toggle) so taps feel instant
     instead of waiting on a full re-render. */
  function updateProgressUI() {
    const total = getSlots().length;
    const count = checkedCount();
    const pct = total ? (count / total) * 100 : 0;
    const streakNum = document.getElementById('streakNum');
    if (streakNum) streakNum.textContent = streak;
    const streakUnit = document.getElementById('streakUnit');
    if (streakUnit) streakUnit.textContent = `day streak${streak === 1 ? '' : 's'}`;
    const streakRing = document.getElementById('streakRing');
    if (streakRing) streakRing.style.setProperty('--ring', pct);
    const todayRing = document.getElementById('todayRing');
    if (todayRing) todayRing.style.setProperty('--ring', pct);
    const todayRatio = document.getElementById('todayRatio');
    if (todayRatio) todayRatio.textContent = `${count}/${total}`;
    const todayCount = document.getElementById('todayCount');
    if (todayCount) todayCount.textContent = `${count} of ${total} completed`;
  }

  function renderNormalView() {
    const tracker = document.getElementById('tracker');
    const slots = getSlots();
    const total = slots.length;
    const count = checkedCount();
    const pct = total ? (count / total) * 100 : 0;
    tracker.innerHTML = `
      <div class="hero-card streak-banner">
        <div class="streak-ring" id="streakRing" style="--ring:${pct}">
          <div class="streak-ring-inner">\u{1F525}</div>
        </div>
        <div>
          <p class="streak-label">Daily streak</p>
          <div class="streak-main">
            <span class="streak-num" id="streakNum">${streak}</span>
            <span class="streak-unit" id="streakUnit">day streak${streak === 1 ? '' : 's'}</span>
          </div>
          <p class="streak-sub">(${winThreshold()}+ swaps a day)</p>
        </div>
      </div>
      <div class="slots">
        ${slots.map(s => `
          <div class="slot ${state[s.id] ? 'checked' : ''}" data-id="${s.id}">
            <div class="icon-tile slot-icon">${SLOT_ICONS[s.id] || '✨'}</div>
            <div class="slot-text">
              <p class="slot-time">${s.time}</p>
              <p class="slot-swap${s.swap ? '' : ' placeholder'}">${s.swap || s.placeholder}</p>
            </div>
            <div class="box ${state[s.id] ? 'checked' : ''}">${checkmarkSVG()}</div>
          </div>
        `).join('')}
      </div>
      <div class="today-card today-banner">
        <div class="today-top">
          <div class="today-ring" id="todayRing" style="--ring:${pct}">
            <div class="today-ring-inner" id="todayRatio">${count}/${total}</div>
          </div>
          <div class="today-info">
            <p class="today-label">Today</p>
            <p class="today-count" id="todayCount">${count} of ${total} completed</p>
          </div>
          <div class="today-reset">Resets at<br>${formatResetHourLabel(getResetHour())}</div>
        </div>
        <p class="sync-note" id="syncNote"></p>
      </div>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="reset-link" id="resetBtn" style="flex:1;">clear today</button>
        <button class="reset-link" id="editBtn" style="flex:1;">edit text</button>
      </div>
    `;

    tracker.querySelectorAll('.slot').forEach(el => {
      el.addEventListener('click', async (e) => {
        // Tapping the greyed-out example text of an unset slot opens the
        // editor for it; slots with real text only toggle here.
        if (e.target.closest('.slot-swap.placeholder')) {
          editMode = true;
          editFocusId = el.dataset.id;
          renderTracker();
          return;
        }
        const id = el.dataset.id;
        state[id] = !state[id];
        const on = !!state[id];
        // Optimistic UI: flip classes immediately, no full re-render.
        el.classList.toggle('checked', on);
        const box = el.querySelector('.box');
        if (box) box.classList.toggle('checked', on);
        saveTodayLocal();
        computeStreak();
        updateProgressUI();
        if (currentUser) await pushToServer();
      });
    });

    document.getElementById('resetBtn').addEventListener('click', async () => {
      state = {};
      saveTodayLocal();
      computeStreak();
      renderTracker();
      if (currentUser) await pushToServer();
    });

    document.getElementById('editBtn').addEventListener('click', () => {
      editMode = true;
      renderTracker();
    });

    renderSyncNote();
  }

  function renderEditView() {
    const tracker = document.getElementById('tracker');
    const slots = getSlots();
    tracker.innerHTML = `
      <p class="footer-note" style="margin-top:0; margin-bottom:16px;">Edit the label and swap idea for each slot below.</p>
      <div class="slots">
        ${slots.map(s => `
          <div class="edit-slot">
            <input type="text" class="edit-input edit-time-input" data-id="${s.id}" value="${s.time.replace(/"/g, '&quot;')}">
            <textarea class="edit-input edit-swap-input" data-id="${s.id}" rows="2" style="resize:vertical;" placeholder="${s.placeholder.replace(/"/g, '&quot;')}">${s.swap}</textarea>
          </div>
        `).join('')}
      </div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="reset-link" id="cancelEditBtn" style="flex:1;">cancel</button>
        <button class="reset-link" id="saveEditBtn" style="flex:1; color:var(--green);">save</button>
      </div>
    `;

    if (editFocusId) {
      const target = tracker.querySelector(`.edit-swap-input[data-id="${editFocusId}"]`);
      if (target) {
        target.focus();
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      editFocusId = null;
    }

    document.getElementById('cancelEditBtn').addEventListener('click', () => {
      editMode = false;
      renderTracker();
    });

    document.getElementById('saveEditBtn').addEventListener('click', async () => {
      const timeInputs = tracker.querySelectorAll('.edit-time-input');
      const swapInputs = tracker.querySelectorAll('.edit-swap-input');
      timeInputs.forEach(input => {
        const id = input.dataset.id;
        customLabels[id] = customLabels[id] || {};
        customLabels[id].time = input.value.trim() || DEFAULT_SLOTS.find(d => d.id === id).time;
      });
      swapInputs.forEach(input => {
        const id = input.dataset.id;
        const text = input.value.trim();
        customLabels[id] = customLabels[id] || {};
        // Blank means "unset" — the slot reverts to its greyed-out example.
        if (text) customLabels[id].swap = text;
        else delete customLabels[id].swap;
      });
      saveLabelsLocal();
      editMode = false;
      renderTracker();
      if (currentUser) await pushToServer();
    });
  }

  // ---- Auth UI ----

  function renderAuthLoggedOut() {
    const card = document.getElementById('authCard');
    card.style.display = 'flex';
    card.innerHTML = `
      <div>
        <p class="auth-status">Not logged in</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="auth-btn secondary" id="loginBtn">Log in</button>
        <button class="auth-btn" id="signupBtn">Sign up</button>
      </div>
    `;
    document.getElementById('signupBtn').addEventListener('click', () => netlifyIdentity.open('signup'));
    document.getElementById('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'));

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Not logged in</p>
      <p class="gear-note">Log in to see account options here.</p>
    `;
  }

  function renderAuthLoggedIn(user) {
    const card = document.getElementById('authCard');
    card.style.display = 'none';
    card.innerHTML = '';

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Logged in</p>
      <p class="gear-email">${user.email}</p>
      <button class="auth-btn secondary" id="logoutBtn" style="width:100%;">Log out</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', () => netlifyIdentity.logout());
  }

  // ---- Init ----
  // Theme + nav dropdown behavior now lives in /js/rotulus-shared.js.

  async function initApp() {
    loadToday();
    loadLabelsLocal();
    computeStreak();
    renderTracker();
  }

  function initIdentity() {
    if (typeof netlifyIdentity === 'undefined') {
      document.getElementById('authCard').innerHTML =
        '<p class="auth-status">Identity widget failed to load. Check your connection and reload.</p>';
      return;
    }

    netlifyIdentity.on('init', async user => {
      currentUser = user || null;
      if (user) {
        renderAuthLoggedIn(user);
        await pullFromServer();
      } else {
        renderAuthLoggedOut();
      }
      loadToday();
      loadLabelsLocal();
      computeStreak();
      renderTracker();
    });

    netlifyIdentity.on('login', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      netlifyIdentity.close();
      const pulled = await pullFromServer();
      loadToday();
      loadLabelsLocal();
      computeStreak();
      renderTracker();
      /* Only upload when the download succeeded AND this device actually has
         something to contribute. Either guard alone is not enough. */
      if (pulled && hasLocalData()) await pushToServer();
      renderSyncNote();
    });

    netlifyIdentity.on('logout', () => {
      currentUser = null;
      renderAuthLoggedOut();
      renderSyncNote();
    });

    netlifyIdentity.on('signup', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      await pushToServer();
    });

    netlifyIdentity.init();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initApp();
    if (typeof netlifyIdentity !== 'undefined') {
      initIdentity();
    } else {
      window.addEventListener('load', initIdentity);
    }
  });
})();
</script>
</body>
</html>
