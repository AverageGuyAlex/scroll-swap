<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scroll Swap</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scroll Swap">
<meta name="theme-color" content="#1C1F1D">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%231C1F1D'/%3E%3Crect x='10' y='10' width='160' height='160' rx='30' fill='none' stroke='%23C9A24B' stroke-width='2'/%3E%3Cpath d='M48 92L78 124L132 56' fill='none' stroke='%237A9B7E' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%231C1F1D'/%3E%3Cpath d='M48 92L78 124L132 56' fill='none' stroke='%237A9B7E' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: #1C1F1D;
    min-height: 100vh;
    min-height: 100dvh;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: max(28px, env(safe-area-inset-top));
    padding-bottom: env(safe-area-inset-bottom);
  }

  #app {
    --ink: #EDEAE2;
    --ink-dim: #A8A296;
    --bg: #1C1F1D;
    --card: #242824;
    --card-line: #34392F;
    --gold: #C9A24B;
    --sage: #7A9B7E;
    font-family: Georgia, 'Iowan Old Style', serif;
    color: var(--ink);
    background: var(--bg);
    padding: 8px 22px 40px;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
  }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    position: relative;
  }
  .nav-btn {
    font-family: 'Courier New', monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--card-line);
    border-radius: 7px;
    padding: 9px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-dropdown {
    position: absolute;
    top: 42px;
    left: 0;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 10px;
    overflow: hidden;
    z-index: 10;
    min-width: 190px;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .nav-dropdown.open { display: block; }
  .nav-link {
    display: block;
    padding: 12px 16px;
    font-family: 'Courier New', monospace;
    font-size: 12.5px;
    color: var(--ink-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--card-line);
  }
  .nav-link:last-child { border-bottom: none; }
  .nav-link.active { color: var(--gold); }
  .nav-link.disabled { opacity: 0.4; pointer-events: none; }

  .header { margin-bottom: 18px; }
  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 6px;
  }
  .title {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    font-family: 'Courier New', monospace;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin: 0;
  }

  .auth-card {
    margin: 16px 0 20px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .auth-status {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .auth-email {
    font-family: Georgia, serif;
    font-size: 14.5px;
    color: var(--ink);
    margin: 2px 0 0;
  }
  .auth-btn {
    font-family: 'Courier New', monospace;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  .auth-btn:active { opacity: 0.8; }
  .auth-btn.secondary {
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--card-line);
  }

  .streak-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 24px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 10px;
  }
  .streak-num {
    font-size: 32px;
    font-weight: 700;
    color: var(--gold);
    font-family: Georgia, serif;
    line-height: 1;
  }
  .streak-label {
    font-family: 'Courier New', monospace;
    font-size: 11.5px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .slot {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--card-line);
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .slot:last-of-type { border-bottom: none; }
  .slot:active { opacity: 0.7; }

  .box {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    margin-top: 2px;
    border: 1.5px solid var(--ink-dim);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .box.checked {
    background: var(--sage);
    border-color: var(--sage);
  }
  .box svg { opacity: 0; transition: opacity 0.1s ease; }
  .box.checked svg { opacity: 1; }

  .slot-text { flex: 1; }
  .slot-time {
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin: 0 0 3px;
  }
  .slot-swap {
    font-size: 16px;
    margin: 0;
    line-height: 1.3;
  }
  .slot.checked .slot-swap { color: var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--card-line); }

  .footer-note {
    margin-top: 22px;
    font-family: 'Courier New', monospace;
    font-size: 11.5px;
    color: var(--ink-dim);
    text-align: center;
    line-height: 1.6;
  }

  .sync-note {
    margin-top: 6px;
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    color: var(--ink-dim);
    text-align: center;
  }

  .reset-link {
    display: block;
    width: 100%;
    text-align: center;
    margin-top: 14px;
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    color: var(--ink-dim);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 8px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="nav-row">
    <button class="nav-btn" id="navToggle">&#9776; Menu</button>
    <div class="nav-dropdown" id="navDropdown">
      <a href="index.html" class="nav-link active">Scroll Swap</a>
      <a href="pomodoro.html" class="nav-link">Pomodoro</a>
      <a href="diary.html" class="nav-link">Diary</a>
      <a href="#" class="nav-link disabled">To-Do (coming soon)</a>
    </div>
  </div>

  <div class="header">
    <p class="eyebrow">Daily log</p>
    <h1 class="title">Scroll Swap</h1>
    <p class="subtitle">Four slots a day. Beat the reflex, not the urge.</p>
  </div>

  <div class="auth-card" id="authCard">
    <p class="auth-status">Checking login&hellip;</p>
  </div>

  <div id="tracker"></div>
</div>

<script>
(function() {
  const STORAGE_PREFIX = 'scrollswap_';
  const FUNCTION_URL = '/.netlify/functions/habits';

  const DEFAULT_SLOTS = [
    { id: 'wake', time: 'Wake up', swap: 'Music or a podcast on, before the phone comes out' },
    { id: 'morning', time: 'Morning', swap: 'Stretch, eat breakfast, or read something short before opening socials' },
    { id: 'between', time: 'Afternoon', swap: 'A few quick chess games instead of reels' },
    { id: 'evening', time: 'Evening', swap: 'Hoops, a walk, or reading something you chose' },
    { id: 'before_bed', time: 'Before bed', swap: 'Audio only, screen face-down or out of reach' },
  ];

  let customLabels = {}; // { [slotId]: { time, swap } }

  function getSlots() {
    return DEFAULT_SLOTS.map(s => ({
      id: s.id,
      time: (customLabels[s.id] && customLabels[s.id].time) || s.time,
      swap: (customLabels[s.id] && customLabels[s.id].swap) || s.swap,
    }));
  }

  function winThreshold() {
    return Math.ceil(DEFAULT_SLOTS.length / 2);
  }

  let state = {};
  let streak = 0;
  let currentUser = null;
  let syncing = false;

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function todayKey() { return STORAGE_PREFIX + dateKey(new Date()); }

  function checkmarkSVG() {
    return '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#1C1F1D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function isWin(s) {
    return Object.values(s).filter(Boolean).length >= winThreshold();
  }

  function loadToday() {
    try {
      const raw = localStorage.getItem(todayKey());
      state = raw ? JSON.parse(raw) : {};
    } catch (e) { state = {}; }
  }

  function labelsKey() { return STORAGE_PREFIX + '_labels'; }

  function loadLabelsLocal() {
    try {
      const raw = localStorage.getItem(labelsKey());
      customLabels = raw ? JSON.parse(raw) : {};
    } catch (e) { customLabels = {}; }
  }

  function saveLabelsLocal() {
    try {
      localStorage.setItem(labelsKey(), JSON.stringify(customLabels));
    } catch (e) { console.error('Label save failed', e); }
  }

  function saveTodayLocal() {
    try {
      localStorage.setItem(todayKey(), JSON.stringify(state));
    } catch (e) { console.error('Local save failed', e); }
  }

  function computeStreak() {
    let count = 0;
    let cursor = new Date();
    const todayWin = isWin(state);
    if (!todayWin) cursor.setDate(cursor.getDate() - 1);
    for (let i = 0; i < 365; i++) {
      const raw = localStorage.getItem(STORAGE_PREFIX + dateKey(cursor));
      if (!raw) break;
      try {
        const day = JSON.parse(raw);
        if (!isWin(day)) break;
        count++;
        cursor.setDate(cursor.getDate() - 1);
      } catch (e) { break; }
    }
    streak = count;
  }

  // ---- Server sync (only when logged in) ----

  function collectAllLocalHistory() {
    const history = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(STORAGE_PREFIX)) {
        const date = key.slice(STORAGE_PREFIX.length);
        try { history[date] = JSON.parse(localStorage.getItem(key)); } catch (e) {}
      }
    }
    return history;
  }

  function writeHistoryToLocal(history) {
    Object.keys(history || {}).forEach(date => {
      localStorage.setItem(STORAGE_PREFIX + date, JSON.stringify(history[date]));
    });
  }

  async function pullFromServer() {
    if (!currentUser) return;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(FUNCTION_URL, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) return;
      const serverHistory = await res.json();
      writeHistoryToLocal(serverHistory);
    } catch (e) {
      console.error('Pull failed', e);
    }
  }

  async function pushToServer() {
    if (!currentUser) return;
    syncing = true;
    renderSyncNote();
    try {
      const token = await currentUser.jwt();
      const history = collectAllLocalHistory();
      await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(history),
      });
    } catch (e) {
      console.error('Push failed', e);
    } finally {
      syncing = false;
      renderSyncNote();
    }
  }

  function renderSyncNote() {
    const el = document.getElementById('syncNote');
    if (!el) return;
    if (!currentUser) {
      el.textContent = 'Not synced \u2014 log in to save across devices';
    } else if (syncing) {
      el.textContent = 'Syncing\u2026';
    } else {
      el.textContent = 'Synced to your account';
    }
  }

  // ---- Tracker UI ----

  let editMode = false;

  function renderTracker() {
    if (editMode) {
      renderEditView();
    } else {
      renderNormalView();
    }
  }

  function renderNormalView() {
    const tracker = document.getElementById('tracker');
    const checkedCount = Object.values(state).filter(Boolean).length;
    const slots = getSlots();
    tracker.innerHTML = `
      <div class="streak-row">
        <span class="streak-num">${streak}</span>
        <span class="streak-label">day streak${streak === 1 ? '' : 's'}<br>(${winThreshold()}+ swaps a day)</span>
      </div>
      <div class="slots">
        ${slots.map(s => `
          <div class="slot ${state[s.id] ? 'checked' : ''}" data-id="${s.id}">
            <div class="box ${state[s.id] ? 'checked' : ''}">${checkmarkSVG()}</div>
            <div class="slot-text">
              <p class="slot-time">${s.time}</p>
              <p class="slot-swap">${s.swap}</p>
            </div>
          </div>
        `).join('')}
      </div>
      <p class="footer-note">${checkedCount} of ${slots.length} today &middot; resets at midnight</p>
      <p class="sync-note" id="syncNote"></p>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="reset-link" id="resetBtn" style="flex:1;">clear today</button>
        <button class="reset-link" id="editBtn" style="flex:1;">edit text</button>
      </div>
    `;

    tracker.querySelectorAll('.slot').forEach(el => {
      el.addEventListener('click', async () => {
        const id = el.dataset.id;
        state[id] = !state[id];
        saveTodayLocal();
        computeStreak();
        renderTracker();
        if (currentUser) await pushToServer();
      });
    });

    document.getElementById('resetBtn').addEventListener('click', async () => {
      state = {};
      saveTodayLocal();
      computeStreak();
      renderTracker();
      if (currentUser) await pushToServer();
    });

    document.getElementById('editBtn').addEventListener('click', () => {
      editMode = true;
      renderTracker();
    });

    renderSyncNote();
  }

  function renderEditView() {
    const tracker = document.getElementById('tracker');
    const slots = getSlots();
    tracker.innerHTML = `
      <p class="footer-note" style="margin-top:0; margin-bottom:16px;">Edit the label and swap idea for each slot below.</p>
      <div class="slots">
        ${slots.map(s => `
          <div class="slot" style="cursor:default; flex-direction:column; align-items:stretch; gap:8px;">
            <input type="text" class="duration-input edit-time-input" data-id="${s.id}" value="${s.time.replace(/"/g, '&quot;')}"
              style="width:100%; text-align:left; padding:10px;">
            <textarea class="duration-input edit-swap-input" data-id="${s.id}" rows="2"
              style="width:100%; text-align:left; padding:10px; resize:vertical; font-family:Georgia, serif; font-size:15px;">${s.swap}</textarea>
          </div>
        `).join('')}
      </div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="reset-link" id="cancelEditBtn" style="flex:1;">cancel</button>
        <button class="reset-link" id="saveEditBtn" style="flex:1; color:var(--sage);">save</button>
      </div>
    `;

    document.getElementById('cancelEditBtn').addEventListener('click', () => {
      editMode = false;
      renderTracker();
    });

    document.getElementById('saveEditBtn').addEventListener('click', async () => {
      const timeInputs = tracker.querySelectorAll('.edit-time-input');
      const swapInputs = tracker.querySelectorAll('.edit-swap-input');
      timeInputs.forEach(input => {
        const id = input.dataset.id;
        customLabels[id] = customLabels[id] || {};
        customLabels[id].time = input.value.trim() || DEFAULT_SLOTS.find(d => d.id === id).time;
      });
      swapInputs.forEach(input => {
        const id = input.dataset.id;
        customLabels[id] = customLabels[id] || {};
        customLabels[id].swap = input.value.trim() || DEFAULT_SLOTS.find(d => d.id === id).swap;
      });
      saveLabelsLocal();
      editMode = false;
      renderTracker();
      if (currentUser) await pushToServer();
    });
  }

  // ---- Auth UI ----

  function renderAuthLoggedOut() {
    const card = document.getElementById('authCard');
    card.innerHTML = `
      <div>
        <p class="auth-status">Not logged in</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="auth-btn secondary" id="loginBtn">Log in</button>
        <button class="auth-btn" id="signupBtn">Sign up</button>
      </div>
    `;
    document.getElementById('signupBtn').addEventListener('click', () => netlifyIdentity.open('signup'));
    document.getElementById('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'));
  }

  function renderAuthLoggedIn(user) {
    const card = document.getElementById('authCard');
    card.innerHTML = `
      <div>
        <p class="auth-status">Logged in</p>
        <p class="auth-email">${user.email}</p>
      </div>
      <button class="auth-btn secondary" id="logoutBtn">Log out</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', () => netlifyIdentity.logout());
  }

  // ---- Nav dropdown ----

  function initNav() {
    const toggle = document.getElementById('navToggle');
    const dropdown = document.getElementById('navDropdown');
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => dropdown.classList.remove('open'));
  }

  // ---- Init ----

  async function initApp() {
    loadToday();
    loadLabelsLocal();
    computeStreak();
    renderTracker();
    initNav();
  }

  function initIdentity() {
    if (typeof netlifyIdentity === 'undefined') {
      document.getElementById('authCard').innerHTML =
        '<p class="auth-status">Identity widget failed to load. Check your connection and reload.</p>';
      return;
    }

    netlifyIdentity.on('init', async user => {
      currentUser = user || null;
      if (user) {
        renderAuthLoggedIn(user);
        await pullFromServer();
      } else {
        renderAuthLoggedOut();
      }
      loadToday();
      loadLabelsLocal();
      computeStreak();
      renderTracker();
    });

    netlifyIdentity.on('login', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      netlifyIdentity.close();
      await pullFromServer();
      loadToday();
      loadLabelsLocal();
      computeStreak();
      renderTracker();
      await pushToServer();
    });

    netlifyIdentity.on('logout', () => {
      currentUser = null;
      renderAuthLoggedOut();
      renderSyncNote();
    });

    netlifyIdentity.on('signup', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      await pushToServer();
    });

    netlifyIdentity.init();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initApp();
    if (typeof netlifyIdentity !== 'undefined') {
      initIdentity();
    } else {
      window.addEventListener('load', initIdentity);
    }
  });
})();
</script>
</body>
</html>
