<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); min-height: 100vh; min-height: 100dvh; }
  body {
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: max(28px, env(safe-area-inset-top)); padding-bottom: env(safe-area-inset-bottom);
  }
  :root {
    --ink: #EDEAE2;
    --ink-dim: #A8A296;
    --bg: #1C1F1D;
    --card: #242824;
    --card-line: #34392F;
    --gold: #C9A24B;
    --sage: #7A9B7E;
  }
  :root.theme-light {
    --ink: #2A2A26;
    --ink-dim: #8A8478;
    --bg: #F3F1EA;
    --card: #FFFFFF;
    --card-line: #DDD8CB;
    --gold: #A97F2E;
    --sage: #4F7A57;
  }

  #app {
    font-family: Georgia, 'Iowan Old Style', serif; color: var(--ink); background: var(--bg);
    padding: 8px 22px 40px; max-width: 480px; width: 100%; margin: 0 auto;
  }

  /* Nav */
  .nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; position: relative; }
  .nav-btn {
    font-family: 'Courier New', monospace; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--card); color: var(--ink); border: 1px solid var(--card-line); border-radius: 7px;
    padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .nav-dropdown {
    position: absolute; top: 42px; left: 0; background: var(--card); border: 1px solid var(--card-line);
    border-radius: 10px; overflow: hidden; z-index: 10; min-width: 190px; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .nav-dropdown.open { display: block; }
  .nav-link {
    display: block; padding: 12px 16px; font-family: 'Courier New', monospace; font-size: 12.5px;
    color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid var(--card-line);
  }
  .nav-link:last-child { border-bottom: none; }
  .nav-link.active { color: var(--gold); }

  .gear-btn {
    width: 38px; height: 38px; border-radius: 8px; background: var(--card); border: 1px solid var(--card-line);
    color: var(--ink-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .gear-dropdown {
    position: absolute; top: 42px; right: 0; background: var(--card); border: 1px solid var(--card-line);
    border-radius: 10px; overflow: hidden; z-index: 10; min-width: 210px; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); padding: 14px 16px;
  }
  .gear-dropdown.open { display: block; }
  .gear-status {
    font-family: 'Courier New', monospace; font-size: 11px; color: var(--ink-dim); margin: 0 0 6px;

  }
  .gear-email { font-family: Georgia, serif; font-size: 14.5px; color: var(--ink); margin: 0 0 12px; }
  .gear-note { font-family: 'Courier New', monospace; font-size: 11.5px; color: var(--ink-dim); line-height: 1.5; margin: 0; }
  .theme-toggle-row {
    display: flex; gap: 6px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--card-line);
  }
  .theme-btn {
    flex: 1; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase;
    background: var(--bg); color: var(--ink-dim); border: 1px solid var(--card-line); border-radius: 6px;

  .theme-btn.selected { background: var(--gold); color: var(--card); border-color: var(--gold); font-weight: 600; }
  .gear-settings-link {

  .inline-row { display: flex; gap: 8px; align-items: center; }
  .inline-btn {
    font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;

  .inline-btn.confirm { background: var(--sage); color: var(--bg); flex: 1; }
  .inline-btn.cancel { background: transparent; color: var(--ink-dim); border: 1px solid var(--card-line); }

  /* Category card */
  .cat-card { border-radius: 12px; margin-bottom: 14px; overflow: hidden; border: 1px solid var(--card-line); }
  .cat-header {
    display: flex; align-items: center; gap: 10px; padding: 14px 14px; background: var(--card); cursor: pointer;

  .cat-check { font-size: 13px; }
  .task-counter {
    font-family: 'Courier New', monospace; font-size: 11px; color: var(--ink-dim);
    background: var(--bg); border: 1px solid var(--card-line); border-radius: 6px; padding: 3px 7px; flex-shrink: 0;
  }
  .task-counter.complete { color: var(--sage); border-color: var(--sage); }
  .cat-actions { display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    background: transparent; border: none; color: var(--ink-dim); cursor: pointer; font-size: 15px; padding: 4px 6px;

  .cat-body { padding: 6px 14px 14px; background: var(--bg); }

  /* Subcategory */

  .subcat-header { display: flex; align-items: center; gap: 8px; padding: 8px 4px; cursor: pointer; }

  .subcat-name { font-size: 14.5px; font-weight: 600; flex: 1; color: var(--ink); }
  .subcat-name.complete { text-decoration: line-through; color: var(--ink-dim); }
  .subcat-check { font-size: 12px; }

  /* Task row */
  .task-row {

  .task-box {
    width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--ink-dim); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;

  .task-box.checked { background: var(--sage); border-color: var(--sage); }
  .task-box svg { opacity: 0; }
  .task-box.checked svg { opacity: 1; }
  .task-text { flex: 1; font-size: 15px; cursor: pointer; }
  .task-text.checked { color: var(--ink-dim); text-decoration: line-through; }
  .task-badge {
    font-family: 'Courier New', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-dim); border: 1px solid var(--card-line); border-radius: 4px; padding: 2px 5px; flex-shrink: 0;
  }
  .task-badge.overdue { color: #E07A5F; border-color: #E07A5F; }

  .cat-due-btn {
    font-family: 'Courier New', monospace; font-size: 10px; color: var(--ink-dim);
    border: 1px solid var(--card-line); border-radius: 6px; padding: 5px 8px; cursor: pointer;
    background: transparent; white-space: nowrap;
  }
  .cat-due-btn.overdue { color: #E07A5F; border-color: #E07A5F; }
  .task-due-btn {
    font-family: 'Courier New', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--ink-dim); border: 1px solid var(--card-line); border-radius: 5px; padding: 3px 7px;
    cursor: pointer; background: transparent; flex-shrink: 0; white-space: nowrap;
  }
  .task-due-btn.overdue { color: #E07A5F; border-color: #E07A5F; }
  .due-date-editor {
    background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; padding: 12px;
    margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px;
  }

  .add-row-btn {
    background: transparent; border: none; color: var(--ink-dim); font-family: 'Courier New', monospace;
    font-size: 11.5px; text-decoration: underline; cursor: pointer; padding: 8px 4px;
  }

  .empty-note {
    font-family: 'Courier New', monospace; font-size: 12px; color: var(--ink-dim); text-align: center; padding: 20px 0;
  }

  .archive-toggle-row { text-align: center; margin-top: 20px; }
  .archive-toggle-btn {
    font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
    background: transparent; color: var(--ink-dim); border: 1px solid var(--card-line); border-radius: 7px;

  .archive-panel { display: none; margin-top: 16px; }
  .archive-panel.open { display: block; }
  .archive-date-card {
    background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; margin-bottom: 10px; overflow: hidden;

  .archive-date-header {
    padding: 12px 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between;

  .archive-date-count { font-size: 11px; color: var(--ink-dim); }
  .archive-date-body { padding: 0 14px 12px; display: none; }
  .archive-date-body.open { display: block; }
  .archive-item {
    font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--card-line); color: var(--ink-dim);
  }
  .archive-item:last-child { border-bottom: none; }
  .archive-item-path { font-family: 'Courier New', monospace; font-size: 10px; color: var(--ink-dim); display: block; margin-top: 2px; }
  .archive-empty { font-family: 'Courier New', monospace; font-size: 12px; color: var(--ink-dim); text-align: center; padding: 16px 0; }

  .sync-note { margin-top: 16px; font-family: 'Courier New', monospace; font-size: 10.5px; color: var(--ink-dim); text-align: center; }

<body>

<script>
(function() {
  const STATE_KEY = 'scrollswap_todo_state';
  const FUNCTION_URL = '/.netlify/functions/todos';

  let currentUser = null;
  let syncing = false;
  let state = { categories: [], completions: {} };
  let addingCategory = false;
  let addingSubcatFor = null; // category id
  let addingTaskFor = null;   // { categoryId, subcatId }
  let editingDueDateFor = null; // category id
  let editingTaskDueFor = null; // { catId, subcatId, taskId }
  let expandedSubcats = new Set(); // subcategory ids currently expanded

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // ---- Storage ----

  function loadLocal() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      state = raw ? JSON.parse(raw) : { categories: [], completions: {} };
      if (!state.categories) state.categories = [];
      if (!state.completions) state.completions = {};
    } catch (e) { state = { categories: [], completions: {} }; }
  }

  function saveLocal() {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
    catch (e) { console.error('Save failed', e); }
  }

  async function pullFromServer() {
    if (!currentUser) return;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(FUNCTION_URL, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const serverState = await res.json();
      if (serverState && (serverState.categories || serverState.completions)) {
        state = {
          categories: serverState.categories || [],
          completions: serverState.completions || {},
        };
        saveLocal();
      }
    } catch (e) { console.error('Pull failed', e); }
  }

  async function pushToServer() {
    if (!currentUser) return;
    syncing = true;
    renderSyncNote();
    try {
      const token = await currentUser.jwt();
      await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(state),
      });
    } catch (e) {
      console.error('Push failed', e);
    } finally {
      syncing = false;
      renderSyncNote();
    }
  }

  function renderSyncNote() {
    const el = document.getElementById('syncNote');
    if (!el) return;
    if (!currentUser) el.textContent = 'Not synced \u2014 log in to save across devices';
    else if (syncing) el.textContent = 'Syncing\u2026';
    else el.textContent = 'Synced to your account';
  }

  async function persist() {
    saveLocal();
    if (currentUser) await pushToServer();
  }

  // ---- Completion logic ----

  function isTaskDone(task) {
    if (task.recurring) {
      const todayCompletions = state.completions[todayKey()] || {};
      return !!todayCompletions[task.id];
    }
    return !!task.done;
  }

  async function toggleTask(task) {
    if (task.recurring) {
      const key = todayKey();
      if (!state.completions[key]) state.completions[key] = {};
      state.completions[key][task.id] = !state.completions[key][task.id];
    } else {
      task.done = !task.done;
      if (task.done) {
        task.completedDate = todayKey();
      } else {
        delete task.completedDate;
      }
    }
    await persist();
    renderCategories();
  }

  function isSubcatComplete(subcat) {
    return subcat.tasks.length > 0 && subcat.tasks.every(isTaskDone);
  }

  function isCatComplete(cat) {
    return cat.subcategories.length > 0 && cat.subcategories.every(isSubcatComplete);
  }

  function countSubcatTasks(subcat) {
    const total = subcat.tasks.length;
    const done = subcat.tasks.filter(isTaskDone).length;
    return { done, total };
  }

  function countCatTasks(cat) {
    let done = 0, total = 0;
    cat.subcategories.forEach(sc => {
      const counts = countSubcatTasks(sc);
      done += counts.done;
      total += counts.total;
    });
    return { done, total };
  }

  // ---- Mutations ----

  async function addCategory(name, color, dueDate) {
    state.categories.push({ id: uid(), name, color, dueDate: dueDate || null, subcategories: [] });
    await persist();
  }

  async function deleteCategory(catId) {
    if (!confirm('Delete this category and everything in it?')) return;
    state.categories = state.categories.filter(c => c.id !== catId);
    await persist();
    renderCategories();
  }

  async function updateCategoryColor(catId, color) {
    const cat = state.categories.find(c => c.id === catId);
    if (cat) cat.color = color;
    await persist();
  }

  async function updateCategoryDueDate(catId, dueDate) {
    const cat = state.categories.find(c => c.id === catId);
    if (cat) cat.dueDate = dueDate || null;
    await persist();
  }

  async function addSubcategory(catId, name) {
    const cat = state.categories.find(c => c.id === catId);
    const newSubcat = { id: uid(), name, tasks: [] };
    if (cat) cat.subcategories.push(newSubcat);
    await persist();
    return newSubcat.id;
  }

  async function deleteSubcategory(catId, subcatId) {
    if (!confirm('Delete this subcategory and its tasks?')) return;
    const cat = state.categories.find(c => c.id === catId);
    if (cat) cat.subcategories = cat.subcategories.filter(s => s.id !== subcatId);
    await persist();
    renderCategories();
  }

  async function addTask(catId, subcatId, text, recurring, scheduledDate) {
    const cat = state.categories.find(c => c.id === catId);
    const subcat = cat && cat.subcategories.find(s => s.id === subcatId);
    const task = { id: uid(), text, recurring, done: false };
    if (!recurring && scheduledDate) task.scheduledDate = scheduledDate;
    if (subcat) subcat.tasks.push(task);
    await persist();
  }

  async function deleteTask(catId, subcatId, taskId) {
    const cat = state.categories.find(c => c.id === catId);
    const subcat = cat && cat.subcategories.find(s => s.id === subcatId);
    if (subcat) subcat.tasks = subcat.tasks.filter(t => t.id !== taskId);
    await persist();
    renderCategories();
  }

  async function updateTaskScheduledDate(catId, subcatId, taskId, dateStr) {
    const cat = state.categories.find(c => c.id === catId);
    const subcat = cat && cat.subcategories.find(s => s.id === subcatId);
    const task = subcat && subcat.tasks.find(t => t.id === taskId);
    if (task) {
      if (dateStr) task.scheduledDate = dateStr;
      else delete task.scheduledDate;
    }
    await persist();
  }

  function checkmarkSVG() {
    return '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#1C1F1D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function formatShortDate(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-').map(Number);
    const dateObj = new Date(y, m - 1, d);
    return dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function isOverdue(dateStr, done) {
    if (!dateStr || done) return false;
    return dateStr < todayKey();
  }

  function sortedTasks(subcat) {
    return [...subcat.tasks].sort((a, b) => {
      if (a.recurring && !b.recurring) return -1;
      if (!a.recurring && b.recurring) return 1;
      if (a.recurring && b.recurring) return 0;
      const aDate = a.scheduledDate || '9999-99-99';
      const bDate = b.scheduledDate || '9999-99-99';
      return aDate < bDate ? -1 : aDate > bDate ? 1 : 0;
    });
  }

  // ---- Rendering ----

  function renderAddCategoryArea() {

    if (!addingCategory) {
      area.innerHTML = `<button class="add-cat-btn" id="showAddCatBtn">+ Add category</button>`;
      document.getElementById('showAddCatBtn').addEventListener('click', () => {
        addingCategory = true;
        renderAddCategoryArea();
      });
      return;
    }
    area.innerHTML = `
      <div class="inline-form">
        <div class="inline-row">
          <input type="color" class="color-swatch-input" id="newCatColor" value="#C9A24B">
          <input type="text" class="inline-input" id="newCatName" placeholder="Category name (e.g. School)" style="flex:1;">
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-family:'Courier New', monospace; font-size:12px; color:var(--ink-dim);">
          Due date (optional)
          <input type="date" class="inline-input" id="newCatDueDate" style="width:auto; padding:6px 8px;">
        </label>
        <div class="inline-row">
          <button class="inline-btn cancel" id="cancelCatBtn">Cancel</button>
          <button class="inline-btn confirm" id="confirmCatBtn">Add</button>
        </div>
      </div>
    `;
    document.getElementById('cancelCatBtn').addEventListener('click', () => {
      addingCategory = false;
      renderAddCategoryArea();
    });

      const color = document.getElementById('newCatColor').value;
      const dueDate = document.getElementById('newCatDueDate').value;
      if (!name) return;
      await addCategory(name, color, dueDate);
      addingCategory = false;
      renderAddCategoryArea();
      renderCategories();
    });
  }

  function renderCategories() {
    const list = document.getElementById('categoriesList');

    if (state.categories.length === 0) {
      list.innerHTML = '<p class="empty-note">No categories yet. Add one to get started.</p>';
      return;
    }

    list.innerHTML = state.categories.map(cat => renderCategoryCard(cat)).join('');
    attachCategoryListeners();
  }

  function renderCategoryCard(cat) {
    const complete = isCatComplete(cat);
    const counts = countCatTasks(cat);
    const dueOverdue = cat.dueDate && !complete && cat.dueDate < todayKey();
    return `
      <div class="cat-card" data-cat-id="${cat.id}">
        <div class="cat-header" style="border-left: 4px solid ${cat.color};">
          <input type="color" class="color-swatch-input cat-color-input" data-cat-id="${cat.id}" value="${cat.color}" style="width:22px; height:22px;">
          <span class="cat-name ${complete ? 'complete' : ''}">${cat.name}</span>
          ${counts.total > 0 ? `<span class="task-counter ${counts.done === counts.total ? 'complete' : ''}">${counts.done}/${counts.total}</span>` : ''}
          ${complete ? '<span class="cat-check">&#10003;</span>' : ''}
          <div class="cat-actions">
            <button class="cat-due-btn ${dueOverdue ? 'overdue' : ''}" data-cat-id="${cat.id}">
              ${cat.dueDate ? `Due ${formatShortDate(cat.dueDate)}` : 'Set due date'}
            </button>
            <button class="icon-btn delete-cat-btn" data-cat-id="${cat.id}">&times;</button>
          </div>
        </div>
        <div class="cat-body">
          ${editingDueDateFor === cat.id ? renderDueDateEditor(cat) : ''}
          ${cat.subcategories.map(sc => renderSubcatBlock(cat, sc)).join('')}
          ${addingSubcatFor === cat.id ? renderAddSubcatForm(cat.id) : `<button class="add-row-btn add-subcat-trigger" data-cat-id="${cat.id}">+ Add subcategory</button>`}
        </div>
      </div>
    `;
  }

  function renderDueDateEditor(cat) {
    return `
      <div class="due-date-editor">
        <input type="date" class="inline-input due-date-input" data-cat-id="${cat.id}" value="${cat.dueDate || ''}">
        <div class="inline-row">
          <button class="inline-btn cancel clear-due-btn" data-cat-id="${cat.id}">Clear</button>
          <button class="inline-btn cancel cancel-due-btn" data-cat-id="${cat.id}">Cancel</button>
          <button class="inline-btn confirm save-due-btn" data-cat-id="${cat.id}">Save</button>
        </div>
      </div>
    `;
  }

  function renderSubcatBlock(cat, subcat) {
    const complete = isSubcatComplete(subcat);
    const counts = countSubcatTasks(subcat);
    const expanded = expandedSubcats.has(subcat.id);
    return `
      <div class="subcat-block">
        <div class="subcat-header" data-cat-id="${cat.id}" data-subcat-id="${subcat.id}">
          <span class="subcat-chevron ${expanded ? 'open' : ''}">&#9656;</span>
          <span class="subcat-name ${complete ? 'complete' : ''}">${subcat.name}</span>
          ${counts.total > 0 ? `<span class="task-counter ${counts.done === counts.total ? 'complete' : ''}">${counts.done}/${counts.total}</span>` : ''}
          ${complete ? '<span class="subcat-check">&#10003;</span>' : ''}
          <button class="icon-btn delete-subcat-btn" data-cat-id="${cat.id}" data-subcat-id="${subcat.id}">&times;</button>
        </div>
        ${expanded ? `
          <div class="task-list">
            ${sortedTasks(subcat).map(t => renderTaskRow(cat.id, subcat.id, t)).join('')}
          </div>
          ${addingTaskFor && addingTaskFor.categoryId === cat.id && addingTaskFor.subcatId === subcat.id
            ? renderAddTaskForm(cat.id, subcat.id)
            : `<button class="add-row-btn add-task-trigger" data-cat-id="${cat.id}" data-subcat-id="${subcat.id}">+ Add task</button>`}
        ` : ''}
      </div>
    `;
  }

  function renderTaskDueDateEditor(catId, subcatId, task) {
    return `
      <div class="due-date-editor" style="margin: 4px 0 8px 34px;">
        <input type="date" class="inline-input task-due-date-input" data-cat-id="${catId}" data-subcat-id="${subcatId}" data-task-id="${task.id}" value="${task.scheduledDate || ''}">
        <div class="inline-row">
          <button class="inline-btn cancel clear-task-due-btn" data-cat-id="${catId}" data-subcat-id="${subcatId}" data-task-id="${task.id}">Clear</button>
          <button class="inline-btn cancel cancel-task-due-btn" data-cat-id="${catId}" data-subcat-id="${subcatId}" data-task-id="${task.id}">Cancel</button>
          <button class="inline-btn confirm save-task-due-btn" data-cat-id="${catId}" data-subcat-id="${subcatId}" data-task-id="${task.id}">Save</button>
        </div>
      </div>
    `;
  }

  function renderTaskRow(catId, subcatId, task) {
    const done = isTaskDone(task);
    const overdue = isOverdue(task.scheduledDate, done);
    const isEditingThis = editingTaskDueFor && editingTaskDueFor.catId === catId
      && editingTaskDueFor.subcatId === subcatId && editingTaskDueFor.taskId === task.id;
    return `
      <div class="task-row">
        <div class="task-box ${done ? 'checked' : ''}" data-task-id="${task.id}" data-cat-id="${catId}" data-subcat-id="${subcatId}">
          ${checkmarkSVG()}
        </div>
        <span class="task-text ${done ? 'checked' : ''}" data-task-id="${task.id}" data-cat-id="${catId}" data-subcat-id="${subcatId}">${task.text}</span>
        ${task.recurring ? '<span class="task-badge">Recurring</span>' : `
          <button class="task-due-btn ${overdue ? 'overdue' : ''}" data-cat-id="${catId}" data-subcat-id="${subcatId}" data-task-id="${task.id}">
            ${task.scheduledDate ? `${overdue ? 'Overdue ' : ''}${formatShortDate(task.scheduledDate)}` : 'Set due date'}
          </button>
        `}
        <button class="icon-btn delete-task-btn" data-cat-id="${catId}" data-subcat-id="${subcatId}" data-task-id="${task.id}">&times;</button>
      </div>
      ${isEditingThis ? renderTaskDueDateEditor(catId, subcatId, task) : ''}
    `;
  }

  function renderAddSubcatForm(catId) {
    return `
      <div class="inline-form" style="margin-top:8px;">
        <input type="text" class="inline-input new-subcat-name" data-cat-id="${catId}" placeholder="Subcategory name (e.g. Math)">
        <div class="inline-row">
          <button class="inline-btn cancel cancel-subcat-btn" data-cat-id="${catId}">Cancel</button>
          <button class="inline-btn confirm confirm-subcat-btn" data-cat-id="${catId}">Add</button>
        </div>
      </div>
    `;
  }

  function renderAddTaskForm(catId, subcatId) {
    return `
      <div class="inline-form" style="margin-top:6px; margin-bottom:8px;">
        <input type="text" class="inline-input new-task-text" data-cat-id="${catId}" data-subcat-id="${subcatId}" placeholder="Task (e.g. Complete page 54)">
        <label style="display:flex; align-items:center; gap:8px; font-family:'Courier New', monospace; font-size:12px; color:var(--ink-dim);">

  function attachCategoryListeners() {
    // Category color change
    document.querySelectorAll('.cat-color-input').forEach(input => {
      input.addEventListener('change', async () => {
        await updateCategoryColor(input.dataset.catId, input.value);
        renderCategories();
      });
    });

    // Delete category
    document.querySelectorAll('.delete-cat-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteCategory(btn.dataset.catId));
    });

    // Add subcategory trigger
    document.querySelectorAll('.add-subcat-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        addingSubcatFor = btn.dataset.catId;
        renderCategories();
      });
    });
    document.querySelectorAll('.cancel-subcat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        addingSubcatFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.confirm-subcat-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const input = document.querySelector(`.new-subcat-name[data-cat-id="${btn.dataset.catId}"]`);
        const name = input.value.trim();
        if (!name) return;
        const newSubcatId = await addSubcategory(btn.dataset.catId, name);
        expandedSubcats.add(newSubcatId);
        addingSubcatFor = null;
        renderCategories();
      });
    });

    // Delete subcategory
    document.querySelectorAll('.delete-subcat-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteSubcategory(btn.dataset.catId, btn.dataset.subcatId);
      });
    });

    // Expand/collapse subcategory
    document.querySelectorAll('.subcat-header').forEach(header => {
      header.addEventListener('click', () => {
        const subcatId = header.dataset.subcatId;
        if (expandedSubcats.has(subcatId)) {
          expandedSubcats.delete(subcatId);
        } else {
          expandedSubcats.add(subcatId);
        }
        renderCategories();
      });
    });

    // Add task trigger
    document.querySelectorAll('.add-task-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        addingTaskFor = { categoryId: btn.dataset.catId, subcatId: btn.dataset.subcatId };
        renderCategories();
      });
    });
    document.querySelectorAll('.cancel-task-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        addingTaskFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.confirm-task-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const catId = btn.dataset.catId, subcatId = btn.dataset.subcatId;
        const textInput = document.querySelector(`.new-task-text[data-cat-id="${catId}"][data-subcat-id="${subcatId}"]`);
        const recurringInput = document.querySelector(`.new-task-recurring[data-cat-id="${catId}"][data-subcat-id="${subcatId}"]`);
        const text = textInput.value.trim();
        if (!text) return;
        await addTask(catId, subcatId, text, recurringInput.checked, null);
        addingTaskFor = null;
        renderCategories();
      });
    });

    // Category due date button
    document.querySelectorAll('.cat-due-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        editingDueDateFor = editingDueDateFor === btn.dataset.catId ? null : btn.dataset.catId;
        renderCategories();
      });
    });
    document.querySelectorAll('.cancel-due-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        editingDueDateFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.clear-due-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await updateCategoryDueDate(btn.dataset.catId, '');
        editingDueDateFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.save-due-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const input = document.querySelector(`.due-date-input[data-cat-id="${btn.dataset.catId}"]`);
        await updateCategoryDueDate(btn.dataset.catId, input.value);
        editingDueDateFor = null;
        renderCategories();
      });
    });

    // Toggle task
    document.querySelectorAll('.task-box, .task-text').forEach(el => {
      el.addEventListener('click', async () => {
        const catId = el.dataset.catId, subcatId = el.dataset.subcatId, taskId = el.dataset.taskId;
        const cat = state.categories.find(c => c.id === catId);
        const subcat = cat && cat.subcategories.find(s => s.id === subcatId);
        const task = subcat && subcat.tasks.find(t => t.id === taskId);
        if (task) await toggleTask(task);
      });
    });

    // Delete task
    document.querySelectorAll('.delete-task-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteTask(btn.dataset.catId, btn.dataset.subcatId, btn.dataset.taskId));
    });

    // Task due date button
    document.querySelectorAll('.task-due-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = { catId: btn.dataset.catId, subcatId: btn.dataset.subcatId, taskId: btn.dataset.taskId };
        const isSame = editingTaskDueFor && editingTaskDueFor.catId === key.catId
          && editingTaskDueFor.subcatId === key.subcatId && editingTaskDueFor.taskId === key.taskId;
        editingTaskDueFor = isSame ? null : key;
        renderCategories();
      });
    });
    document.querySelectorAll('.cancel-task-due-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        editingTaskDueFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.clear-task-due-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await updateTaskScheduledDate(btn.dataset.catId, btn.dataset.subcatId, btn.dataset.taskId, '');
        editingTaskDueFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.save-task-due-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const input = document.querySelector(`.task-due-date-input[data-task-id="${btn.dataset.taskId}"]`);
        await updateTaskScheduledDate(btn.dataset.catId, btn.dataset.subcatId, btn.dataset.taskId, input.value);
        editingTaskDueFor = null;
        renderCategories();
      });
    });
  }

  // ---- Archive ----

  let archiveOpen = false;

  function gatherArchiveDates() {
    const dates = new Set();

    Object.keys(state.completions).forEach(date => {
      const dayMap = state.completions[date] || {};
      if (Object.values(dayMap).some(Boolean)) dates.add(date);
    });

    state.categories.forEach(cat => {
      cat.subcategories.forEach(sc => {
        sc.tasks.forEach(t => {
          if (!t.recurring && t.completedDate) dates.add(t.completedDate);
        });
      });
    });

    return Array.from(dates).sort().reverse();
  }

  function getArchiveItemsForDate(date) {
    const items = [];
    const dayCompletions = state.completions[date] || {};

    state.categories.forEach(cat => {
      cat.subcategories.forEach(sc => {
        sc.tasks.forEach(t => {
          const path = `${cat.name} &gt; ${sc.name}`;
          if (t.recurring && dayCompletions[t.id]) {
            items.push({ text: t.text, path, recurring: true });
          } else if (!t.recurring && t.completedDate === date) {
            items.push({ text: t.text, path, recurring: false });
          }
        });
      });
    });

    return items;
  }

  function formatArchiveDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderArchivePanel() {
    const panel = document.getElementById('archivePanel');
    const dates = gatherArchiveDates();

    if (dates.length === 0) {
      panel.innerHTML = '<p class="archive-empty">No completed tasks recorded yet</p>';
      return;
    }

    panel.innerHTML = dates.map(date => {
      const items = getArchiveItemsForDate(date);
      return `
        <div class="archive-date-card">
          <div class="archive-date-header" data-date="${date}">
            <span>${formatArchiveDate(date)}</span>
            <span class="archive-date-count">${items.length} completed</span>
          </div>
          <div class="archive-date-body" id="archive-body-${date}">
            ${items.map(item => `
              <div class="archive-item">
                ${item.text}
                <span class="archive-item-path">${item.path}${item.recurring ? ' &middot; Recurring' : ''}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }).join('');

    panel.querySelectorAll('.archive-date-header').forEach(header => {
      header.addEventListener('click', () => {
        const body = document.getElementById(`archive-body-${header.dataset.date}`);
        body.classList.toggle('open');
      });
    });
  }

  function initArchiveToggle() {
    const btn = document.getElementById('archiveToggleBtn');
    const panel = document.getElementById('archivePanel');
    btn.addEventListener('click', () => {
      archiveOpen = !archiveOpen;
      panel.classList.toggle('open', archiveOpen);
      btn.textContent = archiveOpen ? 'Hide archive' : 'View archive';
      if (archiveOpen) renderArchivePanel();
    });
  }

  // ---- Init ----

  function initApp() {
    initTheme();
    document.getElementById('categoriesList').innerHTML = '<p class="empty-note">Loading your tasks&hellip;</p>';
    renderAddCategoryArea();
    initNav();
    initArchiveToggle();
  }

  function initIdentity() {
    if (typeof netlifyIdentity === 'undefined') {
      document.getElementById('authCard').innerHTML =
        '<p class="auth-status">Identity widget failed to load. Check your connection and reload.</p>';
      loadLocal();
      renderCategories();
      return;
    }

    netlifyIdentity.on('init', async user => {
      currentUser = user || null;
      if (user) {
        renderAuthLoggedIn(user);
        await pullFromServer();
      } else {
        renderAuthLoggedOut();
      }
      loadLocal();
      renderCategories();
      renderSyncNote();
    });

    netlifyIdentity.on('login', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      netlifyIdentity.close();
      await pullFromServer();
      loadLocal();
      renderCategories();
      await pushToServer();
    });

    netlifyIdentity.on('logout', () => {
      currentUser = null;
      renderAuthLoggedOut();
      renderSyncNote();
    });

    netlifyIdentity.on('signup', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      await pushToServer();
    });

    netlifyIdentity.init();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initApp();
    if (typeof netlifyIdentity !== 'undefined') {
      initIdentity();
    } else {
      window.addEventListener('load', initIdentity);
    }
  });
})();
</script>
</body>
</html>
