<style>
  /* Page-specific: to-do */

  /* Add category */
  .add-cat-btn {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--card);
    color: var(--primary);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 14px;
    cursor: pointer;
    margin-bottom: 16px;
    box-shadow: var(--shadow-card);
  }
  .inline-form {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .inline-input {
    width: 100%; font-family: var(--font-body); font-weight: 600; font-size: 14px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px;
  }
  .inline-row { display: flex; gap: 8px; align-items: center; }
  .inline-btn {
    font-family: var(--font-body); font-weight: 800; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
    border: none; border-radius: var(--r-pill); padding: 10px 14px; cursor: pointer;
  }
  .inline-btn.confirm { background: var(--green); color: #FFFFFF; flex: 1; }
  .inline-btn.cancel { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); }
  .color-swatch-input {
    -webkit-appearance: none; appearance: none; width: 38px; height: 38px; border: none; border-radius: var(--r-sm);
    padding: 0; cursor: pointer; background: transparent;
  }
  .color-swatch-input::-webkit-color-swatch-wrapper { padding: 0; }
  .color-swatch-input::-webkit-color-swatch { border: 1px solid var(--line); border-radius: var(--r-sm); }

  /* Colour groups --------------------------------------------------------
     Six fixed colours, and the colour IS the group. Each is a collapsible
     section, so a long list folds down to a handful of headers. */
  .group-section { margin-bottom: 16px; }
  .group-header {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 8px 10px; margin-bottom: 8px;
    background: transparent; border: none; border-left: 4px solid var(--group-color);
    border-radius: var(--r-sm); cursor: pointer; text-align: left;
    font-family: var(--font-body);
    transition: transform var(--t-fast) var(--ease);
  }
  .group-header:active { transform: scale(0.99); }
  .group-name {
    font-weight: 800; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--group-color); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .group-count {
    font-weight: 800; font-size: 10.5px; color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: var(--r-pill); padding: 2px 7px; flex-shrink: 0;
  }
  .group-chevron {
    flex-shrink: 0; color: var(--ink-dim); font-size: 11px;
    transition: transform var(--t-fast) var(--ease);
  }
  .group-section.collapsed .group-chevron { transform: rotate(-90deg); }
  .group-section.collapsed .group-body { display: none; }
  .group-rename-btn {
    flex-shrink: 0; background: transparent; border: none; cursor: pointer;
    color: var(--ink-dim); font-size: 12px; padding: 2px 5px;
  }
  .group-rename-row { display: flex; gap: 6px; margin-bottom: 10px; }

  /* Fixed palette, replacing the free colour input that let every category be

  .palette-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .palette-dot {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: none; background: var(--dot-color);
    padding: 0; flex-shrink: 0;
    transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
  }
  .palette-dot.selected { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--dot-color); }
  .palette-dot:active { transform: scale(0.9); }
  .group-swatch {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    border: none; padding: 0; cursor: pointer; background: var(--group-color);
  }
  .group-editor { padding: 4px 2px 10px; }

  /* Sort bar */
  .sort-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
  .sort-btn {
    flex-shrink: 0; font-family: var(--font-body); font-weight: 700; font-size: 11.5px;
    padding: 6px 11px; border-radius: var(--r-pill); cursor: pointer;
    background: transparent; color: var(--ink-dim); border: 1px solid var(--line);
    transition: transform var(--t-fast) var(--ease);
  }
  .sort-btn:active { transform: scale(0.96); }
  .sort-btn.selected { background: var(--primary); color: #FFFFFF; border-color: var(--primary); }

  /* Category card */
  .cat-card {
    border-radius: var(--r-lg); margin-bottom: 14px; overflow: hidden;
    border: 1px solid var(--line); box-shadow: var(--shadow-card);
  }
  .cat-header {
    display: flex; align-items: center; gap: 10px; padding: 14px 14px; background: var(--card); cursor: pointer;
  }
  .cat-name { font-family: var(--font-body); font-weight: 800; font-size: 15.5px; flex: 1; }
  .cat-name.complete { text-decoration: line-through; color: var(--ink-dim); }
  .cat-check { font-size: 13px; color: var(--green); }
  .task-counter {
    font-family: var(--font-body); font-weight: 800; font-size: 10.5px; color: var(--ink-dim);
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 3px 9px; flex-shrink: 0;
  }
  .task-counter.complete { color: var(--green); border-color: var(--green); }
  .cat-actions { display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    background: transparent; border: none; color: var(--ink-dim); cursor: pointer; font-size: 15px; padding: 4px 6px;
  }
  .cat-body { padding: 6px 14px 14px; background: var(--bg); }

  /* Subcategory */

  .subcat-header { display: flex; align-items: center; gap: 8px; padding: 8px 4px; cursor: pointer; }
  .subcat-chevron {

  .subcat-chevron.open { transform: rotate(90deg); }
  .subcat-name { font-weight: 700; font-size: 14px; flex: 1; color: var(--ink); }
  .subcat-name.complete { text-decoration: line-through; color: var(--ink-dim); }
  .subcat-check { font-size: 12px; color: var(--green); }

  /* Task row */
  .task-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 4px 8px 14px; border-bottom: 1px solid var(--line);
  }
  .task-row:last-child { border-bottom: none; }
  .task-box {
    width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--ink-dim); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
  }
  .task-box.checked { background: var(--green); border-color: var(--green); }
  .task-box svg { opacity: 0; transform: scale(0.6); transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
  .task-box.checked svg { opacity: 1; transform: scale(1); }
  .task-text { flex: 1; font-weight: 600; font-size: 14px; cursor: pointer; }
  .task-text.checked { color: var(--ink-dim); text-decoration: line-through; }
  .task-badge {
    font-family: var(--font-body); font-weight: 800; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-dim); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 2px 7px; flex-shrink: 0;
  }
  .task-badge.overdue { color: var(--danger); border-color: var(--danger); }

  .cat-due-btn {
    font-family: var(--font-body); font-weight: 700; font-size: 10px; color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: var(--r-pill); padding: 5px 10px; cursor: pointer;
    background: transparent; white-space: nowrap;
  }
  .cat-due-btn.overdue { color: var(--danger); border-color: var(--danger); }
  .task-due-btn {
    font-family: var(--font-body); font-weight: 800; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-dim); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 3px 8px;
    cursor: pointer; background: transparent; flex-shrink: 0; white-space: nowrap;
  }
  .task-due-btn.overdue { color: var(--danger); border-color: var(--danger); }
  .due-date-editor {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px;
    margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px;
  }

  .add-row-btn {
    background: transparent; border: none; color: var(--primary); font-family: var(--font-body); font-weight: 700;
    font-size: 12px; cursor: pointer; padding: 8px 4px;
  }

  .empty-note {
    font-weight: 600; font-size: 12.5px; color: var(--ink-dim); text-align: center; padding: 20px 0;
  }

  .archive-toggle-row { text-align: center; margin-top: 20px; }
  .archive-toggle-btn {
    font-family: var(--font-body); font-weight: 800; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--card); color: var(--primary); border: 1px solid var(--line); border-radius: var(--r-pill);
    padding: 10px 20px; cursor: pointer; box-shadow: var(--shadow-card);
  }
  .archive-panel { display: none; margin-top: 16px; }
  .archive-panel.open { display: block; }
  .archive-date-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); margin-bottom: 10px; overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .archive-date-header {

  }

  .archive-item {

  .sync-note { margin-top: 16px; }

<script>
(function() {
  const STATE_KEY = 'scrollswap_todo_state';
  const FUNCTION_URL = '/.netlify/functions/todos';

  let currentUser = null;
  let syncing = false;
  let syncFailed = false;
  let state = { categories: [], completions: {} };

  /* True until we know whether a server sync is going to deliver tasks. With
     no local data we cannot yet tell "you have no tasks" from "your tasks are
     still on their way", so the empty state would be a lie for a moment.
     Cleared by every path that has the final answer. */
  let firstSyncPending = true;
  let addingCategory = false;
  let addingSubcatFor = null; // category id
  let addingTaskFor = null;   // { categoryId, subcatId }
  let editingDueDateFor = null; // category id
  let editingGroupFor = null;   // category id whose colour-group palette is open
  let renamingGroup = null;     // group id being renamed
  let editingTaskDueFor = null; // { catId, subcatId, taskId }
  let expandedSubcats = new Set(); // subcategory ids currently expanded

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // Names are user-entered and were being interpolated into markup raw.
  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---- Colour groups ----------------------------------------------------
     The colour IS the group: a category carries a group id, not a hex string,
     so its swatch follows the light/dark palette instead of freezing whatever
     shade was picked. Six is deliberate — the old free colour input let every
     category be its own colour, which is what made the list unreadable. */
  const GROUPS = [
    { id: 'purple', label: 'Purple', ref: '#9B6CF0' },
    { id: 'sky',    label: 'Sky',    ref: '#4FA3F7' },
    { id: 'green',  label: 'Green',  ref: '#3EBE7E' },
    { id: 'orange', label: 'Orange', ref: '#F59E42' },
    { id: 'pink',   label: 'Pink',   ref: '#F272B0' },
    { id: 'red',    label: 'Red',    ref: '#F26D6D' },
  ];
  const DEFAULT_GROUP = 'purple';

  function groupColorVar(groupId) { return 'var(--acc-' + groupId + ')'; }

  function catGroup(cat) {
    return GROUPS.some(function (g) { return g.id === (cat && cat.group); }) ? cat.group : DEFAULT_GROUP;
  }

  function groupLabel(groupId) {
    const custom = state.groupNames && state.groupNames[groupId];
    if (custom && String(custom).trim()) return String(custom).trim();
    const g = GROUPS.find(function (x) { return x.id === groupId; });
    return g ? g.label : groupId;
  }

  /* Categories saved before groups existed hold an arbitrary hex. Snap each to
     the nearest palette colour once, by plain RGB distance — approximate is
     fine, the point is only that similar shades land in the same group. */
  function nearestGroup(hex) {
    if (typeof hex !== 'string') return DEFAULT_GROUP;
    const m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
    if (!m) return DEFAULT_GROUP;
    const v = parseInt(m[1], 16);
    const r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
    let best = DEFAULT_GROUP, bestDist = Infinity;
    GROUPS.forEach(function (grp) {
      const rv = parseInt(grp.ref.slice(1), 16);
      const dr = ((rv >> 16) & 255) - r, dg = ((rv >> 8) & 255) - g, db = (rv & 255) - b;
      const dist = dr * dr + dg * dg + db * db;
      if (dist < bestDist) { bestDist = dist; best = grp.id; }
    });
    return best;
  }

  /* uid() is Date.now().toString(36) plus five random characters, so a category
     saved before createdAt existed still knows roughly when it was made. New
     ones carry createdAt outright; this is only the fallback for the old ones. */
  function categoryCreatedAt(cat) {
    if (typeof cat.createdAt === 'number') return cat.createdAt;
    const parsed = parseInt(String(cat.id || '').slice(0, -5), 36);
    return isNaN(parsed) ? 0 : parsed;
  }

  const SORT_KEY = 'scrollswap_todo_sort';
  const COLLAPSED_KEY = 'scrollswap_todo_collapsed_groups';
  const SORTS = [
    { id: 'due', label: 'Due date' },
    { id: 'unfinished', label: 'Unfinished first' },
    { id: 'name', label: 'A-Z' },
    { id: 'newest', label: 'Newest' },
  ];

  let currentSort = 'due';
  let collapsedGroups = [];

  function loadSort() {
    try {
      const v = localStorage.getItem(SORT_KEY);
      return SORTS.some(function (x) { return x.id === v; }) ? v : 'due';
    } catch (e) { return 'due'; }
  }
  function saveSort(v) { try { localStorage.setItem(SORT_KEY, v); } catch (e) {} }

  function loadCollapsed() {
    try {
      const raw = JSON.parse(localStorage.getItem(COLLAPSED_KEY) || '[]');
      return Array.isArray(raw) ? raw : [];
    } catch (e) { return []; }
  }
  function saveCollapsed(list) {
    try { localStorage.setItem(COLLAPSED_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function sortCategories(cats) {
    const list = [...cats];
    if (currentSort === 'name') {
      list.sort(function (a, b) { return String(a.name || '').localeCompare(String(b.name || '')); });
    } else if (currentSort === 'newest') {
      list.sort(function (a, b) { return categoryCreatedAt(b) - categoryCreatedAt(a); });
    } else if (currentSort === 'unfinished') {
      list.sort(function (a, b) { return (isCatComplete(a) ? 1 : 0) - (isCatComplete(b) ? 1 : 0); });
    } else {
      // Overdue and soonest first; undated last rather than pretending to be urgent.
      list.sort(function (a, b) {
        const ad = a.dueDate || '9999-99-99';
        const bd = b.dueDate || '9999-99-99';
        return ad < bd ? -1 : ad > bd ? 1 : 0;
      });
    }
    return list;
  }

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // ---- Storage ----

  function loadLocal() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      state = raw ? JSON.parse(raw) : { categories: [], completions: {} };
      if (!state.categories) state.categories = [];
      if (!state.completions) state.completions = {};
    } catch (e) { state = { categories: [], completions: {} }; }
    migrateColorsToGroups();
  }

  /* Runs on every load, but only writes when something actually changed, so a
     migrated device does not re-save (and re-sync) an identical blob forever. */
  function migrateColorsToGroups() {
    if (!state || !Array.isArray(state.categories)) return;
    if (!state.groupNames || typeof state.groupNames !== 'object') state.groupNames = {};
    let changed = false;
    state.categories.forEach(function (cat) {
      if (!cat) return;
      const valid = GROUPS.some(function (g) { return g.id === cat.group; });
      if (!valid) { cat.group = nearestGroup(cat.color); changed = true; }
    });
    if (changed) { try { saveLocal(); } catch (e) {} }
  }

  function saveLocal() {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
    catch (e) { console.error('Save failed', e); }
  }

  function hasLocalData() {
    return !!(state && ((state.categories && state.categories.length) ||
      (state.completions && Object.keys(state.completions).length)));
  }

  /* Returns true only if the download actually completed. Callers MUST check
     this before uploading: pushing after a failed download would overwrite the
     server copy with whatever this device happens to hold, which may be nothing
     (e.g. a brand new browser, or a fresh domain — localStorage is per-domain). */
  /* ---- Merge -------------------------------------------------------------
     This page used to do "state = serverState; saveLocal()" on every pull — a
     wholesale replace, so whichever device wrote last won and the other one's
     work vanished with no error at all. It bit on any divergence: aeroplane
     mode, a dead signal, or simply phone-then-laptop.

     The merge is by item id (uid() has always produced stable ones), with an
     updatedAt stamp deciding conflicts and tombstones so a delete is not
     resurrected by the other device's still-present copy.

     Habits, Pomodoro and Diary need none of this: they store one key per day,
     so a pull only ever adds days and they heal on their own. */
  const TOMBSTONE_TTL_MS = 90 * 24 * 60 * 60 * 1000;

  function stamp(obj) {
    if (obj && typeof obj === 'object') obj.updatedAt = Date.now();
    return obj;
  }

  // Absent on anything saved before this shipped, so an unstamped item always
  // loses to a stamped edit rather than winning by accident.
  function stampOf(obj) {
    return obj && typeof obj.updatedAt === 'number' ? obj.updatedAt : 0;
  }

  function tombstonesOf(st) {
    return (st && st.deletedIds && typeof st.deletedIds === 'object') ? st.deletedIds : {};
  }

  // Without pruning this grows forever; 90 days is far longer than any device
  // realistically stays offline, and every copy has synced by then.
  function pruneTombstones(map) {
    const cutoff = Date.now() - TOMBSTONE_TTL_MS;
    Object.keys(map).forEach(function (id) {
      if (typeof map[id] !== 'number' || map[id] < cutoff) delete map[id];
    });
    return map;
  }

  function markDeleted(id) {
    if (!state.deletedIds || typeof state.deletedIds !== 'object') state.deletedIds = {};
    state.deletedIds[id] = Date.now();
  }

  /* Union by id at each level. A tombstone beats a copy that still exists,
     unless that copy was edited after the delete was recorded — so re-adding
     something on one device still survives a stale delete from the other. */
  function mergeLists(mine, theirs, deaths, childKey) {
    const byId = {};
    const order = [];
    function take(item) {
      if (!item || !item.id) return;
      const dead = deaths[item.id];
      if (typeof dead === 'number' && stampOf(item) <= dead) return;
      const existing = byId[item.id];
      if (!existing) {
        byId[item.id] = Object.assign({}, item);
        order.push(item.id);
        return;
      }
      const winner = stampOf(item) > stampOf(existing) ? item : existing;
      const loser = winner === item ? existing : item;
      const merged = Object.assign({}, winner);
      // Children merge on their own regardless of which parent won, or editing a
      // category name on one device would drop the other's new tasks with it.
      if (childKey) {
        merged[childKey] = mergeLists(
          Array.isArray(winner[childKey]) ? winner[childKey] : [],
          Array.isArray(loser[childKey]) ? loser[childKey] : [],
          deaths,
          childKey === 'subcategories' ? 'tasks' : null
        );
      }
      byId[item.id] = merged;
    }
    (Array.isArray(mine) ? mine : []).forEach(take);
    (Array.isArray(theirs) ? theirs : []).forEach(take);
    return order.map(function (id) { return byId[id]; });
  }

  function mergeStates(mine, theirs) {
    mine = mine || {}; theirs = theirs || {};
    const deaths = pruneTombstones(
      Object.assign({}, tombstonesOf(theirs), tombstonesOf(mine))
    );
    return {
      categories: mergeLists(mine.categories, theirs.categories, deaths, 'subcategories'),
      // Completions are per-day records, like the pages that never had this bug,
      // so a union is right; this device wins a same-day tie because it is the
      // one being looked at.
      completions: Object.assign({}, theirs.completions || {}, mine.completions || {}),
      groupNames: Object.assign({}, theirs.groupNames || {}, mine.groupNames || {}),
      deletedIds: deaths,
    };
  }

  async function pullFromServer() {
    if (!currentUser) return false;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(FUNCTION_URL, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) { syncFailed = true; return false; }
      const serverState = await res.json();
      if (serverState && (serverState.categories || serverState.completions)) {
        state = mergeStates(state, serverState);
        saveLocal();
      }
      syncFailed = false;
      return true;
    } catch (e) {
      console.error('Pull failed', e);
      syncFailed = true;
      return false;
    }
  }

  async function pushToServer() {
    if (!currentUser) return;
    syncing = true;
    renderSyncNote();
    try {
      const token = await currentUser.jwt();
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(state),
      });
      syncFailed = !res.ok;
    } catch (e) {
      console.error('Push failed', e);
      syncFailed = true;
    } finally {
      syncing = false;
      renderSyncNote();
    }
  }

  function renderSyncNote() {
    const el = document.getElementById('syncNote');
    if (!el) return;
    if (!currentUser) el.textContent = 'Not synced — log in to save across devices';
    else if (syncing) el.textContent = 'Syncing…';
    else if (syncFailed) el.textContent = '⚠ Sync failed — this device’s data is safe, but not saved to your account';
    else el.textContent = 'Synced to your account';
  }

  async function persist() {
    saveLocal();
    if (currentUser) await pushToServer();
  }

  // ---- Completion logic ----

  function isTaskDone(task) {
    if (task.recurring) {
      const todayCompletions = state.completions[todayKey()] || {};
      return !!todayCompletions[task.id];
    }
    return !!task.done;
  }

  async function toggleTask(task) {
    if (task.recurring) {
      const key = todayKey();
      if (!state.completions[key]) state.completions[key] = {};
      state.completions[key][task.id] = !state.completions[key][task.id];
    } else {
      stamp(task);
      task.done = !task.done;
      if (task.done) {
        task.completedDate = todayKey();
      } else {
        delete task.completedDate;
      }
    }
    // Update the UI immediately; the save/sync runs in the background so a
    // tap never waits on the network round-trip.
    renderCategories();
    persist();
  }

  function isSubcatComplete(subcat) {
    return subcat.tasks.length > 0 && subcat.tasks.every(isTaskDone);
  }

  function isCatComplete(cat) {
    return cat.subcategories.length > 0 && cat.subcategories.every(isSubcatComplete);
  }

  function countSubcatTasks(subcat) {
    const total = subcat.tasks.length;
    const done = subcat.tasks.filter(isTaskDone).length;
    return { done, total };
  }

  function countCatTasks(cat) {
    let done = 0, total = 0;
    cat.subcategories.forEach(sc => {
      const counts = countSubcatTasks(sc);
      done += counts.done;
      total += counts.total;
    });
    return { done, total };
  }

  // ---- Mutations ----

  let newCatGroup = DEFAULT_GROUP;

  async function addCategory(name, group, dueDate) {
    state.categories.push(stamp({
      id: uid(), name, group: group || DEFAULT_GROUP, dueDate: dueDate || null,
      createdAt: Date.now(), subcategories: [],
    }));
    await persist();
  }

  /* Deletes now happen straight away and offer themselves back for a few
     seconds, rather than gating on a blocking confirm() you learn to dismiss
     without reading. The delete is persisted immediately and undo persists the
     restore, so storage and memory never disagree even if you navigate away
     while the snackbar is still up. */
  async function deleteCategory(catId) {
    const idx = state.categories.findIndex(c => c.id === catId);
    if (idx === -1) return;
    const removed = state.categories[idx];
    markDeleted(catId);
    state.categories.splice(idx, 1);
    await persist();
    renderCategories();
    if (window.rotulus && window.rotulus.snackbar) {
      window.rotulus.snackbar('Deleted "' + removed.name + '"', async () => {
        if (state.deletedIds) delete state.deletedIds[catId];
        state.categories.splice(idx, 0, removed);
        await persist();
        renderCategories();
      });
    }
  }

  async function updateCategoryGroup(catId, group) {
    const cat = state.categories.find(c => c.id === catId);
    if (cat && GROUPS.some(g => g.id === group)) stamp(cat).group = group;
    await persist();
  }

  async function updateCategoryDueDate(catId, dueDate) {
    const cat = state.categories.find(c => c.id === catId);
    if (cat) stamp(cat).dueDate = dueDate || null;
    await persist();
  }

  async function addSubcategory(catId, name) {
    const cat = state.categories.find(c => c.id === catId);
    const newSubcat = { id: uid(), name, tasks: [] };
    if (cat) cat.subcategories.push(newSubcat);
    await persist();
    return newSubcat.id;
  }

  async function deleteSubcategory(catId, subcatId) {
    const cat = state.categories.find(c => c.id === catId);
    if (!cat) return;
    const idx = cat.subcategories.findIndex(s => s.id === subcatId);
    if (idx === -1) return;
    const removed = cat.subcategories[idx];
    markDeleted(subcatId);
    cat.subcategories.splice(idx, 1);
    await persist();
    renderCategories();
    if (window.rotulus && window.rotulus.snackbar) {
      window.rotulus.snackbar('Deleted "' + removed.name + '"', async () => {
        if (state.deletedIds) delete state.deletedIds[subcatId];
        cat.subcategories.splice(idx, 0, removed);
        await persist();
        renderCategories();
      });
    }
  }

  async function addTask(catId, subcatId, text, recurring, scheduledDate) {
    const cat = state.categories.find(c => c.id === catId);
    const subcat = cat && cat.subcategories.find(s => s.id === subcatId);
    const task = stamp({ id: uid(), text, recurring, done: false });
    if (!recurring && scheduledDate) task.scheduledDate = scheduledDate;
    if (subcat) subcat.tasks.push(task);
    await persist();
  }

  async function deleteTask(catId, subcatId, taskId) {
    markDeleted(taskId);
    const cat = state.categories.find(c => c.id === catId);
    const subcat = cat && cat.subcategories.find(s => s.id === subcatId);
    if (subcat) subcat.tasks = subcat.tasks.filter(t => t.id !== taskId);
    await persist();
    renderCategories();
  }

  async function updateTaskScheduledDate(catId, subcatId, taskId, dateStr) {
    const cat = state.categories.find(c => c.id === catId);
    const subcat = cat && cat.subcategories.find(s => s.id === subcatId);
    const task = subcat && subcat.tasks.find(t => t.id === taskId);
    if (task) {
      stamp(task);
      if (dateStr) task.scheduledDate = dateStr;
      else delete task.scheduledDate;
    }
    await persist();
  }

  function checkmarkSVG() {
    return '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function formatShortDate(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-').map(Number);
    const dateObj = new Date(y, m - 1, d);
    return dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function isOverdue(dateStr, done) {
    if (!dateStr || done) return false;
    return dateStr < todayKey();
  }

  function sortedTasks(subcat) {
    return [...subcat.tasks].sort((a, b) => {
      if (a.recurring && !b.recurring) return -1;
      if (!a.recurring && b.recurring) return 1;
      if (a.recurring && b.recurring) return 0;
      const aDate = a.scheduledDate || '9999-99-99';
      const bDate = b.scheduledDate || '9999-99-99';
      return aDate < bDate ? -1 : aDate > bDate ? 1 : 0;
    });
  }

  // ---- Rendering ----

  function renderAddCategoryArea() {
    const area = document.getElementById('addCatArea');
    if (!addingCategory) {
      area.innerHTML = `<button class="add-cat-btn" id="showAddCatBtn">+ Add category</button>`;
      document.getElementById('showAddCatBtn').addEventListener('click', () => {
        addingCategory = true;
        renderAddCategoryArea();
      });
      return;
    }
    area.innerHTML = `
      <div class="inline-form">
        <input type="text" class="inline-input" id="newCatName" placeholder="Category name (e.g. School)" maxlength="80">
        <div class="palette-row" id="newCatPalette">
          ${GROUPS.map(g => '<button class="palette-dot' + (g.id === newCatGroup ? ' selected' : '') +
            '" data-group="' + g.id + '" style="--dot-color: ' + groupColorVar(g.id) + '" aria-label="' + escapeHtml(groupLabel(g.id)) + '"></button>').join('')}
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:12px; color:var(--ink-dim);">
          Due date (optional)
          <input type="date" class="inline-input" id="newCatDueDate" style="width:auto; padding:6px 8px;">
        </label>
        <div class="inline-row">
          <button class="inline-btn cancel" id="cancelCatBtn">Cancel</button>
          <button class="inline-btn confirm" id="confirmCatBtn">Add</button>
        </div>
      </div>
    `;
    document.getElementById('cancelCatBtn').addEventListener('click', () => {
      addingCategory = false;
      renderAddCategoryArea();
    });
    area.querySelectorAll('.palette-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        newCatGroup = dot.dataset.group;
        area.querySelectorAll('.palette-dot').forEach(d => {
          d.classList.toggle('selected', d.dataset.group === newCatGroup);
        });
      });
    });
    document.getElementById('confirmCatBtn').addEventListener('click', async () => {
      const name = document.getElementById('newCatName').value.trim();
      const dueDate = document.getElementById('newCatDueDate').value;
      if (!name) return;
      await addCategory(name, newCatGroup, dueDate);
      addingCategory = false;
      renderAddCategoryArea();
      renderCategories();
    });
  }

  /* Stands in for category cards on a first-ever load, so a synced device that
     has nothing local yet shows something shaped like the content instead of a
     bare "no categories" message it may be about to contradict. Shared styles
     live in css/rotulus.css under "Loading placeholders". */
  const SKELETON_MARKUP =
    '<div class="skeleton-list" aria-hidden="true">' +
    '<div class="skeleton-card"></div>' +
    '<div class="skeleton-card"></div>' +
    '<div class="skeleton-card"></div>' +
    '</div>' +
    '<p class="skeleton-label" role="status">Getting your tasks&hellip;</p>';

  function renderCategories() {
    const list = document.getElementById('categoriesList');

    if (state.categories.length === 0) {
      list.innerHTML = firstSyncPending ? SKELETON_MARKUP
        : '<p class="empty-note">No categories yet. Add one to get started.</p>';
      return;
    }

    // Only groups that actually hold something are drawn, so six headings never
    // appear before they have been used.
    list.innerHTML = GROUPS.map(g => {
      const cats = sortCategories(state.categories.filter(c => catGroup(c) === g.id));
      if (!cats.length) return '';
      const collapsed = collapsedGroups.indexOf(g.id) !== -1;
      return `
        <div class="group-section ${collapsed ? 'collapsed' : ''}" data-group="${g.id}" style="--group-color: ${groupColorVar(g.id)}">
          <div class="group-header" data-group="${g.id}" role="button" tabindex="0" aria-expanded="${collapsed ? 'false' : 'true'}">
            <span class="group-chevron">&#9660;</span>
            <span class="group-name">${escapeHtml(groupLabel(g.id))}</span>
            <span class="group-count">${cats.length}</span>
            <button class="group-rename-btn" data-rename-group="${g.id}" aria-label="Rename this group">&#9998;</button>
          </div>
          <div class="group-body">
            ${renamingGroup === g.id ? renderGroupRename(g.id) : ''}
            ${cats.map(cat => renderCategoryCard(cat)).join('')}
          </div>
        </div>`;
    }).join('');

    attachCategoryListeners();
    attachGroupListeners();
  }

  function renderGroupRename(groupId) {
    return `
      <div class="group-rename-row">
        <input type="text" class="inline-input group-rename-input" maxlength="40" value="${escapeHtml(groupLabel(groupId))}" style="flex:1;">
        <button class="inline-btn cancel group-rename-cancel">Cancel</button>
        <button class="inline-btn confirm group-rename-save" data-group="${groupId}">Save</button>
      </div>`;
  }

  function attachGroupListeners() {
    document.querySelectorAll('.group-header').forEach(header => {
      header.addEventListener('click', e => {
        const rename = e.target.closest('[data-rename-group]');
        if (rename) {
          renamingGroup = rename.dataset.renameGroup;
          renderCategories();
          return;
        }
        const id = header.dataset.group;
        const at = collapsedGroups.indexOf(id);
        if (at === -1) collapsedGroups.push(id); else collapsedGroups.splice(at, 1);
        saveCollapsed(collapsedGroups);
        renderCategories();
      });
    });

    const cancel = document.querySelector('.group-rename-cancel');
    if (cancel) cancel.addEventListener('click', () => { renamingGroup = null; renderCategories(); });

    const save = document.querySelector('.group-rename-save');
    if (save) {
      save.addEventListener('click', async () => {
        const input = document.querySelector('.group-rename-input');
        const value = input ? input.value.trim() : '';
        if (!state.groupNames) state.groupNames = {};
        const preset = GROUPS.find(g => g.id === save.dataset.group);
        // Clearing it, or typing the preset name back, drops the override entirely.
        if (!value || (preset && value === preset.label)) delete state.groupNames[save.dataset.group];
        else state.groupNames[save.dataset.group] = value;
        renamingGroup = null;
        await persist();
        renderCategories();
      });
    }

    // Moving a category between groups — the swatch on its header opens a palette.
    document.querySelectorAll('.group-swatch').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        editingGroupFor = editingGroupFor === btn.dataset.catId ? null : btn.dataset.catId;
        renderCategories();
      });
    });
    document.querySelectorAll('.group-editor .palette-dot').forEach(dot => {
      dot.addEventListener('click', async e => {
        e.stopPropagation();
        editingGroupFor = null;
        await updateCategoryGroup(dot.dataset.catId, dot.dataset.group);
        renderCategories();
      });
    });
  }

  function renderGroupEditor(cat) {
    return `
      <div class="group-editor palette-row">
        ${GROUPS.map(g => '<button class="palette-dot' + (g.id === catGroup(cat) ? ' selected' : '') +
          '" data-cat-id="' + escapeHtml(cat.id) + '" data-group="' + g.id + '" style="--dot-color: ' + groupColorVar(g.id) +
          '" aria-label="Move to ' + escapeHtml(groupLabel(g.id)) + '"></button>').join('')}
      </div>`;
  }

  function renderSortRow() {
    const row = document.getElementById('sortRow');
    if (!row) return;
    row.innerHTML = SORTS.map(x =>
      '<button class="sort-btn' + (x.id === currentSort ? ' selected' : '') + '" data-sort="' + x.id + '">' + x.label + '</button>'
    ).join('');
    row.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentSort = btn.dataset.sort;
        saveSort(currentSort);
        renderSortRow();
        renderCategories();
      });
    });
  }

  function renderCategoryCard(cat) {
    const complete = isCatComplete(cat);
    const counts = countCatTasks(cat);
    const dueOverdue = cat.dueDate && !complete && cat.dueDate < todayKey();
    return `
      <div class="cat-card" data-cat-id="${escapeHtml(cat.id)}">
        <div class="cat-header" style="border-left: 4px solid ${groupColorVar(catGroup(cat))};">
          <button class="group-swatch" data-cat-id="${escapeHtml(cat.id)}" style="--group-color: ${groupColorVar(catGroup(cat))}" aria-label="Change colour group"></button>
          <span class="cat-name ${complete ? 'complete' : ''}">${escapeHtml(cat.name)}</span>
          ${counts.total > 0 ? `<span class="task-counter ${counts.done === counts.total ? 'complete' : ''}">${counts.done}/${counts.total}</span>` : ''}
          ${complete ? '<span class="cat-check">&#10003;</span>' : ''}
          <div class="cat-actions">
            <button class="cat-due-btn ${dueOverdue ? 'overdue' : ''}" data-cat-id="${escapeHtml(cat.id)}">
              ${cat.dueDate ? `Due ${formatShortDate(cat.dueDate)}` : 'Set due date'}
            </button>
            <button class="icon-btn delete-cat-btn" data-cat-id="${escapeHtml(cat.id)}">&times;</button>
          </div>
        </div>
        <div class="cat-body">
          ${editingGroupFor === cat.id ? renderGroupEditor(cat) : ''}
          ${editingDueDateFor === cat.id ? renderDueDateEditor(cat) : ''}
          ${cat.subcategories.map(sc => renderSubcatBlock(cat, sc)).join('')}
          ${addingSubcatFor === cat.id ? renderAddSubcatForm(cat.id) : `<button class="add-row-btn add-subcat-trigger" data-cat-id="${escapeHtml(cat.id)}">+ Add subcategory</button>`}
        </div>
      </div>
    `;
  }

  function renderDueDateEditor(cat) {
    return `
      <div class="due-date-editor">
        <input type="date" class="inline-input due-date-input" data-cat-id="${escapeHtml(cat.id)}" value="${escapeHtml(cat.dueDate || '')}">
        <div class="inline-row">
          <button class="inline-btn cancel clear-due-btn" data-cat-id="${escapeHtml(cat.id)}">Clear</button>
          <button class="inline-btn cancel cancel-due-btn" data-cat-id="${escapeHtml(cat.id)}">Cancel</button>
          <button class="inline-btn confirm save-due-btn" data-cat-id="${escapeHtml(cat.id)}">Save</button>
        </div>
      </div>
    `;
  }

  function renderSubcatBlock(cat, subcat) {
    const complete = isSubcatComplete(subcat);
    const counts = countSubcatTasks(subcat);
    const expanded = expandedSubcats.has(subcat.id);
    return `
      <div class="subcat-block">
        <div class="subcat-header" data-cat-id="${escapeHtml(cat.id)}" data-subcat-id="${escapeHtml(subcat.id)}">
          <span class="subcat-chevron ${expanded ? 'open' : ''}">&#9656;</span>
          <span class="subcat-name ${complete ? 'complete' : ''}">${escapeHtml(subcat.name)}</span>
          ${counts.total > 0 ? `<span class="task-counter ${counts.done === counts.total ? 'complete' : ''}">${counts.done}/${counts.total}</span>` : ''}
          ${complete ? '<span class="subcat-check">&#10003;</span>' : ''}
          <button class="icon-btn delete-subcat-btn" data-cat-id="${escapeHtml(cat.id)}" data-subcat-id="${escapeHtml(subcat.id)}">&times;</button>
        </div>
        ${expanded ? `
          <div class="task-list">
            ${sortedTasks(subcat).map(t => renderTaskRow(cat.id, subcat.id, t)).join('')}
          </div>
          ${addingTaskFor && addingTaskFor.categoryId === cat.id && addingTaskFor.subcatId === subcat.id
            ? renderAddTaskForm(cat.id, subcat.id)
            : `<button class="add-row-btn add-task-trigger" data-cat-id="${escapeHtml(cat.id)}" data-subcat-id="${escapeHtml(subcat.id)}">+ Add task</button>`}
        ` : ''}
      </div>
    `;
  }

  function renderTaskDueDateEditor(catId, subcatId, task) {
    return `
      <div class="due-date-editor" style="margin: 4px 0 8px 34px;">
        <input type="date" class="inline-input task-due-date-input" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}" data-task-id="${escapeHtml(task.id)}" value="${escapeHtml(task.scheduledDate || '')}">
        <div class="inline-row">
          <button class="inline-btn cancel clear-task-due-btn" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}" data-task-id="${escapeHtml(task.id)}">Clear</button>
          <button class="inline-btn cancel cancel-task-due-btn" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}" data-task-id="${escapeHtml(task.id)}">Cancel</button>
          <button class="inline-btn confirm save-task-due-btn" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}" data-task-id="${escapeHtml(task.id)}">Save</button>
        </div>
      </div>
    `;
  }

  function renderTaskRow(catId, subcatId, task) {
    const done = isTaskDone(task);
    const overdue = isOverdue(task.scheduledDate, done);
    const isEditingThis = editingTaskDueFor && editingTaskDueFor.catId === catId
      && editingTaskDueFor.subcatId === subcatId && editingTaskDueFor.taskId === task.id;
    return `
      <div class="task-row">
        <div class="task-box ${done ? 'checked' : ''}" data-task-id="${escapeHtml(task.id)}" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}">
          ${checkmarkSVG()}
        </div>
        <span class="task-text ${done ? 'checked' : ''}" data-task-id="${escapeHtml(task.id)}" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}">${escapeHtml(task.text)}</span>
        ${task.recurring ? '<span class="task-badge">Recurring</span>' : `
          <button class="task-due-btn ${overdue ? 'overdue' : ''}" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}" data-task-id="${escapeHtml(task.id)}">
            ${task.scheduledDate ? `${overdue ? 'Overdue ' : ''}${formatShortDate(task.scheduledDate)}` : 'Set due date'}
          </button>
        `}
        <button class="icon-btn delete-task-btn" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}" data-task-id="${escapeHtml(task.id)}">&times;</button>
      </div>
      ${isEditingThis ? renderTaskDueDateEditor(catId, subcatId, task) : ''}
    `;
  }

  function renderAddSubcatForm(catId) {
    return `
      <div class="inline-form" style="margin-top:8px;">
        <input type="text" maxlength="80" class="inline-input new-subcat-name" data-cat-id="${escapeHtml(catId)}" placeholder="Subcategory name (e.g. Math)">
        <div class="inline-row">
          <button class="inline-btn cancel cancel-subcat-btn" data-cat-id="${escapeHtml(catId)}">Cancel</button>
          <button class="inline-btn confirm confirm-subcat-btn" data-cat-id="${escapeHtml(catId)}">Add</button>
        </div>
      </div>
    `;
  }

  function renderAddTaskForm(catId, subcatId) {
    return `
      <div class="inline-form" style="margin-top:6px; margin-bottom:8px;">
        <input type="text" maxlength="200" class="inline-input new-task-text" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}" placeholder="Task (e.g. Complete page 54)">
        <label style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:12px; color:var(--ink-dim);">
          <input type="checkbox" class="new-task-recurring" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}">
          Recurring (resets daily)
        </label>
        <p class="gear-note" style="margin:0;">You can set a due date for this task after adding it.</p>
        <div class="inline-row">
          <button class="inline-btn cancel cancel-task-btn" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}">Cancel</button>
          <button class="inline-btn confirm confirm-task-btn" data-cat-id="${escapeHtml(catId)}" data-subcat-id="${escapeHtml(subcatId)}">Add</button>
        </div>
      </div>
    `;
  }

  function attachCategoryListeners() {
    // Delete category
    document.querySelectorAll('.delete-cat-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteCategory(btn.dataset.catId));
    });

    // Add subcategory trigger
    document.querySelectorAll('.add-subcat-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        addingSubcatFor = btn.dataset.catId;
        renderCategories();
      });
    });
    document.querySelectorAll('.cancel-subcat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        addingSubcatFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.confirm-subcat-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const input = document.querySelector(`.new-subcat-name[data-cat-id="${btn.dataset.catId}"]`);
        const name = input.value.trim();
        if (!name) return;
        const newSubcatId = await addSubcategory(btn.dataset.catId, name);
        expandedSubcats.add(newSubcatId);
        addingSubcatFor = null;
        renderCategories();
      });
    });

    // Delete subcategory
    document.querySelectorAll('.delete-subcat-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteSubcategory(btn.dataset.catId, btn.dataset.subcatId);
      });
    });

    // Expand/collapse subcategory
    document.querySelectorAll('.subcat-header').forEach(header => {
      header.addEventListener('click', () => {
        const subcatId = header.dataset.subcatId;
        if (expandedSubcats.has(subcatId)) {
          expandedSubcats.delete(subcatId);
        } else {
          expandedSubcats.add(subcatId);
        }
        renderCategories();
      });
    });

    // Add task trigger
    document.querySelectorAll('.add-task-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        addingTaskFor = { categoryId: btn.dataset.catId, subcatId: btn.dataset.subcatId };
        renderCategories();
      });
    });
    document.querySelectorAll('.cancel-task-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        addingTaskFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.confirm-task-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const catId = btn.dataset.catId, subcatId = btn.dataset.subcatId;
        const textInput = document.querySelector(`.new-task-text[data-cat-id="${escapeHtml(catId)}"][data-subcat-id="${escapeHtml(subcatId)}"]`);
        const recurringInput = document.querySelector(`.new-task-recurring[data-cat-id="${escapeHtml(catId)}"][data-subcat-id="${escapeHtml(subcatId)}"]`);
        const text = textInput.value.trim();
        if (!text) return;
        await addTask(catId, subcatId, text, recurringInput.checked, null);
        addingTaskFor = null;
        renderCategories();
      });
    });

    // Category due date button
    document.querySelectorAll('.cat-due-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        editingDueDateFor = editingDueDateFor === btn.dataset.catId ? null : btn.dataset.catId;
        renderCategories();
      });
    });
    document.querySelectorAll('.cancel-due-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        editingDueDateFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.clear-due-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await updateCategoryDueDate(btn.dataset.catId, '');
        editingDueDateFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.save-due-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const input = document.querySelector(`.due-date-input[data-cat-id="${btn.dataset.catId}"]`);
        await updateCategoryDueDate(btn.dataset.catId, input.value);
        editingDueDateFor = null;
        renderCategories();
      });
    });

    // Toggle task
    document.querySelectorAll('.task-box, .task-text').forEach(el => {
      el.addEventListener('click', async () => {
        const catId = el.dataset.catId, subcatId = el.dataset.subcatId, taskId = el.dataset.taskId;
        const cat = state.categories.find(c => c.id === catId);
        const subcat = cat && cat.subcategories.find(s => s.id === subcatId);
        const task = subcat && subcat.tasks.find(t => t.id === taskId);
        if (task) await toggleTask(task);
      });
    });

    // Delete task
    document.querySelectorAll('.delete-task-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteTask(btn.dataset.catId, btn.dataset.subcatId, btn.dataset.taskId));
    });

    // Task due date button
    document.querySelectorAll('.task-due-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = { catId: btn.dataset.catId, subcatId: btn.dataset.subcatId, taskId: btn.dataset.taskId };
        const isSame = editingTaskDueFor && editingTaskDueFor.catId === key.catId
          && editingTaskDueFor.subcatId === key.subcatId && editingTaskDueFor.taskId === key.taskId;
        editingTaskDueFor = isSame ? null : key;
        renderCategories();
      });
    });
    document.querySelectorAll('.cancel-task-due-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        editingTaskDueFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.clear-task-due-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await updateTaskScheduledDate(btn.dataset.catId, btn.dataset.subcatId, btn.dataset.taskId, '');
        editingTaskDueFor = null;
        renderCategories();
      });
    });
    document.querySelectorAll('.save-task-due-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const input = document.querySelector(`.task-due-date-input[data-task-id="${btn.dataset.taskId}"]`);
        await updateTaskScheduledDate(btn.dataset.catId, btn.dataset.subcatId, btn.dataset.taskId, input.value);
        editingTaskDueFor = null;
        renderCategories();
      });
    });
  }

  // ---- Auth UI ----

  function renderAuthLoggedOut() {
    const card = document.getElementById('authCard');
    card.style.display = 'flex';
    card.innerHTML = `
      <div>
        <p class="auth-status">Not logged in</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="auth-btn secondary" id="loginBtn">Log in</button>
        <button class="auth-btn" id="signupBtn">Sign up</button>
      </div>
    `;
    document.getElementById('signupBtn').addEventListener('click', () => netlifyIdentity.open('signup'));
    document.getElementById('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'));

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Not logged in</p>
      <p class="gear-note">Log in to see account options here.</p>
    `;
  }

  function renderAuthLoggedIn(user) {
    const card = document.getElementById('authCard');
    card.style.display = 'none';
    card.innerHTML = '';

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Logged in</p>
      <p class="gear-email">${escapeHtml(user.email)}</p>
      <button class="auth-btn secondary" id="logoutBtn" style="width:100%;">Log out</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', () => netlifyIdentity.logout());
  }

  // ---- Archive ----

  let archiveOpen = false;

  function gatherArchiveDates() {
    const dates = new Set();

    Object.keys(state.completions).forEach(date => {
      const dayMap = state.completions[date] || {};
      if (Object.values(dayMap).some(Boolean)) dates.add(date);
    });

    state.categories.forEach(cat => {
      cat.subcategories.forEach(sc => {
        sc.tasks.forEach(t => {
          if (!t.recurring && t.completedDate) dates.add(t.completedDate);
        });
      });
    });

    return Array.from(dates).sort().reverse();
  }

  function getArchiveItemsForDate(date) {
    const items = [];
    const dayCompletions = state.completions[date] || {};

    state.categories.forEach(cat => {
      cat.subcategories.forEach(sc => {
        sc.tasks.forEach(t => {
          const path = `${cat.name} > ${sc.name}`;
          if (t.recurring && dayCompletions[t.id]) {
            items.push({ text: t.text, path, recurring: true });
          } else if (!t.recurring && t.completedDate === date) {
            items.push({ text: t.text, path, recurring: false });
          }
        });
      });
    });

    return items;
  }

  function formatArchiveDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderArchivePanel() {
    const panel = document.getElementById('archivePanel');
    const dates = gatherArchiveDates();

    if (dates.length === 0) {
      panel.innerHTML = '<p class="archive-empty">No completed tasks recorded yet</p>';
      return;
    }

    panel.innerHTML = dates.map(date => {
      const items = getArchiveItemsForDate(date);
      return `
        <div class="archive-date-card">
          <div class="archive-date-header" data-date="${escapeHtml(date)}">
            <span>${formatArchiveDate(date)}</span>
            <span class="archive-date-count">${items.length} completed</span>
          </div>
          <div class="archive-date-body" id="archive-body-${escapeHtml(date)}">
            ${items.map(item => `
              <div class="archive-item">
                ${escapeHtml(item.text)}
                <span class="archive-item-path">${escapeHtml(item.path)}${item.recurring ? ' &middot; Recurring' : ''}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }).join('');

    panel.querySelectorAll('.archive-date-header').forEach(header => {
      header.addEventListener('click', () => {
        const body = document.getElementById(`archive-body-${header.dataset.date}`);
        body.classList.toggle('open');
      });
    });
  }

  function initArchiveToggle() {
    const btn = document.getElementById('archiveToggleBtn');
    const panel = document.getElementById('archivePanel');
    btn.addEventListener('click', () => {
      archiveOpen = !archiveOpen;
      panel.classList.toggle('open', archiveOpen);
      btn.textContent = archiveOpen ? 'Hide archive' : 'View archive';
      if (archiveOpen) renderArchivePanel();
    });
  }

  // ---- Init ----
  // Theme + nav dropdown behavior now lives in /js/rotulus-shared.js.

  /* Render from localStorage on the very first frame. This used to show
     "Loading your tasks…" and wait for netlifyIdentity.init() plus a
     pullFromServer() round trip before painting anything — even though the
     tasks were already on the device. index/goals/diary/pomodoro/dashboard
     all already work this way; To-Do was the odd one out.
     applyArchiveDeepLink() deliberately stays out of here: it must only run
     after a render that has final data, or on a synced device it opens the
     archive over tasks the pull is about to replace. */
  function initApp() {
    /* Best-effort: this is now the first code to touch stored data, and state
       written by an older build could be shaped differently (a category with
       no `subcategories` array, say). An exception here would propagate out of
       the DOMContentLoaded handler below and stop initIdentity() from ever
       running — so bad local data would also cost you login and sync. The
       identity handlers re-render from server data regardless, so failing
       quietly here loses nothing but the head start. */
    try {
      // Read the two view preferences before the first render, or the list
      // paints unsorted and fully expanded and then visibly rearranges itself.
      currentSort = loadSort();
      collapsedGroups = loadCollapsed();
      renderSortRow();
      loadLocal();
      renderCategories();
    } catch (e) {
      console.error('Local render failed; falling back to the synced copy', e);
    }
    renderAddCategoryArea();
    initArchiveToggle();
  }


  /* Landing for the dashboard's "Tasks completed" card, which links here as
     todo.html#archive. Reuses the real toggle rather than setting .open by
     hand, so archiveOpen and the button label stay in step. Called after each
     render path that has final data — on a synced device the login pull
     replaces everything, and an archive opened before that would show the
     wrong tasks. */
  let archiveScrolled = false;

  function applyArchiveDeepLink() {
    if (window.location.hash !== '#archive') return;
    const btn = document.getElementById('archiveToggleBtn');
    const panel = document.getElementById('archivePanel');
    if (!btn || !panel) return;

    if (!archiveOpen) btn.click();
    else renderArchivePanel(); // fresh data landed under an already-open panel

    if (archiveScrolled) return;
    archiveScrolled = true;
    requestAnimationFrame(() => panel.scrollIntoView({ behavior: 'smooth', block: 'start' }));
  }

  function initIdentity() {
    if (typeof netlifyIdentity === 'undefined') {
      document.getElementById('authCard').innerHTML =
        '<p class="auth-status">Identity widget failed to load. Check your connection and reload.</p>';
      firstSyncPending = false;
      loadLocal();
      renderCategories();
      applyArchiveDeepLink();
      return;
    }

    netlifyIdentity.on('init', async user => {
      currentUser = user || null;
      if (user) {
        renderAuthLoggedIn(user);
        await pullFromServer();
      } else {
        renderAuthLoggedOut();
      }
      firstSyncPending = false;
      loadLocal();
      renderCategories();
      renderSyncNote();
      applyArchiveDeepLink();
    });

    netlifyIdentity.on('login', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      netlifyIdentity.close();
      const pulled = await pullFromServer();
      firstSyncPending = false;
      loadLocal();
      renderCategories();
      /* Only upload when the download succeeded AND this device actually has
         something to contribute. Either guard alone is not enough. */
      if (pulled && hasLocalData()) await pushToServer();
      renderSyncNote();
      applyArchiveDeepLink();
    });

    netlifyIdentity.on('logout', () => {
      currentUser = null;
      renderAuthLoggedOut();
      renderSyncNote();
    });

    netlifyIdentity.on('signup', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      await pushToServer();
    });

    netlifyIdentity.init();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initApp();

    /* If the Identity widget loads but never fires 'init' — offline, or the
       script blocked — nothing would ever clear firstSyncPending and the
       skeleton would sit there for good. Stop waiting after 6s and show the
       honest empty state. */
    setTimeout(() => {
      if (!firstSyncPending) return;
      firstSyncPending = false;
      renderCategories();
    }, 6000);

    if (typeof netlifyIdentity !== 'undefined') {
      initIdentity();
    } else {
      window.addEventListener('load', initIdentity);
    }
  });
})();
</script>
