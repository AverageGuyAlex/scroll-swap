<script>try{var t=localStorage.getItem('scrollswap_theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.classList.add('theme-dark');}catch(e){}try{var d=sessionStorage.getItem('rotulus_vt_dir');if(d){document.documentElement.dataset.vtDir=d;sessionStorage.removeItem('rotulus_vt_dir');}}catch(e){}</script>

<style>
  /* Page-specific: goals */

  .add-goal-btn {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: var(--r-pill);
    padding: 14px;
    cursor: pointer;
    margin-bottom: 16px;
    box-shadow: var(--shadow-card);
  }
  .add-goal-btn:active { background: var(--primary-strong); }
  .inline-form {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .inline-input {
    width: 100%; font-family: var(--font-body); font-weight: 600; font-size: 14px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px;
  }
  .inline-row { display: flex; gap: 8px; align-items: center; }
  .inline-btn {
    font-family: var(--font-body); font-weight: 800; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
    border: none; border-radius: var(--r-pill); padding: 10px 14px; cursor: pointer;
  }
  .inline-btn.confirm { background: var(--green); color: #FFFFFF; flex: 1; }
  .inline-btn.cancel { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); }
  .field-label { font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-dim); margin: 0 0 2px; }

  /* Goal card */
  .goal-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--shadow-card); padding: 18px; margin-bottom: 16px;
  }
  .goal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .goal-name { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin: 0; }
  .goal-name.completed { color: var(--green); text-decoration: line-through; }
  .goal-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn { background: transparent; border: none; color: var(--ink-dim); cursor: pointer; font-size: 15px; padding: 4px 6px; }

  .goal-due-btn {
    font-family: var(--font-body); font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--green); background: var(--acc-green-soft);
    border: none; border-radius: var(--r-pill); padding: 6px 11px; cursor: pointer;
  }
  .goal-due-btn.overdue { color: var(--danger); background: var(--acc-red-soft); }
  .due-date-editor {
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px;
    margin: 10px 0; display: flex; flex-direction: column; gap: 10px;
  }

  .progress-track {
    width: 100%; height: 10px; border-radius: var(--r-pill); background: var(--bg); overflow: hidden; margin: 12px 0 6px;
    border: 1px solid var(--line);
  }
  .progress-fill { height: 100%; background: var(--green); border-radius: var(--r-pill); transition: width 0.3s var(--ease); }
  .progress-fill.overdue { background: var(--danger); }
  .progress-label { font-weight: 600; font-size: 11.5px; color: var(--ink-dim); margin: 0 0 14px; }

  .complete-toggle-btn {
    width: 100%; font-family: var(--font-body); font-weight: 800; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    border-radius: var(--r-pill); padding: 11px; cursor: pointer; margin-bottom: 14px; border: 1px solid var(--green);
    background: transparent; color: var(--green);
  }
  .complete-toggle-btn.is-complete { background: var(--green); color: #FFFFFF; border-color: var(--green); }

  .goal-section-title {
    font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--primary); margin: 16px 0 8px;
  }

  /* Milestones */
  .milestone-row { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); }
  .milestone-row:last-child { border-bottom: none; }
  .milestone-box {
    width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--ink-dim); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
  }
  .milestone-box.checked { background: var(--green); border-color: var(--green); }
  .milestone-box svg { opacity: 0; transform: scale(0.6); transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
  .milestone-box.checked svg { opacity: 1; transform: scale(1); }
  .milestone-text { flex: 1; font-weight: 600; font-size: 13.5px; cursor: pointer; }
  .milestone-text.checked { color: var(--ink-dim); text-decoration: line-through; }
  .milestone-date { font-weight: 700; font-size: 10px; color: var(--ink-dim); flex-shrink: 0; }

  .add-row-btn {
    background: none; border: none; color: var(--primary); font-family: var(--font-body); font-weight: 700;
    font-size: 12px; cursor: pointer; padding: 8px 4px;
  }

  /* Hours log */
  .hours-total-row {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px;
  }
  .hours-total-num { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--primary); }
  .hours-total-label { font-weight: 800; font-size: 10px; letter-spacing: 0.06em; color: var(--ink-dim); text-transform: uppercase; }
  .hours-form { display: flex; gap: 6px; margin-bottom: 10px; }
  .hours-date-input, .hours-num-input {
    font-family: var(--font-body); font-weight: 600; font-size: 12.5px; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 6px; min-width: 0;
  }
  .hours-date-input { flex: 1.6; }
  .hours-num-input { flex: 0.7; }
  .hours-save-btn {
    background: var(--green); color: #FFFFFF; border: none; border-radius: var(--r-pill); padding: 8px 14px;
    font-family: var(--font-body); font-weight: 800; font-size: 10.5px; text-transform: uppercase; cursor: pointer;
    flex-shrink: 0;
  }
  .hours-entry-row {
    display: flex; justify-content: space-between; align-items: center; padding: 6px 2px;
    font-weight: 700; font-size: 12.5px; color: var(--ink-dim); cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .hours-entry-row:last-child { border-bottom: none; }
  .hours-entry-row:hover { color: var(--ink); }

  .empty-note { font-weight: 600; font-size: 12.5px; color: var(--ink-dim); text-align: center; padding: 20px 0; }
  .sync-note { margin-top: 16px; }
</style>
</head>
<body>
<div id="app">
  <div class="nav-row">
    <button class="gear-btn" id="gearToggle" title="Settings" aria-label="Settings">&#9881;</button>
    <div class="gear-dropdown" id="gearDropdown">
      <div id="gearAccountSection"></div>
      <a href="lock-in.html" class="gear-settings-link">&#128274; Lock In</a>
      <a href="settings.html" class="gear-settings-link">&#9881; Settings</a>
    </div>
  </div>

  <div class="header">
    <img class="header-art" src="/assets/header-illustration.png" alt="" onerror="this.style.display='none'">
    <p class="eyebrow">Long-term</p>
    <h1 class="title">Goals</h1>
    <p class="subtitle">Set a deadline, track milestones, log your hours.</p>
  </div>

  <div class="auth-card" id="authCard">
    <p class="auth-status">Checking login&hellip;</p>
  </div>

  <div id="addGoalArea"></div>
  <div id="goalsList"></div>

  <p class="sync-note" id="syncNote"></p>
</div>

<script>
(function() {
  const STATE_KEY = 'scrollswap_goals_state';
  const FUNCTION_URL = '/.netlify/functions/goals';

  let currentUser = null;
  let syncing = false;
  let syncFailed = false;
  let state = { goals: [] };
  let addingGoal = false;
  let editingDueDateFor = null; // goal id
  let addingMilestoneFor = null; // goal id
  let hoursFormDraft = {}; // goalId -> { date, hours } currently in the input fields

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function formatShortDate(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // ---- Storage ----

  function loadLocal() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      state = raw ? JSON.parse(raw) : { goals: [] };
      if (!state.goals) state.goals = [];
    } catch (e) { state = { goals: [] }; }
  }

  function saveLocal() {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
    catch (e) { console.error('Save failed', e); }
  }

  function hasLocalData() {
    return !!(state && state.goals && state.goals.length);
  }

  /* Returns true only if the download actually completed. Callers MUST check
     this before uploading: pushing after a failed download would overwrite the
     server copy with whatever this device happens to hold, which may be nothing
     (e.g. a brand new browser, or a fresh domain — localStorage is per-domain). */
  async function pullFromServer() {
    if (!currentUser) return false;
    try {
      const token = await currentUser.jwt();
      const res = await fetch(FUNCTION_URL, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) { syncFailed = true; return false; }
      const serverState = await res.json();
      if (serverState && serverState.goals) {
        state = { goals: serverState.goals };
        saveLocal();
      }
      syncFailed = false;
      return true;
    } catch (e) {
      console.error('Pull failed', e);
      syncFailed = true;
      return false;
    }
  }

  async function pushToServer() {
    if (!currentUser) return;
    syncing = true;
    renderSyncNote();
    try {
      const token = await currentUser.jwt();
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(state),
      });
      syncFailed = !res.ok;
    } catch (e) {
      console.error('Push failed', e);
      syncFailed = true;
    } finally {
      syncing = false;
      renderSyncNote();
    }
  }

  function renderSyncNote() {
    const el = document.getElementById('syncNote');
    if (!el) return;
    if (!currentUser) el.textContent = 'Not synced — log in to save across devices';
    else if (syncing) el.textContent = 'Syncing…';
    else if (syncFailed) el.textContent = '⚠ Sync failed — this device’s data is safe, but not saved to your account';
    else el.textContent = 'Synced to your account';
  }

  async function persist() {
    saveLocal();
    if (currentUser) await pushToServer();
  }

  // ---- Mutations ----

  async function addGoal(name, dueDate) {
    state.goals.push({
      id: uid(), name, dueDate: dueDate || null, createdDate: todayKey(),
      completed: false, milestones: [], dailyHours: {},
    });
    await persist();
  }

  async function deleteGoal(goalId) {
    if (!confirm('Delete this goal and all its progress?')) return;
    state.goals = state.goals.filter(g => g.id !== goalId);
    await persist();
    renderGoals();
  }

  async function updateGoalDueDate(goalId, dueDate) {
    const goal = state.goals.find(g => g.id === goalId);
    if (goal) goal.dueDate = dueDate || null;
    await persist();
  }

  function toggleGoalCompleted(goalId) {
    const goal = state.goals.find(g => g.id === goalId);
    if (goal) goal.completed = !goal.completed;
    // Update the UI immediately; the save/sync runs in the background.
    renderGoals();
    persist();
  }

  async function addMilestone(goalId, text) {
    const goal = state.goals.find(g => g.id === goalId);
    if (goal) goal.milestones.push({ id: uid(), text, done: false, completedDate: null });
    await persist();
  }

  function toggleMilestone(goalId, milestoneId) {
    const goal = state.goals.find(g => g.id === goalId);
    const m = goal && goal.milestones.find(x => x.id === milestoneId);
    if (m) {
      m.done = !m.done;
      m.completedDate = m.done ? todayKey() : null;
    }
    // Update the UI immediately; the save/sync runs in the background.
    renderGoals();
    persist();
  }

  async function deleteMilestone(goalId, milestoneId) {
    const goal = state.goals.find(g => g.id === goalId);
    if (goal) goal.milestones = goal.milestones.filter(m => m.id !== milestoneId);
    await persist();
    renderGoals();
  }

  async function setHoursForDate(goalId, date, hours) {
    const goal = state.goals.find(g => g.id === goalId);
    if (!goal) return;
    const num = parseFloat(hours);
    if (!date || isNaN(num) || num < 0) return;
    if (num === 0) delete goal.dailyHours[date];
    else goal.dailyHours[date] = num;
    await persist();
    renderGoals();
  }

  // ---- Calculations ----

  function goalProgressPercent(goal) {
    if (!goal.dueDate) return null;
    const created = new Date(goal.createdDate + 'T00:00:00');
    const due = new Date(goal.dueDate + 'T00:00:00');
    const today = new Date(todayKey() + 'T00:00:00');
    if (due <= created) return today >= due ? 100 : 0;
    const pct = ((today - created) / (due - created)) * 100;
    return Math.max(0, Math.min(100, pct));
  }

  function goalIsOverdue(goal) {
    return goal.dueDate && !goal.completed && goal.dueDate < todayKey();
  }

  function goalDaysLabel(goal) {
    if (!goal.dueDate) return '';
    const due = new Date(goal.dueDate + 'T00:00:00');
    const today = new Date(todayKey() + 'T00:00:00');
    const diffDays = Math.round((due - today) / 86400000);
    if (diffDays > 0) return `${diffDays} day${diffDays === 1 ? '' : 's'} left`;
    if (diffDays === 0) return 'Due today';
    return `${Math.abs(diffDays)} day${Math.abs(diffDays) === 1 ? '' : 's'} overdue`;
  }

  function totalHoursForGoal(goal) {
    return Object.values(goal.dailyHours).reduce((sum, h) => sum + h, 0);
  }

  function checkmarkSVG() {
    return '<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  // ---- Rendering ----

  function renderAddGoalArea() {
    const area = document.getElementById('addGoalArea');
    if (!addingGoal) {
      area.innerHTML = `<button class="add-goal-btn" id="showAddGoalBtn">+ Add goal</button>`;
      document.getElementById('showAddGoalBtn').addEventListener('click', () => {
        addingGoal = true;
        renderAddGoalArea();
      });
      return;
    }
    area.innerHTML = `
      <div class="inline-form">
        <p class="field-label">Goal name</p>
        <input type="text" class="inline-input" id="newGoalName" placeholder="e.g. Run a half marathon">
        <p class="field-label">Due date</p>
        <input type="date" class="inline-input" id="newGoalDueDate">
        <div class="inline-row">
          <button class="inline-btn cancel" id="cancelGoalBtn">Cancel</button>
          <button class="inline-btn confirm" id="confirmGoalBtn">Add</button>
        </div>
      </div>
    `;
    document.getElementById('cancelGoalBtn').addEventListener('click', () => {
      addingGoal = false;
      renderAddGoalArea();
    });
    document.getElementById('confirmGoalBtn').addEventListener('click', async () => {
      const name = document.getElementById('newGoalName').value.trim();
      const dueDate = document.getElementById('newGoalDueDate').value;
      if (!name) return;
      await addGoal(name, dueDate);
      addingGoal = false;
      renderAddGoalArea();
      renderGoals();
    });
  }

  function renderGoals() {
    const list = document.getElementById('goalsList');
    if (state.goals.length === 0) {
      list.innerHTML = '<p class="empty-note">No goals yet. Add one to start tracking.</p>';
      return;
    }
    list.innerHTML = state.goals.map(g => renderGoalCard(g)).join('');
    attachGoalListeners();
  }

  function renderGoalCard(goal) {
    const pct = goalProgressPercent(goal);
    const overdue = goalIsOverdue(goal);
    const totalHours = totalHoursForGoal(goal);
    const sortedHours = Object.keys(goal.dailyHours).sort().reverse();
    const draft = hoursFormDraft[goal.id] || { date: todayKey(), hours: '' };

    return `
      <div class="goal-card" data-goal-id="${goal.id}">
        <div class="goal-header">
          <p class="goal-name ${goal.completed ? 'completed' : ''}">${goal.name}</p>
          <div class="goal-actions">
            <button class="icon-btn delete-goal-btn" data-goal-id="${goal.id}">&times;</button>
          </div>
        </div>

        <button class="goal-due-btn ${overdue ? 'overdue' : ''}" data-goal-id="${goal.id}">
          ${goal.dueDate ? `Due ${formatShortDate(goal.dueDate)}` : 'Set due date'}
        </button>

        ${editingDueDateFor === goal.id ? `
          <div class="due-date-editor">
            <input type="date" class="inline-input goal-due-date-input" data-goal-id="${goal.id}" value="${goal.dueDate || ''}">
            <div class="inline-row">
              <button class="inline-btn cancel clear-goal-due-btn" data-goal-id="${goal.id}">Clear</button>
              <button class="inline-btn cancel cancel-goal-due-btn" data-goal-id="${goal.id}">Cancel</button>
              <button class="inline-btn confirm save-goal-due-btn" data-goal-id="${goal.id}">Save</button>
            </div>
          </div>
        ` : ''}

        ${pct !== null ? `
          <div class="progress-track"><div class="progress-fill ${overdue ? 'overdue' : ''}" style="width:${pct}%;"></div></div>
          <p class="progress-label">${Math.round(pct)}% of the way to the deadline &middot; ${goalDaysLabel(goal)}</p>
        ` : ''}

        <button class="complete-toggle-btn ${goal.completed ? 'is-complete' : ''}" data-goal-id="${goal.id}">
          ${goal.completed ? '&#10003; Completed' : 'Mark as complete'}
        </button>

        <p class="goal-section-title">Milestones</p>
        ${goal.milestones.map(m => `
          <div class="milestone-row">
            <div class="milestone-box ${m.done ? 'checked' : ''}" data-goal-id="${goal.id}" data-milestone-id="${m.id}">${checkmarkSVG()}</div>
            <span class="milestone-text ${m.done ? 'checked' : ''}" data-goal-id="${goal.id}" data-milestone-id="${m.id}">${m.text}</span>
            ${m.done && m.completedDate ? `<span class="milestone-date">${formatShortDate(m.completedDate)}</span>` : ''}
            <button class="icon-btn delete-milestone-btn" data-goal-id="${goal.id}" data-milestone-id="${m.id}">&times;</button>
          </div>
        `).join('')}
        ${addingMilestoneFor === goal.id ? `
          <div class="inline-form" style="margin-top:8px;">
            <input type="text" class="inline-input new-milestone-text" data-goal-id="${goal.id}" placeholder="Milestone (e.g. Run 10k without stopping)">
            <div class="inline-row">
              <button class="inline-btn cancel cancel-milestone-btn" data-goal-id="${goal.id}">Cancel</button>
              <button class="inline-btn confirm confirm-milestone-btn" data-goal-id="${goal.id}">Add</button>
            </div>
          </div>
        ` : `<button class="add-row-btn add-milestone-trigger" data-goal-id="${goal.id}">+ Add milestone</button>`}

        <p class="goal-section-title">Hours worked</p>
        <div class="hours-total-row">
          <span class="hours-total-num">${totalHours}</span>
          <span class="hours-total-label">total hours logged</span>
        </div>
        <div class="hours-form">
          <input type="date" class="hours-date-input" data-goal-id="${goal.id}" id="hours-date-${goal.id}" value="${draft.date}">
          <input type="number" step="0.25" min="0" class="hours-num-input" data-goal-id="${goal.id}" id="hours-num-${goal.id}" placeholder="Hours" value="${draft.hours}">
          <button class="hours-save-btn save-hours-btn" data-goal-id="${goal.id}">Save</button>
        </div>
        ${sortedHours.length > 0 ? sortedHours.map(date => `
          <div class="hours-entry-row edit-hours-entry" data-goal-id="${goal.id}" data-date="${date}" data-hours="${goal.dailyHours[date]}">
            <span>${formatShortDate(date)}</span>
            <span>${goal.dailyHours[date]}h</span>
          </div>
        `).join('') : '<p class="empty-note" style="padding:8px 0;">No hours logged yet</p>'}
      </div>
    `;
  }

  function attachGoalListeners() {
    document.querySelectorAll('.delete-goal-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteGoal(btn.dataset.goalId));
    });

    document.querySelectorAll('.goal-due-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        editingDueDateFor = editingDueDateFor === btn.dataset.goalId ? null : btn.dataset.goalId;
        renderGoals();
      });
    });
    document.querySelectorAll('.cancel-goal-due-btn').forEach(btn => {
      btn.addEventListener('click', () => { editingDueDateFor = null; renderGoals(); });
    });
    document.querySelectorAll('.clear-goal-due-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await updateGoalDueDate(btn.dataset.goalId, '');
        editingDueDateFor = null;
        renderGoals();
      });
    });
    document.querySelectorAll('.save-goal-due-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const input = document.querySelector(`.goal-due-date-input[data-goal-id="${btn.dataset.goalId}"]`);
        await updateGoalDueDate(btn.dataset.goalId, input.value);
        editingDueDateFor = null;
        renderGoals();
      });
    });

    document.querySelectorAll('.complete-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleGoalCompleted(btn.dataset.goalId));
    });

    document.querySelectorAll('.milestone-box, .milestone-text').forEach(el => {
      el.addEventListener('click', () => toggleMilestone(el.dataset.goalId, el.dataset.milestoneId));
    });
    document.querySelectorAll('.delete-milestone-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteMilestone(btn.dataset.goalId, btn.dataset.milestoneId));
    });

    document.querySelectorAll('.add-milestone-trigger').forEach(btn => {
      btn.addEventListener('click', () => { addingMilestoneFor = btn.dataset.goalId; renderGoals(); });
    });
    document.querySelectorAll('.cancel-milestone-btn').forEach(btn => {
      btn.addEventListener('click', () => { addingMilestoneFor = null; renderGoals(); });
    });
    document.querySelectorAll('.confirm-milestone-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const input = document.querySelector(`.new-milestone-text[data-goal-id="${btn.dataset.goalId}"]`);
        const text = input.value.trim();
        if (!text) return;
        await addMilestone(btn.dataset.goalId, text);
        addingMilestoneFor = null;
        renderGoals();
      });
    });

    document.querySelectorAll('.save-hours-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const goalId = btn.dataset.goalId;
        const dateInput = document.getElementById(`hours-date-${goalId}`);
        const hoursInput = document.getElementById(`hours-num-${goalId}`);
        await setHoursForDate(goalId, dateInput.value, hoursInput.value);
        hoursFormDraft[goalId] = { date: todayKey(), hours: '' };
      });
    });

    document.querySelectorAll('.hours-date-input, .hours-num-input').forEach(input => {
      input.addEventListener('input', () => {
        const goalId = input.dataset.goalId;
        if (!hoursFormDraft[goalId]) hoursFormDraft[goalId] = { date: todayKey(), hours: '' };
        const dateInput = document.getElementById(`hours-date-${goalId}`);
        const hoursInput = document.getElementById(`hours-num-${goalId}`);
        hoursFormDraft[goalId] = { date: dateInput.value, hours: hoursInput.value };
      });
    });

    document.querySelectorAll('.edit-hours-entry').forEach(row => {
      row.addEventListener('click', () => {
        const goalId = row.dataset.goalId;
        hoursFormDraft[goalId] = { date: row.dataset.date, hours: row.dataset.hours };
        renderGoals();
      });
    });
  }

  // ---- Auth UI ----

  function renderAuthLoggedOut() {
    const card = document.getElementById('authCard');
    card.style.display = 'flex';
    card.innerHTML = `
      <div><p class="auth-status">Not logged in</p></div>
      <div style="display:flex; gap:8px;">
        <button class="auth-btn secondary" id="loginBtn">Log in</button>
        <button class="auth-btn" id="signupBtn">Sign up</button>
      </div>
    `;
    document.getElementById('signupBtn').addEventListener('click', () => netlifyIdentity.open('signup'));
    document.getElementById('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'));

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `<p class="gear-status">Not logged in</p><p class="gear-note">Log in to see account options here.</p>`;
  }

  function renderAuthLoggedIn(user) {
    const card = document.getElementById('authCard');
    card.style.display = 'none';
    card.innerHTML = '';
    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Logged in</p>
      <p class="gear-email">${user.email}</p>
      <button class="auth-btn secondary" id="logoutBtn" style="width:100%;">Log out</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', () => netlifyIdentity.logout());
  }

  // ---- Init ----
  // Theme + nav dropdown behavior now lives in /js/rotulus-shared.js.

  function initApp() {
    loadLocal();
    renderAddGoalArea();
    renderGoals();
  }


  /* Landing for the dashboard's "Goals completed" card, which links here as
     goals.html#completed. Goals aren't filtered or reordered — completed ones
     sit inline in the list — so this scrolls to the first finished goal and
     pulses it. No completed goals means no scroll and no message; the page is
     already showing the honest answer. */
  let completedScrolled = false;

  function applyCompletedDeepLink() {
    if (completedScrolled || window.location.hash !== '#completed') return;

    const cards = Array.from(document.querySelectorAll('.goal-card'));
    const card = cards.find(el => {
      const goal = state.goals.find(g => g.id === el.dataset.goalId);
      return goal && goal.completed;
    });
    if (!card) return;

    completedScrolled = true;
    requestAnimationFrame(() => {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('flash-highlight');
    });
  }

  function initIdentity() {
    if (typeof netlifyIdentity === 'undefined') {
      document.getElementById('authCard').innerHTML = '<p class="auth-status">Identity widget failed to load. Check your connection and reload.</p>';
      applyCompletedDeepLink();
      return;
    }
    netlifyIdentity.on('init', async user => {
      currentUser = user || null;
      if (user) { renderAuthLoggedIn(user); await pullFromServer(); }
      else { renderAuthLoggedOut(); }
      loadLocal();
      renderGoals();
      renderSyncNote();
      applyCompletedDeepLink();
    });
    netlifyIdentity.on('login', async user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      netlifyIdentity.close();
      const pulled = await pullFromServer();
      loadLocal();
      renderGoals();
      /* Only upload when the download succeeded AND this device actually has
         something to contribute. Either guard alone is not enough. */
      if (pulled && hasLocalData()) await pushToServer();
      renderSyncNote();
      applyCompletedDeepLink();
    });
    netlifyIdentity.on('logout', () => { currentUser = null; renderAuthLoggedOut(); renderSyncNote(); });
    netlifyIdentity.on('signup', async user => { currentUser = user; renderAuthLoggedIn(user); await pushToServer(); });
    netlifyIdentity.init();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initApp();
    if (typeof netlifyIdentity !== 'undefined') { initIdentity(); }
    else { window.addEventListener('load', initIdentity); }
  });
})();
</script>
