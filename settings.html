<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Settings &middot; Rotulus</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Settings">
<meta name="theme-color" content="#EDEBF7">

<link rel="apple-touch-icon" sizes="512x512" href="/assets/app-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%236C5CE7'/%3E%3Ccircle cx='90' cy='90' r='16' fill='none' stroke='%23FFFFFF' stroke-width='8'/%3E%3Cpath d='M90 58v-10M90 132v10M58 90h-10M132 90h10M68 68l-7-7M112 112l7 7M112 68l7-7M68 112l-7 7' stroke='%23FFFFFF' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">

<script>try{var t=localStorage.getItem('scrollswap_theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.classList.add('theme-dark');}catch(e){}try{var d=sessionStorage.getItem('rotulus_vt_dir');if(d){document.documentElement.dataset.vtDir=d;sessionStorage.removeItem('rotulus_vt_dir');}}catch(e){}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/rotulus.css?v=2">

<script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script defer src="/js/rotulus-shared.js?v=3"></script>

<style>
  /* Page-specific: settings */

  .section-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    padding: 18px;
    margin-bottom: 16px;
  }
  .section-title {
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--primary);
    margin: 0 0 14px;
  }
  .theme-toggle-row { display: flex; gap: 8px; margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

  .account-section-body { display: flex; flex-direction: column; gap: 10px; }
  .account-logged-in-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .inline-input {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm);
    font-family: var(--font-body); font-weight: 600;
  }
  .setting-label {
    display: block; font-weight: 700; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 8px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="nav-row">
    <button class="gear-btn" id="gearToggle" title="Settings" aria-label="Settings">&#9881;</button>
    <div class="gear-dropdown" id="gearDropdown">
      <div id="gearAccountSection"></div>
      <a href="lock-in.html" class="gear-settings-link">&#128274; Lock In</a>
    </div>
  </div>

  <div class="header">
    <img class="header-art" src="/assets/header-illustration.png" alt="" onerror="this.style.display='none'">
    <p class="eyebrow">Preferences</p>
    <h1 class="title">Settings</h1>
    <p class="subtitle">Your account and how the app looks.</p>
  </div>

  <div class="auth-card" id="authCard">
    <p class="auth-status">Checking login&hellip;</p>
  </div>

  <div class="section-card" id="accountSection" style="display:none;">
    <p class="section-title">Account</p>
    <div class="account-section-body" id="accountSectionBody"></div>
  </div>

  <div class="section-card">
    <p class="section-title">Appearance</p>
    <div class="theme-toggle-row">
      <button class="theme-btn" data-theme="auto">Auto</button>
      <button class="theme-btn" data-theme="dark">Dark</button>
      <button class="theme-btn" data-theme="light">Light</button>
    </div>
    <p class="gear-note" style="margin-top:10px;">Auto follows your device's light/dark setting.</p>
  </div>

  <div class="section-card">
    <p class="section-title">Rotulus</p>
    <label class="setting-label">
      Daily reset time
    </label>
    <select id="resetHourSelect" class="inline-input" style="width:100%; padding:10px 12px; font-size:13.5px;"></select>
    <p class="gear-note" style="margin-top:10px;">Your daily slots and streak will reset at this time each day instead of midnight.</p>
  </div>
</div>

<script>
(function() {
  let currentUser = null;

  // ---- Auth UI ----

  function renderAuthLoggedOut() {
    const card = document.getElementById('authCard');
    card.style.display = 'flex';
    card.innerHTML = `
      <div>
        <p class="auth-status">Not logged in</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="auth-btn secondary" id="loginBtn">Log in</button>
        <button class="auth-btn" id="signupBtn">Sign up</button>
      </div>
    `;
    document.getElementById('signupBtn').addEventListener('click', () => netlifyIdentity.open('signup'));
    document.getElementById('loginBtn').addEventListener('click', () => netlifyIdentity.open('login'));

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Not logged in</p>
      <p class="gear-note">Log in to see account options here.</p>
    `;

    document.getElementById('accountSection').style.display = 'none';
  }

  function renderAuthLoggedIn(user) {
    const card = document.getElementById('authCard');
    card.style.display = 'none';
    card.innerHTML = '';

    const gearAccount = document.getElementById('gearAccountSection');
    gearAccount.innerHTML = `
      <p class="gear-status">Logged in</p>
      <p class="gear-email">${user.email}</p>
      <button class="auth-btn secondary" id="logoutBtnGear" style="width:100%;">Log out</button>
    `;
    document.getElementById('logoutBtnGear').addEventListener('click', () => netlifyIdentity.logout());

    const accountSection = document.getElementById('accountSection');
    accountSection.style.display = 'block';
    document.getElementById('accountSectionBody').innerHTML = `
      <div class="account-logged-in-row">
        <div>
          <p class="auth-status">Logged in as</p>
          <p class="auth-email">${user.email}</p>
        </div>
        <button class="auth-btn secondary" id="logoutBtnMain">Log out</button>
      </div>
    `;
    document.getElementById('logoutBtnMain').addEventListener('click', () => netlifyIdentity.logout());
  }

  // ---- Daily reset time ----

  function formatResetHourLabel(hour) {
    const period = hour < 12 ? 'AM' : 'PM';
    let h12 = hour % 12;
    if (h12 === 0) h12 = 12;
    return `${h12}:00 ${period}`;
  }

  function initResetHour() {
    const select = document.getElementById('resetHourSelect');
    select.innerHTML = Array.from({ length: 24 }, (_, h) =>
      `<option value="${h}">${formatResetHourLabel(h)}</option>`
    ).join('');

    let saved = 0;
    try {
      const raw = localStorage.getItem('scrollswap_reset_hour');
      saved = raw !== null ? parseInt(raw, 10) : 0;
      if (isNaN(saved) || saved < 0 || saved > 23) saved = 0;
    } catch (e) {}
    select.value = String(saved);

    select.addEventListener('change', () => {
      try { localStorage.setItem('scrollswap_reset_hour', select.value); } catch (e) {}
    });
  }

  // ---- Init ----
  // Theme + nav dropdown behavior now lives in /js/rotulus-shared.js.

  function initApp() {
    initResetHour();
  }

  function initIdentity() {
    if (typeof netlifyIdentity === 'undefined') {
      document.getElementById('authCard').innerHTML =
        '<p class="auth-status">Identity widget failed to load. Check your connection and reload.</p>';
      return;
    }

    netlifyIdentity.on('init', user => {
      currentUser = user || null;
      if (user) {
        renderAuthLoggedIn(user);
      } else {
        renderAuthLoggedOut();
      }
    });

    netlifyIdentity.on('login', user => {
      currentUser = user;
      renderAuthLoggedIn(user);
      netlifyIdentity.close();
    });

    netlifyIdentity.on('logout', () => {
      currentUser = null;
      renderAuthLoggedOut();
    });

    netlifyIdentity.on('signup', user => {
      currentUser = user;
      renderAuthLoggedIn(user);
    });

    netlifyIdentity.init();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initApp();
    if (typeof netlifyIdentity !== 'undefined') {
      initIdentity();
    } else {
      window.addEventListener('load', initIdentity);
    }
  });
})();
</script>
</body>
</html>
